*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}

header{background:var(--chrome);border-bottom:1px solid var(--line);font-family:var(--mono)}

.spacer{margin-left:auto}

/* [ ] / [x] instead of a native checkbox — cheap, and it reads as a console. */
.toggle{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);cursor:pointer;user-select:none}

.toggle::before{content:'[ ]';font-family:var(--mono);letter-spacing:-.5px}

#searchwrap{position:relative;display:inline-flex;align-items:center}

#clear[hidden]{display:none}
#matches{min-width:62px;text-align:right}

#panel .kv .ldot{flex:0 0 auto;width:7px;height:7px;border-radius:50%;display:inline-block;transform:translateY(-1px)}

#panel .kv .lstatus{flex:0 0 auto;font-style:normal;font-size:9px;letter-spacing:.04em;
  text-transform:uppercase;border:1px solid;border-radius:2px;padding:0 3px;opacity:.85}
#panel .kv details.linkgrp>summary{cursor:pointer;color:var(--accent);list-style:none;display:inline-block}
#panel .kv details.linkgrp>summary::-webkit-details-marker{display:none}
#panel .kv details.linkgrp>summary::before{content:'\25b8';font-size:9px;margin-right:4px;display:inline-block}
#panel .kv details.linkgrp[open]>summary::before{content:'\25be'}
/* The coloured dot *is* the bullet now. A disc beside it would be two markers

#panel .kv details.linkgrp ul{margin:6px 0 2px;padding:0 0 0 2px;list-style:none}
#panel .kv details.linkgrp li{margin:3px 0;line-height:1.4}

#panel .kv details.linkgrp li a{text-decoration:none}

#panel .close{position:absolute;top:12px;right:12px;border:0;background:transparent;font-size:20px;color:var(--muted);cursor:pointer}
#panel .body{padding:16px 20px;overflow:auto;flex:1}
.md h1,.md h2,.md h3{margin:18px 0 8px;line-height:1.25}.md h1{font-size:18px}.md h2{font-size:15px}.md h3{font-size:14px}

.md pre{background:var(--bg);padding:10px;border-radius:6px;overflow:auto}.md pre code{background:none;padding:0}

#hint b{color:var(--accent);font-weight:600}

const DATA = {"generated": "2026-11-11T21:47:57+00:00", "nodes": [{"path": "CLAUDE.md", "meta": {}, "body": "# Working with this brain\n\nThe project's reasoning lives here as linked markdown with YAML frontmatter \u2014\na graph of typed nodes, no database and no service. The files are the ground\ntruth, which is what makes them equally legible to a person, a diff and you.\n\n**One principle underneath everything**\n([the principle that claims must be checkable](knowledge-catalog/decisions/D0001-claims-must-be-checkable.md)): the\nrecord is only worth keeping if its claims are checkable. An absent note costs\na reader nothing \u2014 they go and look. A confident, stale note costs them the\nthing they would have found by looking.\n\n## The shape\n\nFour categories, left to right. Implementation runs forward; review runs back\nand amends what it finds false.\n\n| Category | Types | Goes in |\n|---|---|---|\n| **Intent** | `goal` `decision` `principle` | `knowledge-catalog/goals/`, `knowledge-catalog/decisions/` |\n| **Approach** *(optional)* | `plan` `spec` | `plans/`, `knowledge-catalog/specs/` |\n| **Action** | `task` | `tasks/<initiative>/` |\n| **Evidence** | `evidence` | `knowledge-catalog/reference/`, `brief/` |\n\nPlus `glossary` \u2014 definitional, outside the four.\n\n**Approach is optional, and a brain with no plans is a correct brain.** Counted\nacross five brains, four have none: where intent arrives from outside as prose\n\u2014 consulting, client work, solo research \u2014 a `task` serves a `decision`\ndirectly and the lineage still terminates. `decision`, `task` and `evidence`\nare 93% of all nodes written so far and are the three to reach for first.\n\n**Nothing cites a node newer than itself.** A goal written today may cite\nevidence from last quarter; editing that older node to point back at the new\ngoal is rewriting history. `superseded_by` and `amends` are the sanctioned\nexceptions, because a reader who reaches a stale node must be carried to its\nreplacement.\n\n**Ids** are a type letter plus four digits, flat and global: `G` goal, `D`\ndecision *and* principle, `P` plan, `S` spec, `T` task, `E` evidence. Always\nallocate with `bin/new`; never pick a number by hand.\n\n## The fields a tool reads\n\nEverything below is read by something. **Nothing else is.** A field you invent\nis inert \u2014 three adopters wrote `supersedes`, `intent:` and `owner`, all\nreasonable, none read by anything, and nothing said so until `bin/unread`\nexisted. If a field here does not apply, **delete the line**; an unfilled\n`<placeholder>` is a lint error.\n\n| field | on | read by | absent means |\n|---|---|---|---|\n| `serves:` | plan, spec, task | `ancestry`, `lint`, `handoff` | the lineage never reaches Intent; `ancestry` reports `\u26a0 UNTERMINATED` |\n| `invariant:` | decision, principle | `constraints`, `relevant`, `handoff` | no one-sentence claim a change could violate |\n| `constrains:` | decision, principle | `constraints`, `index` | **the decision can never match a diff** \u2014 it exists but no tool will ever surface it |\n| `blocked_by:` | task | `status`, `ancestry` | nothing is waiting on anything (D0008 \u2014 a blocker is a node, not a sentence) |\n| `category:` | task | `lint`, `triage` | not `bug`, `enhancement` or `question`; an open question needs `question` (D0009) |\n| `claimed_by:` | task | `status` | nobody holds it; `status` shows it as claimable |\n| `superseded_by:` | any | `lint`, `ancestry`, `relevant` | a reader reaching the stale node is not carried to its replacement |\n| `amends:` | evidence | `lint`, `graph-build` | a retro that corrects something upstream does not say what |\n| `append_only:` | evidence | `lint` | a running record trips the direction rule on every entry |\n| `reviewed:` | evidence | `lint`, `graph-build` | a looking-back pass does not name what it covered |\n| `resource:` | evidence | `lint`, `graph-build` | evidence that was *given* does not point at the original |\n| `initiative_plan:` | plan | `handoff` | with several plans in an initiative, `handoff` has to guess which one |\n| `notes:` | evidence | `note` | `bin/note` cannot find the running record and opens another |\n| `human_fields:` | `config.md` | `unread` | a field people read deliberately is reported as dead on every run |\n\n**The brain describes one repository.** A node may point at an artifact\noutside it \u2014 `resource:` does this, and `bin/lint` errors when the target does\nnot exist \u2014 but **nothing here verifies that file still says what the node\nclaims**. Write such a claim dated and in the past tense: *\"the profile at\n`~/.claude/...` said X on 2026-11-10\"*, not *\"the profile says X\"*. A finding\nonce sat correctly captured in a task log for eight hours while the file it was\nsupposed to change stayed wrong, because a complete record reasonably read as a\nlanded change (D0014).\n\n`constrains:` is the one most often missing and the most expensive: one adopter\nhad it on 1 of 23 decisions, so the check `CLAUDE.md` asks for before every\nchange returned nothing every time they ran it.\n\n## Which kind of node is this\n\nTwo questions settle most of it. `bin/which` asks them, and takes answers\ndirectly \u2014 `bin/which n y` \u2014 so this is one call, not a prompt.\n\n1. **Does it bind future work** \u2014 a choice someone made, yours or a client's,\n   that a later change could violate? \u2192 **decision**. The test is the\n   violation, not who chose: a client setting a policy is a decision even\n   though you were *told* it.\n2. **Has it already happened**, and binds nothing going forward? \u2192 **evidence**.\n\nThen: work somebody could finish \u2192 `task`; an outcome you could later check you\nreached \u2192 `goal`; a rule across cases \u2192 `principle`; the order work gets done\nin \u2192 `plan`.\n\n**None of them clearly? Do not force one.** `bin/note \"<what happened>\"` takes\nit with no type at all, and an entry that stays a journal line still did its\njob (D0012). A wrong type is worse than no type, because a typed node looks\ndecided.\n\n## Reflexes \u2014 these fire without being asked\n\n- **Before any significant change**: `bin/relevant \"<the change>\"` **and**\n  `bin/constraints <paths>`. The first searches by term and misses what the\n  record words differently; the second lists decisions that declared they\n  govern those paths.\n- **Before writing code for a task**: `bin/ancestry <id> --claims`. If it says\n  `\u26a0 UNTERMINATED`, the task has no recorded intent \u2014 say so before building.\n  If an ancestor says `\u26a0 SUPERSEDED`, build against the replacement.\n- **A contradicted decision is stated, never silently overridden.** Two exits\n  only: amend it, or proceed against it with the id in the task's `# Log`.\n- **Supersede, don't delete.** A decision quietly edited to match what got\n  built teaches the reader that the record is written afterwards.\n- **When you learn something the record doesn't know**, write it down then.\n  `bin/note \"<what happened>\"` takes it with no type, no folder and no id \u2014\n  use it by default. Deciding what kind of thing it is costs more than writing\n  it, so do that later, with `bin/which`, or never: an entry that stays a\n  journal line still did its job. Reach for `bin/new <type>` when you already\n  know the answer.\n\n## Tools\n\n| | |\n|---|---|\n| `bin/lint` | the gate: taxonomy, ids, links, direction, frontmatter hazards |\n| `bin/doctor` | is the install sound |\n| `bin/status [initiative]` | task table and the claimable frontier |\n| `bin/relevant \"<change>\"` | what the record already says about a proposal |\n| `bin/constraints <paths>` | which decisions govern these files |\n| `bin/ancestry <id> [--claims]` | walk back to the intent that asked for it |\n| `bin/ancestry <id> --forward` | walk on to what that intent asked for |\n| `bin/reconcile [initiative]` | task status against the repository |\n| `bin/note \"<what happened>\"` | record it now; decide what it is later |\n| `bin/which` | what kind of node is this \u2014 the procedure, in two questions |\n| `bin/new <type> \"<title>\"` | allocate an id and scaffold the node |\n| `bin/stale` | countable claims that no longer match the files |\n| `brain/facts.md` | *(optional)* counts your project can produce, so `stale` can check them |\n| `bin/prove <cmd>` | does that tool's output match what it did to the files |\n| `bin/unread` | frontmatter the record carries that no tool reads |\n| `bin/index` | rebuild folder indexes (`bin/new` calls it) |\n| `bin/graph-build` | rebuild `graph.html` |\n| `bin/handoff <init> --for <who>` | a self-contained page for someone outside the brain |\n\nWhen an initiative holds more than one plan, mark the initiative's own with\n`initiative_plan: true` \u2014 `bin/handoff` otherwise has to guess which one a\nhandoff is about, and it says so when it does. `--plan <path>` overrides.\n\n## Skills, by where they sit on the picture\n\n**Forward** \u2014 `/grill-change` \u2192 *(`/to-spec`)* \u2192 `/to-tasks` \u2192 `/implement`\n\n`/to-spec` is for work with a planning phase. Where intent arrives from outside\nas prose \u2014 consulting, client work, a decision taken in conversation \u2014 go\nstraight from `/grill-change` to `/to-tasks`, and let each task `serves:` the\ndecision it binds to (D0013). Four of five brains measured have never written a\nspec; that is the normal path, not a shortcut.\n**Back** \u2014 `/spec-review` (owns `Testing \u2192 Complete`), `/audit`\n**Off the rails** \u2014 `/interrogate` (ask the brain anything), `/triage`,\n`/wayfinder`, `/research`, `/domain-modeling`, `/code-review` (the artifact,\nnot the graph)\n\n## Don't\n\n- Hand-edit an index or a log where a skill would write it.\n- Renumber anything. Ids are cited from journals, logs and commit messages.\n  `bin/renumber` exists only to resolve a collision.\n- Write into the host repository's own `CLAUDE.md`, `CONTEXT.md` or\n  `docs/adr/`. Those are the team's: read and respect them.\n- Put code in the brain, or a restatement of the code. This holds the *why*\n  that points at the code.\n- Fill a gap with something decision-shaped. \"We didn't decide that\" is an\n  answer.\n\nDepth lives in [knowledge-catalog/howto.md](knowledge-catalog/howto.md) and\n[knowledge-catalog/reference/agent-skills/](knowledge-catalog/reference/agent-skills/index.md).\n", "mtime": "2026-11-11T17:40:41+00:00"}, {"path": "INIT.md", "meta": {}, "body": "# Installing and filling a brain\n\n**This is the whole install.** The operator may have reached it by pointing you\nat a URL with nothing on disk yet, or by running `bin/adopt` already. Step 0\ntells the two apart. Everything after it fills the brain with the project.\n\nIt is a document rather than a skill on purpose\n([why this is a document and not a skill](knowledge-catalog/decisions/D0010-init-is-a-document.md)): Claude Code\ndiscovers skills when a session *starts*, so a skill created during this\nsession cannot be called by the session that created it. Three adoptions\nproved that three times. Read this and follow it.\n\nInstalling and filling stay two mechanical steps, and `bin/adopt` is still the\none that installs\n([the placement and install decision](knowledge-catalog/decisions/D0004-placement-and-install.md)).\nWhat changed is that the operator types one thing instead of two: you run\n`adopt` for them. They fail differently and rerun on different schedules \u2014\n`adopt` once per brain, this once per repository it describes \u2014 so keep them\napart when you rerun.\n\n## Step 0 \u2014 is the brain on disk yet?\n\n```bash\nls brain/config.md 2>/dev/null || ls config.md 2>/dev/null\n```\n\n**If it exists, the brain is installed.** Skip to the branch test below.\n\n**If it does not, install it now.** Do not guess the placement \u2014 it is the one\nthing the operator must choose, and it is not recoverable by moving files\nafterwards, because `config.md` records the mode and the tools read it.\n\nAsk them, in these words or close to them:\n\n> Where should the brain live?\n>\n> - **Embedded** \u2014 `brain/` inside this repository. The default. The record and\n>   the code it describes move in the same commit, so \"this decision was true\n>   at this commit\" is checkable rather than asserted, and a reviewer meets the\n>   decision in the pull request.\n> - **Sibling** \u2014 its own repository beside the project, which you then run\n>   from the containing folder. Required when you do not control the\n>   repository (client work, a shared company project, an outside\n>   contribution), or when one brain serves several repositories. Nothing is\n>   ever written into the project repositories.\n\n**Embedded**, the default. Copy the files; do not clone in place. A clone puts\na `.git` inside the brain and the host repository then tracks a *gitlink* it\ncannot resolve, so the whole brain shows up as one unreadable entry rather\nthan as its files \u2014 invisible to the repository it is supposed to be versioned\nwith, which is the entire point of embedding it.\n\n```bash\ncd <project> && git init             # if it is not a repo yet. adopt requires one\ngit clone https://github.com/hootener/brain.git /tmp/brain-template\ncp -R /tmp/brain-template brain\nrm -rf brain/.git                    # the important line\nbrain/bin/adopt                      # add --with-ci to install the workflow\n```\n\n**Sibling.** Here a clone is right, because the brain *is* the repository.\n\n```bash\ncd <workspace>                       # holds the brain and the project repos\ngit clone https://github.com/hootener/brain.git brain\nbrain/bin/adopt --sibling\n```\n\nThen:\n\n- Offer `--with-ci` rather than assuming it. `.github/` is the team's\n  directory and the brain does not write there uninvited.\n- Read `bin/adopt`'s output and repeat its closing instruction to the\n  operator. For sibling it says to start Claude Code in the workspace rather\n  than the project folder, which nothing else can do for them.\n- `bin/doctor` fails if the `rm -rf` was skipped, so run it before continuing.\n- **The skills are not loaded in this session** (D0010). Say so in your report\n  rather than offering `/to-spec` and watching it miss.\n\nOnly when `config.md` exists do you carry on.\n\n**Two paths, and you must pick one before step 1.**\n\n```bash\nls brain/knowledge-catalog/decisions/ brain/knowledge-catalog/goals/   # a brain already?\ngit -C <repo> log --oneline | head -1                                  # code history?\nls <repo>/docs <repo>/CONTEXT.md                                       # docs?\n```\n\n**Ask about the brain first.** Three rounds running, a test that looked only at\nthe repository gave a confident wrong answer: no commits and no docs said\n*greenfield* to a catalog already holding four nodes. The branches are about\nwhat is already in the brain; the repository is the second question, not the\nfirst.\n\n**Step 3 runs whichever branch you are on. Always.** Conversation history is\nindependent of code history, and the branch test below does not look at it. A\nrepository with no commits and no docs had **five transcripts holding two real\ndecisions**, and the branch told its adopter those steps were no-ops. Run\n`bin/utterances` before you conclude there is nothing to import \u2014 it\ncosts one command and it is the one place that had anything.\n\n**Greenfield** \u2014 no commits, no docs. Steps 2 and 4 are no-ops; step 3 is not.\nGo to \"Greenfield\" at the end and come back for step 5. The first adopter ran all four against an empty project, got\n`fatal: your current branch 'main' does not have any commits yet`, and found\nthe real material was in the conversation they were already having.\n\n**In flight** \u2014 a codebase with history, decisions living in people's heads,\nand docs in four places. That is the rest of this skill.\n\n**Re-adoption** \u2014 **the catalog already holds nodes.** That is the whole\ntest, and it comes before the other two. Neither branch fits: there is nothing to import that is not\nalready here, and mining the transcripts surfaces *the previous run's own\nwork*, which a second adopter duly filed as fresh findings. **Which of the steps below apply:**\n\n| Step | On a re-adoption |\n|---|---|\n| 1 \u00b7 ask the four things | **Skip 1\u20133.** `config.md` already holds them. Ask question 4 only if no goal exists. |\n| 2 \u00b7 import existing docs | **Skip.** Anything importable is already imported; re-importing duplicates it. |\n| 3 \u00b7 mine the transcripts | **Run, bounded.** See below \u2014 most of what is there is the previous run's own work. |\n| 4 \u00b7 mine git history | Run if there are commits since the last node. |\n| 5 \u00b7 report | **Run.** Say what changed and what you left alone. |\n\nRead what is already in the catalog **first**, ask the operator what has\nchanged since, and write only that. Bounding it by date does not work: everything a re-adoption produces is dated\ntoday, so `--since` returns what no filter returns. **The bound is already in\nthe catalog** \u2014 every imported node names the session it came from in\n`resource:`. Read those first, and treat any utterance from a session already\ncited as covered.\n\n## The rule that governs everything here\n\n**If the source already carries dates, trust them.** A brain migrating from\nanother brain \u2014 or any source already in OKF \u2014 has an authored `timestamp:` on\nmost of its files: 123 of 158, in the first migration of one. That date is\nbetter than anything you can reconstruct, and `git log --follow` would have\nbeen *worse* than what was already in the files. One line of work, and the\ninstruction below is for the case where the source has no dates of its own.\n\n**Otherwise, date every imported node by its origin, never by the import.** Stamping\ntoday on a document written in July makes every decision citing it look like\nit cites the future, and the direction rule will say so \u2014 twenty-eight times,\nin the first real adoption. Take the date from the filename where it carries\none, and from `git log --follow --format=%ad --date=short` otherwise, which is\nthe reason to move files with `git mv` rather than copy them.\n\n**Mark running records `append_only: true`** \u2014 a project log, an\nopen-questions list, a state snapshot. Their content runs ahead of their open\ndate by design.\n\n**An initiative's `plan.md` is usually one of them.** It is opened on day one,\nlinks every phase as the phases arrive, and is appended to for weeks. In the\nfirst migration, **25 of 27 direction warnings came from three plan files**,\nevery one spurious, and nothing told the migrator that a plan could be a\nrunning record. If a plan links nodes written after it, it is.\n\n**Everything imported lands as `status: draft` with a `resource:` pointing at\nwhere it came from.** You are reconstructing, and a reconstruction that reads\nas a decided decision is worse than no brain at all\n([the principle that claims must be checkable](knowledge-catalog/decisions/D0001-claims-must-be-checkable.md)).\n`bin/lint` reports the draft count, so the operator can see exactly how much is\nstill guesswork.\n\nNever promote a draft to `active` yourself. That is the operator confirming it,\nand it is the whole value of the import being visible.\n\n## Step 1 \u2014 ask the four things you cannot infer\n\n1. ~~Which repository?~~ **Do not ask.** `bin/adopt` already wrote it to\n   `brain/config.md` as `repos:`. Asking invites an answer that contradicts\n   the file.\n2. Where do docs already live \u2014 `docs/`, `docs/adr/`, a `CONTEXT.md`, a wiki,\n   an exported Notion space? \u2192 **write it to `docs:` in `config.md`.**\n3. What issue tracker is in use, and should `brain/tasks/` mirror it or replace\n   it? \u2192 **this is a decision, not a preference.** It has alternatives (mirror\n   / replace) and a consequence (two places to keep in step). Write it with\n   `bin/new decision`, and record the choice in `config.md` as `tracker:`.\n4. **What is this project trying to achieve?** One sentence. \u2192 a `goal` node.\n\nThe first adopter answered all four and had somewhere to put one of them.\nQuestions 2 and 3 went into the change log because nothing else fitted.\n\n**Do not proceed without the fourth.** Without a goal there is nothing for a\nlineage walk to terminate at, `/spec-review` has no intent to check against,\nand every Approach node you write will fail `serves:`. If the answer is \"a lot\nof things\", take the two that matter most this quarter and write those.\n\nWrite it: `bin/new goal \"<the outcome>\"`.\n\n### If there is no operator to ask\n\nThere may be nobody there. A fourth adopter ran this unattended, and **\"do not\nproceed without the fourth\" has no exit for that** \u2014 so the only options the\ndocument offered were to stop, or to invent an answer, which is the one thing\nthis whole file forbids.\n\nThe exit: **write the goal from what the operator has already said, quote the\nsentence you took it from, and leave it `status: draft`.** A draft goal is an\nhonest proposal \u2014 it terminates a lineage walk, so the Approach nodes you write\nare not orphaned, and `bin/lint` reports the draft count on every run so it\ncannot be forgotten. Promoting it to `active` is the operator's, and say so in\nyour report.\n\nSame for questions 2 and 3: if nobody can answer, leave `docs:` and `tracker:`\nunset rather than guessing, and name both in your report as unanswered. An\nempty field is a question anybody can see; a guessed one is indistinguishable\nfrom a decision.\n\n### The first session cannot finish a task\n\nSkills load at session start (D0010), so the session that installs the brain\nhas none of them. `/spec-review` owns `Testing \u2192 Complete`, which means **work\ndone in the first session parks at `Testing` and cannot be moved on**, however\ncomplete it is. That is not a bug to work around and not a reason to set\n`Complete` by hand \u2014 the status means a named owner signed it off, and nobody\nhas.\n\nLeave it at `Testing`, say so in your report, and let the next session close\nit. A fourth adopter hit exactly this and reported it as a defect; it is a\nconsequence of D0010, and the fix is knowing it in advance.\n\n## Node types this brain does not have\n\nA source brain may carry types that are not in the seven. Two that have come\nup, and what they become:\n\n- **`intent`** \u2014 a half-page written to be forwarded, usually beside a plan.\n  **It folds into the plan** as an `# Intent (forwardable)` section;\n  `bin/handoff` reuses that section verbatim as every handoff's opening, so\n  the two cannot drift. It is not a node, and nothing in this brain reads a\n  separate one. *This was the one answer a migrator could not find anywhere,\n  and the cost was a `consent_by:` that silently stopped being read.*\n- **`handoff`** \u2014 the exec-facing page. **It is a projection, not a node**:\n  `bin/handoff` renders it from the plan plus an authored half under\n  `plans/<initiative>/handoff/`. What gets recorded is the *event* of handing\n  it over, as an `evidence` node.\n\nAnything else: map it to one of the seven and say which, or leave it as\n`evidence` with a `resource:` and flag it in your report.\n\n## Step 2 \u2014 import what already exists\n\nIn descending order of certainty, so the most trustworthy material lands first:\n\n- **Existing ADRs** (`docs/adr/`, `docs/decisions/`) \u2192 `bin/new decision`,\n  one per ADR, `status: draft`, `resource:` the original. Keep their words; do\n  not improve them.\n- **`CONTEXT.md`, a glossary, a data dictionary** \u2192 seed\n  `brain/knowledge-catalog/glossary.md`, including the `_Avoid_` notes, which\n  are usually the most valuable part and the first thing lost.\n- **A README's architecture section** \u2192 an `evidence` node, not a decision. It\n  describes how things are, which is Evidence; what it does not say is *why*,\n  which is what a decision is for.\n\nThe host repository's own `CLAUDE.md` and `CONTEXT.md` are the team's: read\nthem, do not write to them.\n\n## Step 3 \u2014 mine the transcript history\n\nThis is the step nothing else can do, and it is usually the richest.\n\n```bash\nbin/utterances            # what the operator said, across every session\nbin/utterances --repeated # said more than once \u2014 the strongest signal\n```\n\n**Use the tool. Do not read the `.jsonl` yourself.**\n\nAn answer to `AskUserQuestion` is stored as a `tool_result` block inside a\nuser-role envelope, **not** as message text. Walk the transcript keeping\nuser-role entries with string content \u2014 the obvious approach \u2014 and you drop\nevery decision the operator made in answer to a direct question. What you find\nin their place is the **assistant's paraphrase**, in assistant text.\n\nQuote that, cite the transcript as `resource:`, and you have manufactured an\noperator decision out of the previous agent's prose with provenance that looks\nsound. `bin/utterances` reads both places and labels which is which.\n\n**The signal is not \"decision-shaped sentences\".** Those are noise, and an\nagent hunting them will manufacture a decision record out of ordinary chat.\nThe signal is:\n\n- **The same correction, made more than twice.** The operator telling Claude\n  the same thing in three different sessions is a decision or a principle that\n  was never written down. This is the highest-value extraction available\n  anywhere in this skill \u2014 it is precisely the knowledge the brain exists to\n  stop re-deriving, and nothing else in the toolchain can see it.\n- **Reversals** \u2014 \"actually, don't do that\", \"we tried that and it broke\".\n  Those are Evidence.\n- **Standing constraints** \u2014 \"never touch X\", \"always go through Y\". Candidate\n  principles.\n\nPresent candidates in batches with the quoted source, and let the operator\naccept or reject each. Do not write them unaccepted.\n\n**Quote the operator, never a summary of them.** A line tagged `[typed]` or\n`[answered]` by `bin/utterances` is theirs. Anything else in the transcript is\nan agent talking, including an agent accurately describing what they said \u2014\nand a `resource:` pointing at a transcript that contains only the paraphrase\nis a citation that cannot be checked by the person who would notice.\n\n## Step 4 \u2014 mine the git history\n\n- `git log --grep='revert\\|hotfix\\|actually'` \u2192 candidates for\n  [the running record of what the brain has caught](knowledge-catalog/reference/E0001-brain-in-practice.md), which\n  `/grill-change` reads first and which otherwise starts empty.\n- `CODEOWNERS` \u2192 who owns what, for `owner:` on plans and specs later.\n- Directories with the most churn \u2192 where the project's real complexity is, and\n  therefore where decisions are most likely to be undocumented.\n\n## Greenfield \u2014 when there is no history to mine\n\nSteps 2, 3 and 4 find nothing. **The live conversation is the only source of\ndecisions that exists**, and it is a good one: the first greenfield adoption\nproduced two real decisions, both lifted from chat messages, and one arrived\nsideways in the answer to a different question.\n\nApply step 3's signal discipline to the conversation instead of the\ntranscripts. You are looking for the same things:\n\n- **A constraint stated in passing.** *\"We do not care about prose that will\n  be consumed by agents\"* is a decision with alternatives and consequences,\n  dropped into an opening message as an aside.\n- **An ordering the operator has already settled.** *\"The goal here is to make\n  this an adoptable project, then we'll use the adoptable version to make our\n  own voice setup, like any other end user would\"* \u2014 a real sequencing\n  decision, arriving in a reply to a clarifying question about something else.\n- **A thing ruled out.** Anything the operator has said no to, and why.\n\nQuote the operator's words back when proposing each one, the way you would\nquote a transcript. They are the citation.\n\n**Do not invent a decision to make the record look fuller.** A greenfield\nbrain with one goal and two real decisions is in better shape than one with\neight plausible ones.\n\n**Nothing is a sanctioned outcome \u2014 but only after step 3.** The exit below is\nscoped to *this conversation*; what it gates is scoped to *the project*. Take\nit without having run `bin/utterances` and you can write a true sentence and\nreach a false conclusion, with nothing feeling wrong. A conversation about\n*evaluating* a tool contains no decisions about the project, and a session\nthat produced none, **with no older transcripts holding any either**, should\nsay so and stop:\n\n> Nothing in this conversation settles anything durable about the project. No\n> decisions written. The first one will arrive when you make it.\n\nReported by the second cold adopter, whose session contained zero project\ndecisions while the skill told them the live conversation was a good source.\nAn agent told material is there will find material. That is the manufacturing\nthis skill forbids two paragraphs up, and forbidding it without offering an\nexit is what makes it happen.\n\n**Same-day forward references are fine.** Everything written during init\ncarries today's date, so the direction rule cannot fire among these nodes \u2014\na goal may link a decision written minutes later. Do not order your writes\naround it or back-date anything to force a sequence. The rule is about\n*imported* nodes, which carry origin dates.\n\n## Fields this brain does not model\n\nA source brain will carry frontmatter keys that mean something to its own\nprocess and nothing here \u2014 `flag:`, `consent_by:`, `production_date:`. Keeping\nthem is harmless and they are not read by anything, which is the trap: a field\nthat mattered becomes invisible without ever looking lost.\n\nSay so explicitly in your report, naming each one. **Leave the value in\nfrontmatter.** This used to say the working copy belonged in the authored half\nof the handoff, which meant hand-copying a date out of frontmatter into prose\ngenerated from the same plan \u2014 a second copy of a value that already exists,\nin a file regenerated from the first. That is precisely the drift the\nauthored-half split was built to prevent, and the advice was found to be\nself-defeating by the brain it was written for.\n\nA date the work turns on is read by the generator instead. Any plan\nfrontmatter key ending `_by`, `_on`, `_at`, `_date` or `deadline`, with an\nISO date for a value, renders as **Dates that matter** on an executive,\nbusiness, marketing or product handoff. So `consent_by: \"2026-11-20\"` on the\nplan reaches the page with no second copy and nothing to keep in sync; the\nauthored half can then refer to \"the consent date\" the way prose naturally\ndoes. Fields that are not dates, and not read by anything, are still worth\nnaming in your report \u2014 but do not duplicate them to make them visible.\n\nWrite it under its own heading and `bin/handoff` carries it through verbatim,\nafter the sections that discipline generates, in the order you wrote them. It\nused to render a heading only if the text matched one of ten known section\ntitles *and* that discipline carried it \u2014 so an executive handoff dropped five\nof eight authored sections silently, including the one holding the date the\nagreement turned on. Unrecognised headings now survive, and the run names\nthem.\n\n## Step 5 \u2014 report what you did and what is still guesswork\n\n```bash\nbin/lint && bin/doctor && bin/graph-build\n```\n\nThen say plainly: how many nodes were imported, how many are `draft`, what you\ncould not find, and what the operator should confirm first. **The gaps are the\nuseful half of this report** \u2014 a brain that claims to have captured a project\nit has only skimmed is the failure this whole skill is shaped to avoid.\n", "mtime": "2026-11-11T21:02:47+00:00"}, {"path": "README.md", "meta": {}, "body": "# brain\n\nA codebase records what you built. It does not record why you built it that\nway, and the why is the first thing you lose.\n\nThis brain project is intended to be the other half: the goals, the decisions,\nthe plans, the tracker and what you learned afterwards, as linked Markdown with\nYAML frontmatter, in Google's\n[Open Knowledge Format](https://github.com/GoogleCloudPlatform/knowledge-catalog/tree/main/okf).\n\nThere is no database and no service, so the files are the ground truth. That\nmakes everything in the brain equally legible to a person and to an agent. The\nbrain is also fully portable, because it is built on open standards: Git and\nlinked Markdown.\n\nThe project also ships a set of skills that use the brain as their backing\nstore, so your agent can settle a decision, cut a feature into work, or check\nwhat shipped against what you meant to build. From an interface perspective\nthey look a lot like\n[Matt Pocock's agent skills](https://github.com/mattpocock/skills), and several\nshare their names outright, `/to-spec`, `/implement`, `/wayfinder` and\n`/code-review` among them. That is intentional. This project supports a very\nsimilar workflow, with an opinionated graph-based backing store underneath it.\n\n## The four categories\n\nBrain builds a knowledge graph out of typed nodes, and every node sits in\nexactly one of four categories that run left to right.\n\n<picture>\n  <source media=\"(prefers-color-scheme: dark)\" srcset=\"docs/lineage-dark.svg\">\n  <img src=\"docs/lineage.svg\" alt=\"Four dashed regions left to right: Intent holding a goal and a decision, Approach holding a plan and two specs, Action holding four tasks, and Evidence holding two evidence nodes. Arrows run from intent through approach and action to evidence. Beneath, one arrow labeled IMPLEMENTATION runs left to right and one labeled REVIEW / AMEND runs right to left.\">\n<\/picture>\n\n- **Intent** holds `goal`, `decision` and `principle` nodes, which are what\n  you're trying to do and what you've settled.\n- **Approach** *(optional)* holds `plan` and `spec` nodes, which are how you\n  intend to deliver on a goal or a decision.\n- **Action** holds `task` nodes, which are what gets done.\n- **Evidence** holds `evidence` nodes, which are the observations and what you\n  learned from carrying the actions out.\n\nThe benefit of this approach is that work runs forward from intent to approach\nto action to evidence, and can be measured the whole way. Reviewing your work\nis the same process run backwards, from the evidence and the action back to the\nintent, to make sure that what you did actually met the goal you set out to\naccomplish.\n\nNodes carry an id: a type letter and four digits, flat and global. `G` goal,\n`D` decision *and* principle, `P` plan, `S` spec, `T` task, `E` evidence.\n\n## Installing the brain\n\nPaste this into the coding agent working on your project:\n\n> read https://raw.githubusercontent.com/hootener/brain/main/INIT.md and follow it\n\nThat is the whole install. The agent asks you where the brain should live,\nfetches the files, runs `bin/adopt`, and then fills the brain with your\nproject. It asks about placement rather than guessing, because the answer is\nrecorded in `config.md` and moving the files afterwards does not move the\nrecord of what they are \u2014 the next section is what you need to answer it.\n\n`bin/adopt` **installs**. It links the skills so Claude Code can see them,\nstamps the dates, records the layout and runs the checks. `INIT.md` **fills**.\nIt reads your repository, imports the ADRs and glossary you already have, mines\nthe Claude transcript history for decisions nobody wrote down, and asks for the\nfirst goal. They stay separate because one job is mechanical and one needs\njudgment, and because they rerun on different schedules\n([the placement and install decision](knowledge-catalog/decisions/D0004-placement-and-install.md)).\n\n**It works on a project already in flight.** Everything imported from a\npreexisting project is created with `status: draft` and a pointer to where it\ncame from, so you can see exactly how much of the record is still\nreconstruction.\n\n**Fork it first if you mean to keep your own copy.** Point the prompt at your\nfork's raw URL instead, and `bin/update` will pull later fixes from upstream.\n\n### Picking embedded or sibling\n\n**Embedded (`<repo>/brain/`) is the default**, because versioning the record in\nthe same repository as the code is the only thing that makes \"this decision was\ntrue at this commit\" checkable rather than asserted. The decision and the code\nit governs move in one commit, and the reviewer meets the decision in the pull\nrequest.\n\n**Sibling** is fully supported and required in two cases you will hit. Either\nyou don't control the repository, as in client work, a shared company project\nor an outside contribution, or one brain serves several repositories.\n\nSibling means a **workspace**: the brain and the project repositories side by\nside in a plain folder, and you run Claude Code from the folder.\n\n```\nworkspace/\n\u251c\u2500\u2500 .claude/skills -> ../brain/skills\n\u251c\u2500\u2500 brain/                  # its own git repo, hooks and CI live here\n\u2514\u2500\u2500 acme-api/               # the project. Never written to.\n```\n\n**Nothing is written into the project repositories.** Not `.claude/`, not\n`.github/`, not `.git/hooks`. The repositories are recorded in `config.md`'s\n`repos:` field and read. That is the entire reason to pick sibling, because a\nshared repository stays clean and nobody else on it ever sees a file they\ndidn't ask for.\n\nSibling has one cost. **Start Claude Code in the workspace, not in the project\nfolder**, which is what keeps the project clean and what makes the `brain/...`\nprefix every skill uses resolve. `bin/adopt` prints the instruction on the way\nout.\n\n### Updating the brain\n\nFrom time to time I make updates to the core infrastructure of this brain and\nhow it works. This section is how you take those changes.\n\nThe brain splits into the generic half (`bin/`, `skills/`, `hooks/`, `docs/`,\n`.github/`, and the templates under\n`knowledge-catalog/reference/agent-skills/`) and your half (the rest of\n`knowledge-catalog/`, `tasks/`, `plans/`, `brief/`, `work/`, `config.md`,\n`facts.md`). Upstream only ever changes the generic half, with no remotes and\nno subtree.\n\n```bash\nbrain/bin/update --from https://github.com/<you>/brain.git\nbrain/bin/update --list        # exactly what counts as generic\n```\n\n**If your brain has no `bin/update`**, which is the likely case precisely\nbecause it is old enough to need updating, bootstrap from a template checkout\nand point it at your install:\n\n```bash\ngit clone https://github.com/<you>/brain.git /tmp/brain-template\n/tmp/brain-template/bin/update --target /path/to/your/project/brain\n```\n\n`bin/update` reports what changed by hashing the tree before and after itself,\nrather than by listing what it meant to do. That report was wrong in both\ndirections for three releases, because three transforms run after the copy and\nnone of them appeared in the list.\n\n## Getting started\n\nThe best way to start is with a proposal you want stress-tested, so reach for\n`/grill-change` and try to build something new. It works the way the grill-me\nprompts you have already seen do, asking you a lot of questions about what you\nwant to build, except that it pushes back out of your own brain. The challenges\ncome from the decisions you have already recorded rather than from the model's\nimagination, and every one of them cites a path so you can check it.\n\nFrom there you can follow the skill path all the way to a built feature,\nwriting a plan and specs on the way when the work has a planning phase. At the\nend, `/spec-review` traverses the brain backwards from what you built to the\nintent that asked for it, so you can see whether what you built matches what\nyou meant to build. And `/interrogate` is there when you want to query the\nbrain directly rather than change anything.\n\n### Day one, building something\n\nSay `INIT.md` gave you one goal: *the list page loads in under a second*\n(`G0001`). You want to cache the permission lookup.\n\nStart with the proposal rather than with the spec:\n\n```\n/grill-change\n```\n\nIt reads the record before it argues, and every challenge it puts back to you\ncarries the path it came from, so you can check the objection rather than take\nits word. What survives that is what you spec:\n\n```\n/to-spec\n```\n\nIt asks the record first, resolves which goal this spec serves, and writes the\nspec as `S0001` with `serves:` pointing at the goal. If no goal fits, it says\nso and writes the goal rather than inventing one to fill the field. Where the\nwork has no planning phase, skip this step and let `/to-tasks` cut the work\nstraight from the decision it serves.\n\n```\n/to-tasks\n```\n\nThat cuts the spec into vertical slices, each with its blocking edges, each\nciting the decisions it carries out. The slices land in an **initiative**,\nwhich is the folder that holds the tasks for one body of work and the name you\npass to most tools. Ask for the board:\n\n> where are we on the caching initiative?\n\n```console\ntask                                             status                 waits on  title\ncaching/T0001-cache-permission-lookups-for-th\u2026   Ready for Development  -         Cache permission lookups for the life of a request\ncaching/T0002-invalidate-the-cache-when-a-per\u2026   Ready for Development  T0001     Invalidate the cache when a permission changes\n\nfrontier (claimable now): caching/T0001-cache-permission-lookups-for-the-life.md\n```\n\nThen `/implement`, which reads the lineage before writing a line. You can ask\nfor the same walk yourself at any point:\n\n> what asked for T0001, and is every claim upstream of it still true?\n\n```console\nAncestry of T0001-cache-permission-lookups-for-the-life.md\n  4 document(s) upstream\n\n  terminates at: G0001 The list page loads in under a second\n\n  \u2500\u2500 ACTION \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n     What did neighboring work establish that this depends on?\n\n  T0001 Cache permission lookups for the life of a request\n      brain/tasks/caching/T0001-cache-permission-lookups-for-the-life.md  \u00b7 Ready for Development\n\n  \u2500\u2500 APPROACH \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n     Did we take the route we said, or did it widen without being argued?\n\n  S0001 Cache the permission lookup\n      brain/knowledge-catalog/specs/S0001-cache-the-permission-lookup.md  \u00b7 active  \u00b7 via spec\n      promises: Permission lookups repeat many times within one request, so cache\n                them for the life of that request.\n\n  \u2500\u2500 INTENT \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n     Is every claim here still true, and does the change still serve it?\n\n  D0001 Permissions come from the database, never from the session\n      brain/knowledge-catalog/decisions/D0001-permissions-come-from-the-database.md  \u00b7 active  \u00b7 via link\n      promises: Every permission decision is read from the permissions table. The\n                session may carry a user id, never the rights it implies.\n```\n\nThat `terminates at:` line is the one to read. It means the work has a recorded\nintent to be checked against. If the line says `\u26a0 UNTERMINATED`, nothing\nupstream explains why this is being built, which is a finding rather than a\nformality.\n\nThen `/spec-review`, which walks the same chain backwards, asks whether what\nshipped still serves the intent, lists the upstream documents the build made\nfalse, and moves the task to `Complete`.\n\n### Three weeks later, where it pays back\n\nSomeone, possibly you and possibly an agent, proposes: *hold the cache in\nprocess memory between requests, instead of rebuilding it on every one.*\nReasonable on its face, and it makes the thing you just shipped faster. Before\nbuilding it, ask:\n\n> does the record already say anything about holding the cache in process\n> memory between requests?\n\n```console\nBrain hits for: hold the cache in process memory between requests\n  matched on: hold, cache, process, memory, between, requests\n\n  [decision] Nothing is cached beyond the life of a request\n      brain/knowledge-catalog/decisions/D0002-nothing-is-cached-beyond-the-request.md:27  \u00b7 active\n      \u201c- **Hold the cache in process memory between requests** -- rejected: we run\n        more than one instance, so each answers from its own copy, and the bug\n        reaches a user as stale data at random.\u201d\n```\n\nThe exact proposal, already rejected, with the reason, found in the\n*Alternatives* section where the reasoning usually lives. The hit carries a\nline number, so you open the file at the paragraph rather than at the top.\nAnd because the decision declared what it governs, you can come at it from the\nfile instead of from the words:\n\n> which decisions govern app/cache/RequestCache.php?\n\n```console\n  D0002  Nothing is cached beyond the life of a request\n      brain/knowledge-catalog/decisions/D0002-nothing-is-cached-beyond-the-request.md\n      must hold: No cache outlives the request that created it.\n      matched:   app/cache/RequestCache.php\n\n  A change that contradicts one of these needs a recorded exit:\n  amend the decision, or proceed against it with the id in the\n  task's `# Log`. Noting it and moving on is not one of them.\n```\n\n`/grill-change` puts that constraint to you with the path attached, so you can\ncheck the claim rather than take its word. **Two exits, and \"noted\" isn't one\nof them.** Amend `D0002` on the record, or proceed against it with the id\nlogged so the next reader finds a deliberate exception instead of an accident.\n\nThat is the whole return on day one's bookkeeping, and it is why the first pass\nfeels like overhead and the second one doesn't.\n\n### Checking an initiative is actually finished\n\n> did we build everything G0001 asked for?\n\n```console\n  [task] T0001 Cache permission lookups for the life of a request  \u2190 outstanding\n  [task] T0002 Invalidate the cache when a permission changes  \u2190 outstanding\n  [spec] S0001 Cache the permission lookup\n  [decision] D0001 Permissions come from the database, never from the session\n\n  2 of these are not done. An intent is complete when nothing\n  it asked for is outstanding \u2014 omission, not drift, and a green\n  test suite will not show it.\n```\n\nA reverse walk finds **drift**, which is building something subtly different\nfrom what was asked. Only the forward walk finds **omission**: the spec nobody\ngot to, the task left at `Not Ready` while the initiative was called done.\n`/audit` runs both walks and asks you about whatever it can't judge on its own.\n\n## CI\n\nThe brain ships several built-in checks you can wire into your CI, so that the\nrecord stays correct across later commits and pull requests. This is opt-in,\nbut definitely worth considering. `bin/lint` and `bin/stale` are what keep the\nrecord honest between reviews, and CI is the only place they run without\nsomebody remembering to run them.\n\nIt stays opt-in because `.github/` is your team's directory, so `bin/adopt`\ndescribes the workflow and installs it only on `--with-ci`. The workflow\n(`.github/workflows/brain.yml`) locates the brain itself, so one file works\nembedded or sibling and needs no setup step.\n\n| Step | Fails the build? |\n|---|---|\n| `bin/lint` | **yes** on errors. Warnings never fail, because an unresolved link is a valid marker of future work |\n| `bin/stale` | **yes**, because a countable claim contradicting the repo is a false statement a reader will meet |\n| `bin/doctor` | **yes**, because a broken install makes everything else meaningless |\n| `bin/unread` | **yes**, because a field the record carries and no tool reads is inert without ever looking lost |\n| graph is current | **yes**. `graph.html` is generated *and* committed, so it drifts silently |\n| decisions in force | no, printed to the run summary on a PR |\n| `bin/selftest` | **yes**, because a fresh install must be silent and the foreign-content fixture must behave as designed |\n| `bin/reconcile` | no, because an ambiguous status is a question for a person |\n\n> **Forking does not enable Actions.** GitHub disables workflows on a fork by\n> default. Open the Actions tab once and confirm.\n\n## Skills\n\nThirteen, grouped by where they sit on the picture above.\n\n**Forward, implementation**\n\n| | |\n|---|---|\n| `/grill-change` | Interrogates a proposal against what the record already decided, measured and got wrong. Every challenge cites a path, so the challenge is checkable rather than decision-shaped. |\n| `/to-spec` | Turns the conversation into a spec. Resolves the goal the spec serves first, and if no goal fits, says so and writes the goal rather than inventing one. Optional, and four of five brains have never used it. |\n| `/to-tasks` | Breaks a spec, a plan or the conversation into tracer-bullet tasks, each a vertical slice that works end to end, with their blocking edges. Each task names the decision it carries out, which is the edge that makes the intent layer reachable. |\n| `/implement` | Builds it, after reading the lineage and the constraints. Claims the task, journals as it goes, hands off at `Testing`. |\n\n**Back, review and amend**\n\n| | |\n|---|---|\n| `/spec-review` | The reverse walk. Checks the change still serves its intent, walks *forward* to catch what the intent asked for and nobody built, and produces the list of upstream documents the build made false. Owns `Testing \u2192 Complete`. |\n| `/audit` | Reconciles a subgraph's statuses against what the repository shows, batches what is unambiguous, and asks about the rest. Surfaces work done with no node at all. |\n\n**Off the rails**\n\n| | |\n|---|---|\n| `/interrogate` | The way *in*. Ask the brain a question and get an answer rather than a tour, whether you are an interviewer, a teammate, or yourself six weeks later. |\n| `/triage` | Moves tasks through the triage states and writes agent-ready briefs. |\n| `/wayfinder` | For work too big to plan in one session: a map of decision tickets, resolved one at a time until the route is clear. |\n| `/research` | Investigates against primary sources and files the findings as evidence, after checking whether the brain already answers the question. |\n| `/domain-modeling` | Sharpens the glossary and the domain model as you design. |\n| `/code-review` | The artifact rather than the graph: correctness, security, performance and standards, as parallel sub-agents. Works in a repository with no brain. |\n| `/handoff` | Builds a self-contained HTML page for whoever is picking the work up, composing what the graph knows with a hand-written walkthrough. Never required. |\n\n## Tools\n\nThroughout regular use of the brain you should not need to call these tools\nyourself, because your coding agent will reach for them as it works, which is\nwhat the prompts above are doing. They are here for the times you do want to\nrun one directly.\n\n```bash\nbin/adopt                      # install into a project\nbin/doctor                     # is the install sound\nbin/lint                       # the gate: taxonomy, ids, links, direction, frontmatter\nbin/status [initiative]        # task table and the claimable frontier\nbin/note \"<what happened>\"     # record it now, decide what it is later\nbin/which                      # what kind of node is this (two questions)\nbin/relevant \"<change>\"        # what the record already says about a proposal\nbin/constraints <paths>        # which decisions govern these files\nbin/ancestry <id> [--claims]   # walk back to the intent that asked for it\nbin/ancestry <id> --forward    # walk on to what that intent asked for\nbin/reconcile [initiative]     # task status against the repository\nbin/new <type> \"<title>\"       # allocate an id and scaffold the node\nbin/renumber <old> <new>       # the one sanctioned reason to change an id\nbin/relink                     # backticked citations of nodes become real links\nbin/handoff <init> --for <who> # a self-contained HTML page for someone outside\nbin/stale                      # countable claims that no longer match the files\nbin/unread                     # frontmatter the record carries that no tool reads\nbin/index                      # rebuild every folder index from the nodes present\nbin/utterances                 # what the operator said, from Claude Code's transcripts\nbin/selftest                   # a fresh install, and a corpus not written for this brain\nbin/prove <command...>         # does a tool's output match what it did to the files\nbin/update                     # pull the generic half from upstream\nbin/graph-build                # rebuild graph.html\nbin/diagram                    # rebuild the four-categories picture\n```\n\nNo dependencies anywhere, and every tool is stdlib Python 3.\n\n## The graph\n\n`bin/graph-build` writes `graph.html`, a browser-only force graph of every\nMarkdown file here. Nodes are files and edges are the links between them.\n\n![The brain's own graph in a browser: a force-directed cluster of colored nodes labeled with ids and titles, over a legend that maps fill to node type and ring to status, with a filter box at the top right.](docs/graph.png)\n\n**Fill is the node's `type`, and the ring is its `status`.** Click a node for\nits metadata and rendered contents.\n\nThe filter bar takes `#tag`, `@type`, `@status`, a category name such as\n`@intent`, and plain text, all ANDed. Every legend entry is clickable and\ncarries a bracketed keyboard key. **Focus** removes non-matching nodes,\n**linked** widens by one hop, and `Esc` clears.\n\n## Layout\n\n| Directory | Holds | Lifecycle |\n|---|---|---|\n| `knowledge-catalog/` | goals, decisions, specs, evidence, glossary | keep, supersede rather than delete |\n| `plans/` | how things get built, when you plan | superseded by what shipped |\n| `tasks/` | the tracker. One `task` file per ticket | churns |\n| `work/` | per-worker journals, `<initiative>/<worker>.md` | kept while the initiative is open |\n| `brief/` | source material the project answers, verbatim | fixed |\n| `skills/` | the agent skills, symlinked into `.claude/skills` | generic, edit here |\n| `bin/` | the tools above | generic |\n| `example/` | after `bin/adopt`: this template's own record, as a worked example | delete when you don't need it |\n| `docs/` | the diagrams and screenshots the README embeds | the lineage picture is rebuilt by `bin/diagram` |\n| `hooks/` | the post-commit hook `bin/adopt` installs | generic, edit here |\n| `feedback/` | raw inbound: transcripts, reports. **Not in git** | delete once the findings are written |\n\nFork it, run `bin/adopt`, and read `brain/INIT.md` in the same session.\n", "mtime": "2026-11-11T21:02:33+00:00"}, {"path": "brief/README.md", "meta": {}, "body": "# brief\n\n**Evidence, given rather than gathered.** Source material the project answers, as received.\nVerbatim \u2014 not analysis. Analysis lives in the knowledge catalog and links back here.\n\nA brief is an `evidence` node with a `resource:` and no `amends:` or `reviewed:` \u2014 the three\nedges are what distinguish what was given, what was measured, and what a review corrected.\n\n| File | What it is |\n|---|---|\n| *(none yet)* | Put the assignment, brief or spec here as `type: evidence`, with a `resource:` pointing at the original |\n", "mtime": "2026-11-07T16:48:52+00:00"}, {"path": "config.md", "meta": {"title": "How this brain is installed", "description": "The layout this brain was installed with, recorded rather than inferred, so the tools stop guessing where the repository root is.", "timestamp": "2026-11-07", "tags": ["brain", "config", "install"], "status": "active", "mode": "template", "human_fields": [], "repos": [], "brain_revision": "", "tracker": "", "docs": []}, "body": "\n# How this brain is installed\n\n`mode` is one of:\n\n| mode | Means | Repository root is |\n|---|---|---|\n| `embedded` | the brain is a `brain/` directory inside a host repository \u2014 the default ([D0004](knowledge-catalog/decisions/D0004-placement-and-install.md)) | the brain's parent |\n| `sibling` | the brain is its own repository inside a workspace folder, beside the project repos it describes | the brain itself |\n| `template` | this is the unadopted template; `bin/adopt` has not run | the brain itself |\n\n`human_fields` lists frontmatter that people read and no tool does, on\npurpose. `bin/unread` reports unread fields so a value that drives a workflow\ncannot sit inert \u2014 but some fields earn their place without a reader. The test\nan adopter proposed, and it is a good one: **does it change how a conflicting\nrecord is read?** They kept `decided_by` because two of their decisions\ncontradict each other on the facts and it is the only thing making the\nfounder's call outrank the engineer's inference; they dropped `owner`, one\nname on six tasks, arbitrating nothing. Listing a field here is the answer to\nthat test, not an escape from it.\n\nIn **both** modes `.claude/skills` is linked into the brain's *parent*, because\nthat is the directory Claude Code is run from and the only one where the\n`brain/...` prefix every skill uses resolves. In sibling mode that parent is a\nplain workspace folder \u2014 **the project repos listed in `repos:` are read and\nnever written to**, which is the entire reason to choose sibling.\n\n`brain_revision` is the upstream commit the generic half came from, stamped by\n`bin/adopt` at install and by `bin/update` afterwards. Without it there was no\nway to tell what you were running, whether an update had landed, or what it\nchanged \u2014 the first re-adopter had to diff two trees by hand to discover that\na file had stopped existing.\n\n`tracker` records where issues actually live, and `docs` where the project's\nexisting documentation does. `bin/adopt` stubs both empty and `INIT.md`\nfills them \u2014 before that they were questions it asked with nowhere to put the\nanswers.\n\n`repos` lists the repository folders this brain describes. In `embedded` mode\nthat is the one it lives in; in `sibling` mode it is every git repository\nbeside the brain in the workspace, and the list is a record of what this brain\nis *about* \u2014 not a list of things it may modify.\n\n# Why this is written down rather than detected\n\n`bin/stale` used to compute the repository root as `../..` and scan paths\nbeginning `brain/`, which is correct **only** when the brain is one level down\n*and* the directory happens to be called `brain`. The template passed its own\nchecks by coincidence of its folder name. Recording the mode is what turns that\ncoincidence into a fact, which is [D0001](knowledge-catalog/decisions/D0001-claims-must-be-checkable.md)\napplied to the tooling itself.\n", "mtime": "2026-11-10T17:22:10+00:00"}, {"path": "knowledge-catalog/decisions/D0001-claims-must-be-checkable.md", "meta": {"id": "D0001", "type": "principle", "title": "The record is only worth keeping if its claims are checkable", "description": "Every assertion in the brain must be traceable to something a reader can verify \u2014 a path, a measurement, a commit \u2014 or it does not belong in the record.", "timestamp": "2026-11-07", "tags": ["brain", "meta", "principle"], "status": "active", "serves": "../goals/G0001-a-brain-others-can-adopt.md"}, "body": "\n# Principle\n\nNothing in this brain asserts something a reader cannot check. A claim carries\nthe path, the measurement or the commit that establishes it, or it is marked as\nan opinion, or it is not written.\n\nThis is the constraint the rest of the system is built to satisfy, and it is\nthe reason to prefer a smaller true record over a larger plausible one.\n\n# Rationale\n\nA model asked to \"consider the existing decisions\" will produce something\ndecision-shaped whether or not it read any. A person writing a summary will\nround a number toward the story. Neither is dishonesty; both are what happens\nwhen nothing forces the claim to touch ground.\n\nThe cost is asymmetric and that asymmetry is the whole argument. An absent\nnote costs a reader nothing \u2014 they go and look. **A confident, stale note\ncosts them the thing they would have found by looking**, because they stop\nlooking. So the record's value is not how much it holds; it is the probability\nthat what it holds is true. Every feature in this repository is downstream of\nprotecting that probability.\n\n# Implications\n\n- A challenge cites a path. `/grill-change` may not push back without naming\n  the file, and an uncited pushback must be labelled an opinion.\n- Anything measured records the measurement, its denominator and its date, so\n  a later reader can re-run it rather than believe it.\n- Generated claims are checked by a tool, not by vigilance: `bin/lint` for\n  conformance, `bin/stale` for countable claims, `bin/reconcile` for status\n  against the repository.\n- Supersede, never delete. A decision quietly edited to match what got built\n  teaches the reader that the record is written afterwards, which destroys the\n  probability this principle protects.\n- A thin or unterminated lineage is **reported**, not padded. \"We did not\n  decide that\" and \"this work has no recorded intent\" are findings, and both\n  are more useful than a plausible reconstruction.\n- An agent that cannot determine something asks. `/audit` states what it\n  checked before it asks, so the question is answerable rather than delegated.\n", "mtime": "2026-11-07T16:26:39+00:00"}, {"path": "knowledge-catalog/decisions/D0002-four-categories.md", "meta": {"id": "D0002", "type": "decision", "title": "Every node belongs to one of four categories, and nothing cites a node newer than itself", "description": "Intent, Approach, Action and Evidence are the four regions of the graph; Evidence absorbs what was context; and the legality of an edge is decided by time, not by direction.", "timestamp": "2026-11-07", "tags": ["brain", "taxonomy", "graph"], "status": "active", "serves": "../goals/G0001-a-brain-others-can-adopt.md", "invariant": "No node may cite a node that is newer than itself.", "constrains": ["bin/lint", "bin/ancestry", "bin/graph-build", "knowledge-catalog/"]}, "body": "\n# Context\n\nThe taxonomy had nine types with no grouping, which meant an agent placing a\nnew node had nine coin-flips and no model to make them with. Three symptoms,\nall measured in this repository:\n\n- `goal` had a template, a folder, an index, a linter type and a graph colour,\n  and **no skill anywhere wrote one**. The top of the graph was decorative.\n- `context` was carrying the brief, stack facts, running findings and review\n  outcomes at once \u2014 so coarse that `bin/relevant` and `bin/ancestry` both\n  invent a fake `experiment` kind by sniffing for `/experiments/` in the path,\n  and both sort it *above* decision as \"the most load-bearing entries\".\n- `initiative-pointer` had zero instances and was named nowhere outside the\n  linter, duplicating what a plan's own `description` already says.\n\n# Decision\n\n**Four categories**, left to right:\n\n| Category | Types | Answers |\n|---|---|---|\n| Intent | `goal`, `decision`, `principle` | what we are trying to do, and what we have settled |\n| Approach | `plan`, `spec` | how we mean to do it |\n| Action | `task` | what gets done |\n| Evidence | `evidence` | what we observed, and what it corrects |\n\n`glossary` sits outside the four: it is definitional, not a claim about the\nwork.\n\n**`context` becomes `evidence`.** The brief is evidence that was given rather\nthan gathered, marked with `resource:`. `initiative-pointer` is deleted.\nTaxonomy goes from nine types to seven plus the glossary.\n\n**A retro is not a fifth category.** It is an Evidence node whose edges point\nback up: `amends:` names what it corrects, `reviewed:` names what it covered.\nA measurement is the same type with neither edge. The distinction is carried\nby structure, not by a subtype field.\n\n**`spec` is Approach, not Action.** The boundary is *is this executable* \u2014 a\nspec says what will exist, a plan says in what order, and only a task is done.\n\n**The direction rule is temporal, not spatial.** A node may depend only on\nnodes that were already settled when it was written. Intent \u2192 Approach \u2192\nAction is the common case because intent usually precedes approach, but a goal\nwritten today may legitimately cite evidence from a plan that shipped last\nquarter. What is forbidden is editing that plan to cite the new goal, because\na reader of the plan would then see a justification that did not exist when it\nwas written.\n\nThe loop therefore closes **through Evidence**: a new goal cites what a\nprevious effort *established*, not the plan that established it. If no such\nEvidence node exists, that is the finding \u2014 the outcome was never recorded \u2014\nand writing it is the fix.\n\nTwo edges deliberately violate the rule and are the exceptions that make it\nuseful: `superseded_by` and `amends` point forward in time, because a reader\nwho has reached a stale node must be carried to what replaced it.\n\n# Alternatives\n\n- **Three categories (Intent, Approach, Action)** \u2014 rejected: leaves\n  measurement and the brief homeless, and leaves the graph a one-way pipeline\n  with no way for what was learned to correct what was intended. The tooling\n  had already worked around the gap by inventing `experiment` from a path.\n- **Retro as a fifth category** \u2014 rejected: a retro has no region of its own;\n  it is defined entirely by what it points at. Giving it a category would put\n  one node type in two places.\n- **`subtype:` on evidence** \u2014 rejected: a type system inside a field. The\n  edges already distinguish them and are enumerable.\n- **Spatial direction rule (\"Action may cite Intent, never the reverse\")** \u2014\n  rejected: it forbids a legitimate and common case, a new goal justified by\n  what an earlier effort proved. Time is the thing actually being protected.\n\n# Consequences\n\n- `bin/lint` enforces the seven types and errors on `context` and\n  `initiative-pointer`.\n- `bin/lint` can check the direction rule against `timestamp`, catching gross\n  violations; same-day ones are invisible, since timestamps are dates.\n- `bin/relevant` and `bin/ancestry` drop the `/experiments/` path sniff.\n- `bin/graph-build` gains an `evidence` fill and loses two.\n- The README's diagram (`docs/lineage.svg`) is an artifact of this decision and\n  is regenerated by `bin/diagram` when the categories change.\n", "mtime": "2026-11-07T16:27:56+00:00"}, {"path": "knowledge-catalog/decisions/D0003-identifiers.md", "meta": {"id": "D0003", "type": "decision", "title": "Identifiers are a type letter and a flat global four-digit sequence", "description": "Every node carries an id like D0003 \u2014 one immutable type letter, one globally unique number, no hierarchy \u2014 recorded in both the filename and the frontmatter, with uniqueness enforced by the linter.", "timestamp": "2026-11-07", "tags": ["brain", "identifiers", "lint"], "status": "active", "serves": "../goals/G0001-a-brain-others-can-adopt.md", "invariant": "An id is unique across the brain and is never reused or renumbered except to resolve a collision.", "constrains": ["bin/lint", "bin/new", "bin/renumber", "bin/ancestry"]}, "body": "\n# Context\n\nNumbering was inconsistent and ambiguous. Decisions were documented as four\ndigits and tasks as three. A bare number did not say what it referred to, and\n`bin/ancestry` resolved one by scanning initiative folders in sort order and\n**taking the first match silently** \u2014 two initiatives with an `022` yielded the\nwrong lineage with no warning.\n\nThe stated invariant that \"a task's blockers always have lower numbers\" was\nenforced by nothing and broken by any renumbering.\n\n# Decision\n\nAn id is **one type letter plus four digits**, flat, with no hierarchy:\n\n`G` goal \u00b7 `D` decision *and* principle \u00b7 `P` plan \u00b7 `S` spec \u00b7 `T` task \u00b7 `E` evidence\n\n- **Global for every type.** `S0001` is one spec in this brain, full stop.\n  Tasks are not scoped by initiative: the initiative is a folder and a\n  frontmatter field, and putting it in the id would duplicate a mutable fact.\n- **Principles share the `D` sequence**, which resolves the Plan/Principle\n  letter collision and states the relationship: a principle is a decision with\n  no alternatives and no expiry.\n- **Recorded twice**: `id:` in frontmatter and as the filename prefix\n  (`D0003-identifiers.md`). The linter checks they agree. The frontmatter copy\n  means a rename cannot orphan a node; the filename copy means the id is\n  visible in a diff, a `git log --stat` and an editor tab.\n- **Never renumbered**, except to resolve a collision, for which `bin/renumber`\n  rewrites the file and every citation of it.\n- `bin/new <type>` allocates, so a number is never picked by hand.\n\nNine thousand nine hundred and ninety-nine is not a real ceiling for a\nhuman-maintained record. The overflow valve for tasks is a new initiative, not\na fifth digit.\n\n# Alternatives\n\n- **Hierarchical ids (`S0001-T0002`)** \u2014 rejected, and this was the closest\n  call. The parent is mutable: retarget the task to another spec and either the\n  filename changes, breaking every citation in every journal, log entry and\n  commit message, or the id lies. It also duplicates the `spec:` field, so the\n  two can disagree. Type is immutable, parentage is not \u2014 so type goes in the\n  id and parentage stays in frontmatter.\n- **ULIDs or content hashes** \u2014 rejected: collision-free and unmemorable.\n  \"Task 22\" and `bin/ancestry 022` are load-bearing affordances, and reading a\n  decision record in order is worth keeping.\n- **Initiative-scoped task numbers** \u2014 rejected: `T0001` would then exist in\n  five folders, which breaks both `id:` in frontmatter and the linter's\n  duplicate check, the two things that make the id trustworthy.\n- **Per-operator number ranges, or allocate-at-merge** \u2014 rejected as premature.\n  Solo, a collision never happens; on a small team it happens a few times a\n  year. Each of these costs the ordering that the sequence buys, to solve a\n  problem `bin/renumber` resolves in one command.\n- **Wider zero-padding as the answer to growth** \u2014 rejected: it treats a\n  folder-shaped problem as a digit-shaped one.\n\n# Consequences\n\n- **`bin/lint` must error on a duplicate id.** This is not optional: two\n  operators adding `D0014` with different slugs produce different filenames,\n  so **git merges them cleanly** and nothing else would notice.\n- `bin/lint` also checks id/filename agreement and the four-digit width, so\n  nobody invents `D14` or `D10000`.\n- Dependency order is no longer implied by a task's number. It never was\n  enforced; `blocked_by` is the truth and `bin/status` reads it.\n- If brains ever need to reference each other, the namespace is the brain, not\n  the operator: `myproject/D0014`. Carrying `id:` in frontmatter leaves that\n  door open without opening it now.\n", "mtime": "2026-11-07T16:28:42+00:00"}, {"path": "knowledge-catalog/decisions/D0004-placement-and-install.md", "meta": {"id": "D0004", "type": "decision", "title": "The brain is embedded in the repository by default, and installing it is two steps", "description": "Co-versioning with the code is what makes a dated claim checkable, so embedded is the default and sibling is the supported escape; bin/adopt installs and INIT.md fills.", "timestamp": "2026-11-07", "tags": ["brain", "portability", "install"], "status": "amended", "serves": "../goals/G0001-a-brain-others-can-adopt.md", "constrains": ["bin/adopt", "bin/doctor", "bin/stale", "config.md"]}, "body": "\n# Context\n\nAdoption was `cp -R`, `ln -s`, `git init`, `lint`, `graph-build`, performed by\nhand and documented in a README list that asked the operator to write a brief\nand a glossary before they had anything to put in them.\n\nPlacement was never decided, only assumed: `bin/stale` hardcodes\n`ROOT = ../..` and scans paths beginning `brain/`, which works **only because\nthe folder happens to be named `brain` and sits one level down**. The template\npasses its own linter by coincidence.\n\n# Decision\n\n**Embedded in the version-controlled repository is the default.** The brain\nlives at `<repo>/brain/` and commits with the code.\n\nThe argument is specific: co-versioning is the only mechanism that makes \"this\ndecision was true at this commit\" checkable rather than asserted. A decision\nand the code it governs move in one commit, the reviewer meets it in the pull\nrequest, and `git log` puts the why beside the what. Every alternative\nsubstitutes vigilance, and [D0001](D0001-claims-must-be-checkable.md) is about\nnot relying on vigilance.\n\n**Sibling is supported, not merely tolerated**, and is required in two cases\nthat will occur: the operator does not control the repository (client work, a\ntake-home, an outside contribution), or one brain serves several repositories.\nIn sibling mode **nothing is written into the project repositories at all** \u2014\nsee the amendment below for what that means mechanically.\n\n**The mode is recorded, never inferred.** `brain/config.md` is an OKF\n`evidence` node carrying `mode` and `repos`, so the tools stop guessing.\n\n**Install is two steps with different shapes**:\n\n- **`bin/adopt`** \u2014 mechanical, no model. Symlink into `.claude/skills`, stamp\n  the date placeholders, write `config.md`, relocate the template's own record\n  to `example/`, `git init` when sibling, run `lint` and `graph-build`. Run\n  once. It ends by printing the next step.\n- **`INIT.md`** \u2014 the skill. Reads the host repository, imports existing\n  ADRs and `CONTEXT.md`, mines the Claude transcript history for repeated\n  corrections, and interviews for the first goal. Needs judgement, so it cannot\n  be a script. Run again when a second repository is adopted.\n\nThey do not call each other. One installs, one fills; they rerun on different\nschedules and fail in different ways.\n\n**Distribution is by fork, not by copy**, so a fix upstream reaches a user as\n`git pull template main` rather than never.\n\n**The template's own record is relocated, not deleted.** `bin/adopt` moves it\nto `brain/example/`, which `lint` and `graph-build` skip, and prints how to\nremove it. Deleting on install takes away the worked example at the moment it\nis most needed.\n\n# Alternatives\n\n- **Sibling by default** \u2014 rejected: it severs the brain from the commit that\n  makes its claims checkable, which is the whole value.\n- **Inferring the mode from the directory layout** \u2014 rejected: that is what\n  `bin/stale` does today, and it is why the script works by coincidence.\n- **One comm
