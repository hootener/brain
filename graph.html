October, written while doing it. The template now lives at\n`~/Source/brain`, its own git repo.\n\n# What copied unchanged\n\n- The structure: `knowledge-catalog/{decisions,specs,reference}`, `plans/`, `tasks/`, `work/`,\n  `brief/`, `bin/`.\n- `howto.md`, `work/README.md`, the agent-skills adaptation layer (`tracker.md`,\n  `triage-labels.md`, `index.md`) and the three templates.\n- `bin/lint` and `bin/status`, byte for byte apart from a docstring line.\n\n# What had to change\n\n| Thing | Why | Change |\n|---|---|---|\n| `bin/ancestry` | hardcoded one initiative folder name | resolves a task number across every initiative folder; `<initiative>/NNN` pins one |\n| `bin/graph-build` | page title hardcoded | title is the name of the folder that holds `brain/` |\n| `bin/stale` | counted PHPUnit tests and adversarial scenarios from the host app; scanned `bootstrap.sh` and `experiments/` | knows decisions and tickets; host-project facts are added per project |\n| `bin/relevant`, `bin/graph-build`, `bin/lint` | walked `templates/` and `skills/` as knowledge | both skipped |\n| `bin/change`, `bin/pin`, `bin/security` | entirely about the host app's test harness, PHP pins and prompt-fence invariants | not ported; they are the shape of project-specific checks, not generic ones |\n| `/grill-change` | cited the first project's decision numbers, counts and failure history in its prose | generic prose; project-specific pitfalls now come from [E0001](E0001-brain-in-practice.md) |\n| `/spec-review`, `/interrogate` | one worked example each from the first project; a vocabulary blacklist from its domain | example made anonymous; blacklist points at the glossary's `_Avoid_` notes |\n| `/domain-modeling`, `/to-tasks` (from the product team's repository) | named `backend-api` and `the product team-light` | host repo named generically |\n| `reference/agent-skills/domain.md` | \"the distilled code carries no agent-facing documentation\" | \"the host repository's own CLAUDE.md / CONTEXT.md are read, not written\" |\n| Skill location | reference keeps skills at `<project>/.claude/skills`, outside the brain | canonical in `brain/skills/`, symlinked |\n| `goals/` | taxonomy had `goal` with nowhere to put one | `knowledge-catalog/goals/` with an index; `plan`, `goal`, `context` templates added |\n\n# What the template still lacks\n\n1. **A one-command install.** Today it is `cp -R`, `ln -s`, `git init`, `lint`, `graph-build`.\n   A `bin/adopt <project>` that does those and rewrites the `<YYYY-MM-DD>` placeholders would\n   make it literally drag-and-drop.\n2. **Host-project hooks in `stale`.** The design is right (a `facts()` list) but adding a fact\n   means editing Python. A small `brain/stale.toml` naming a command and a noun would let a\n   project add \"tests\" without touching the script.\n3. **The docstrings still narrate the first project.** `relevant`, `ancestry`, `stale` and the\n   skills explain themselves with that project's war stories. Harmless, occasionally confusing;\n   tidy as they are touched.\n4. **`change`, `pin`, `security` as patterns.** They are the most valuable scripts in the\n   reference brain and the least portable. A `bin/README.md` describing what each defended, so a\n   new project knows what to build, would carry the idea without the PHP.\n5. **Windows.** The symlink needs privileges there; a copy-on-install fallback would be needed.\n6. **Skills' own tests.** Nothing checks that a skill still runs after an edit. The reference\n   brain had the same gap.\n\n# What this project will test next\n\nWhether the generic `/grill-change` is still sharp with an empty `brain-in-practice.md`, and\nwhether the tracker shape holds for a project whose \"initiative\" is a take-home with two very\ndifferent halves.\n", "mtime": "2026-11-11T20:23:13+00:00"}, {"path": "knowledge-catalog/reference/E0003-adoption-greenfield.md", "meta": {"id": "E0003", "type": "evidence", "title": "Adoption feedback: greenfield embedded install, 2026-11-08", "description": "Nine findings from a session that did not build this brain adopting it into an empty project, each with the command that reproduces it.", "timestamp": "2026-11-08", "tags": ["brain", "adoption", "feedback"], "status": "active"}, "body": "\n# Brain adoption feedback \u2014 greenfield embedded install\n\n**From**: a Claude Opus 5 / Claude Code session adopting the brain into a brand-new,\nempty, non-git repository on 2026-11-08. The raw transcript is not\ncommitted, per the rule that feedback is evidence and its raw material is not\n(`feedback/README.md`), so this node is the record of it.\n\n**Installed from**: upstream `98bb876`, which was `origin/main` HEAD at clone time.\nTwo commits behind `642b933` by the time this was written. Both ids belong to\nthe development history, which is not published, so they resolve to nothing\nhere. They are kept as the record of what was installed, not as something to\nlook up.\n\n**Install performed**: embedded mode, `cp -R` + `rm -rf brain/.git`, `bin/adopt --with-ci`,\n`example/` kept. Then `INIT.md` (read from the file, see finding 0).\n\n**Result**: install sound. `bin/doctor` 0/0, `bin/lint` 23 files 0 errors 0 warnings,\n`bin/selftest` 29 passed, `bin/stale` clean. One goal, one decision, one principle and\na glossary extension written.\n\nEvery claim below was verified against the files; the reproducing command is included\nso you can check rather than take my word for it.\n\n---\n\n## Verified and resolved, 2026-11-08\n\nEvery finding reproduced against `642b933` before being fixed; the reporter\ninstalled from `98bb876`, two commits behind, so this was not assumed.\n\n| # | What changed |\n|---|---|\n| 1 | `bin/index` rebuilds every folder index from the nodes present; `bin/new` calls it, appends the change-log line and rebuilds the graph. `howto.md` no longer promises what nothing did. |\n| 5 | `INIT.md` branches on greenfield vs in-flight *before* step 1, and the greenfield branch mines the live conversation with step 3's signal discipline. |\n| 2 | `lint` errors on an unfilled `<placeholder>` in a title, a description or a body. First version flagged ten documented command syntaxes and zero real scaffolds; backticks and fences are now skipped. |\n| 3 | `bin/new` counts ids under `example/`, so a default install starts at `D0010`. `--bare` still starts at `D0001`. `bin/selftest` asserts no id is used twice anywhere. |\n| 4 | `config.md` gains `tracker:` and `docs:`, stubbed by `adopt` and filled by `INIT.md`. The tracker choice is now written as a decision, since it has alternatives and a consequence. |\n| 0 | `bin/doctor` reports a `.claude/skills` link made in the last ten minutes, so a lucky recovery does not hide the diagnosis. |\n| 7 | The README's embedded quickstart opens with `git init`. |\n| 6 | `INIT.md` states that same-day forward references among init nodes are fine and not to be worked around. |\n| 8 | Fixed by 1: `bin/new` rebuilds the graph, so the staleness warning stops firing after every write. |\n\nTwo of these were only findable from outside. **Nothing wrote an index**\nwhile two documents promised something did \u2014 the author could not see it\nbecause the author never ran `INIT.md` by the book. And **the default\ninstall shipped an id collision**, which `bin/selftest` passed over because it\nskipped `example/` for the same reason `bin/new` did.\n\n---\n\n## 0. Cold start \u2014 already fixed, with a nuance your fix doesn't cover\n\n`bin/adopt` printed \"Next: run `INIT.md` in Claude Code\". `INIT.md` returned\n`Unknown skill: brain-init`, because Claude Code discovers skills at session start and\n`.claude/skills` was created seconds earlier.\n\nYou have already fixed this in `642b933` (\"The first cold-start finding: adopt tells\nyou to run a skill you cannot run\"), which adds `\u26a0 Restart Claude Code before the next\nstep.` That text is right.\n\n**The nuance**: it self-healed. Several tool calls later the skills appeared in the\nsession's available-skills list with no restart. A transient failure is worse than a\npermanent one here, because an agent that retries after doing something else succeeds\nand never learns the rule \u2014 so the next adopter's agent rediscovers it from scratch.\n\nConsider having `bin/doctor` report whether `.claude/skills` postdates the current\nsession, so the diagnosis survives a lucky recovery.\n\n**Side effect worth knowing**: the only way forward was `cat brain/skillsINIT.md/SKILL.md`.\nThat directly contradicts the `using-superpowers` instruction \"Never use the Read tool on\nskill files.\" If the brain ships as a Claude Code plugin (your `D0010` ticket), this\ngoes away.\n\n---\n\n## 1. `howto.md` promises index upkeep that nothing implements  \u2190 fix first\n\n`knowledge-catalog/howto.md:19`:\n\n> The intended path is through the skills ... They handle the format, the taxonomy,\n> the ids, the cross-linking and **the index upkeep**.\n\n`CLAUDE.md`:\n\n> Don't hand-edit an index or a log where a skill would write it.\n\nBut nothing writes them:\n\n```console\n$ grep -rl \"log\\.md\" brain/skills/\n(no hits)\n\n$ grep -rln \"goals/index\\|decisions/index\" brain/bin/ brain/skills/\nbrain/bin/adopt        # only EMPTY_INDEXES, which RESETS them to \"(none yet)\"\nbrain/bin/selftest\n```\n\n`bin/new` allocates the id and scaffolds the node, and touches no index. So a\nby-the-book `INIT.md` ends with `goals/index.md` saying *\"(none yet)\"* and\n`log.md` saying *\"(nothing yet)\"* while three nodes exist on disk.\n\nThe documentation forbids the only action that fixes it. I hand-edited all three\nagainst instructions, because there was no alternative.\n\n**Options**: `bin/new` appends the index row and a `log.md` entry \u2014 it already owns id\nallocation, so this is the same mechanical job; or the docs stop promising it and say\nindexes are hand-maintained.\n\n**Related lint gap**: nothing flags a node absent from its folder index. That is a\nnatural rule and exactly the silent drift D0001 exists to catch \u2014 an index that\nconfidently says \"none yet\" is a stale note, which the README argues is worse than no\nnote at all.\n\n---\n\n## 2. Unfilled scaffolds pass lint clean\n\n```console\n$ brain/bin/new evidence \"Placeholder lint probe\"\nknowledge-catalog/reference/E0001-placeholder-lint-probe.md\n$ brain/bin/lint\n23 files \u00b7 0 errors \u00b7 0 warnings\n```\n\nThat node still contained `description: <one sentence>` in its frontmatter and\n`<what you observed>` in its body. (The only warning in the run was unrelated\n`graph.html` staleness \u2014 see finding 8.)\n\nA placeholder reaching the record is an uncheckable claim wearing a node's frontmatter,\nwhich is D0001's precise target, and the gate waves it through. An error on `<...>`\nangle-bracket placeholders in frontmatter values and section bodies is a cheap regex\nwith real value \u2014 it would have caught me had I been lazier.\n\n---\n\n## 3. Id collision between `example/` and the live record\n\n```console\n$ ls brain/example/knowledge-catalog/decisions/\nD0001-claims-must-be-checkable.md   ... through D0009\n\n$ brain/bin/new decision \"Dogfood the adoption path\"\nknowledge-catalog/decisions/D0001-dogfood-the-adoption-path.md\n```\n\nBoth the README and `CLAUDE.md` state that ids are \"flat and global\". After a default\ninstall there are two `D0001`s in one tree. In my record `D0001` means *\"Dogfood the\nadoption path\"*; in `CLAUDE.md`, `howto.md`, `config.md` and five skills, `D0001` means\n*\"claims must be checkable\"*.\n\nBecause keeping `example/` is the default, every adopter gets this on day one, and prose\ncitations of the form \"see D0001\" become ambiguous immediately.\n\n**Options**: renumber `example/` into a reserved band (`D9001+`); have `bin/new` skip ids\npresent under `example/`; or state in the README that `example/` is a separate namespace.\n\n---\n\n## 4. `INIT.md` step 1 elicits answers with nowhere to put them\n\nFour questions are asked. Only one has a destination.\n\n| Q | Destination |\n|---|---|\n| 1. Which repositories? | Already in `config.md`, written by `adopt`. Redundant in embedded mode \u2014 and asking invites an answer that contradicts the file. |\n| 2. Where do docs already live? | **Nowhere.** |\n| 3. Tracker: mirror or replace? | **Nowhere.** I put it in `log.md` because nothing else fit. |\n| 4. What is the project for? | A `goal` node. Works well. |\n\n**Options**: `config.md` gains `tracker:` and `docs:` fields that `adopt` stubs and\n`INIT.md` fills; or the tracker choice becomes a decision node \u2014 it is genuinely one,\nwith alternatives (mirror / replace) and consequences (two places to keep in step).\n\n---\n\n## 5. The greenfield path has no guidance, and it is a common adoption case\n\nThe skill says:\n\n> **A greenfield brain is easy. This is for the hard case**\n\nThen four of its five steps serve the hard case. For this adoption, steps 2, 3 and 4\nwere complete no-ops:\n\n- Step 2 (import ADRs, `CONTEXT.md`, glossary) \u2014 no docs existed.\n- Step 3 (mine transcript history) \u2014 the only `.jsonl` for this project path was the\n  session performing the install.\n- Step 4 (mine git history) \u2014 `fatal: your current branch 'main' does not have any commits yet`.\n\n**But there was plenty to capture, and it was all in the live conversation.** Both\ndecisions I recorded came from the user's chat messages:\n\n- `D0002` (human-facing prose only; agent-facing text stays plain) came from the opening\n  message \u2014 *\"We do not care about prose that will be consumed by agents.\"*\n- `D0001` (build the setup path first, generate the maintainer's own voice skills by\n  running it) came from one clause in a reply to a clarifying question \u2014 *\"the goal here\n  is to make this an adoptable project, then we'll use the adoptable version to make our\n  own voice setup, like any other end user would.\"*\n\nThat second one is a real decision with alternatives and consequences, and it arrived\nsideways in an answer to a different question. Nothing in `INIT.md` told me to look\nthere.\n\n**For a greenfield project the current conversation is the only source of decisions that\nexists.** Step 3's craft \u2014 \"the same correction made more than twice\", reversals,\nstanding constraints \u2014 is good, and it is all aimed at history that hasn't happened yet.\nA greenfield branch that mines the live conversation, using that same signal discipline,\nwould have cost nothing and is where the value actually was.\n\n---\n\n## 6. The direction rule is inert during `INIT.md`\n\nEverything written during init is stamped with today's date, so \"nothing cites a node\nnewer than itself\" cannot fire. I wrote `G0001` with a link to `D0001` before `D0001`\nexisted, and lint passed.\n\nNot a bug \u2014 date granularity is the right call. But the skill leans hard on the\ndirection rule (\"twenty-eight times, in the first real adoption\"), which is about\n*imported* nodes with origin dates. Stating that same-day forward references among init\nnodes are fine and intentional would stop an agent wasting effort ordering its writes\nor, worse, back-filling dates to force an order.\n\n---\n\n## 7. The README's embedded quickstart omits `git init`\n\nThe copy-paste block runs:\n\n```bash\ncp -R /tmp/brain-template <project>/brain\nrm -rf <project>/brain/.git\ncd <project>/brain\nbin/adopt\n```\n\nOn a brand-new project this fails, because `adopt` requires a git host in embedded mode:\n\n> `<host>` is not a git repository. A brain is only checkable against history when it is\n> versioned \u2014 `git init` it, or use `--sibling`.\n\nThat error text is good \u2014 it names both exits and the reason. But greenfield adoption\nhits it every time, and one line in the README (or `adopt` offering to run `git init`)\nremoves the stumble entirely.\n\n---\n\n## 8. `graph.html` staleness nags after every write\n\n`bin/lint` warns until `bin/graph-build` runs:\n\n```\nwarn  graph.html is older than 3 file(s) it is built from (...) \u2014 run `brain/bin/graph-build`\n```\n\nAcross six node writes in one init session this appeared repeatedly. The risk is\nlearning to ignore a warning, which is the habit D0001 is against. Having `bin/new`\nrebuild, or suppressing the warning when graph staleness is the *only* finding, keeps\nthe signal meaningful. Low priority.\n\n---\n\n## What worked \u2014 don't change these\n\n- **`bin/adopt --dry-run`.** It showed the exact `example/` relocation (14 paths) and the\n  symlink before touching anything. It is why the install felt safe rather than hopeful.\n\n- **\"Copy, do not clone\", with the gitlink explanation.** Explaining the failure mode \u2014\n  eighty files collapsing into one unresolvable entry, knowledge invisible to the repo\n  it is meant to be versioned with \u2014 is why I got it right first time instead of reading\n  a rule and guessing the reason. `bin/doctor` backstopping it is the right belt-and-braces.\n\n- **`bin/constraints` paid off in the same session the decisions were written.** The\n  README promises the return \"the second time\". But because `constrains:` is declared at\n  authoring time, `brain/bin/constraints skills/` already returned both new decisions as\n  governing the next piece of work, minutes after writing them. That is a stronger pitch\n  than the README currently makes, and worth saying out loud.\n\n- **`ancestry --forward` finding omission.** The genuinely novel capability versus every\n  other knowledge tool, and \"Nothing outstanding: everything this asked for has landed\"\n  is exactly the right phrasing.\n\n- **`bin/selftest`'s closing line** \u2014 *\"A green run locks in what three adoptions taught\n  us. It is not evidence the brain is ready for a project it has never met.\"* Correct\n  calibration, and rare. It set my expectations accurately for everything that followed.\n\n- **The `adopt` / `INIT.md` split.** Obviously right in practice: I could confirm the\n  install was mechanically sound before making a single judgment call, and the two failed\n  in different ways as D0004 predicts.\n\n- **`move_example`'s \"node files, never whole directories\" comment.** I would have made\n  that exact mistake, and the comment explains the consequence (a missing index, a\n  dangling link, seventeen warnings) rather than just stating the rule.\n\n---\n\n## Summary ranking\n\n| # | Finding | Severity |\n|---|---|---|\n| 1 | `howto.md` promises index upkeep nothing implements; docs forbid the only fix | high |\n| 5 | Greenfield path unguided; live conversation is the only decision source | high |\n| 2 | Unfilled `<placeholder>` scaffolds pass lint clean | medium-high |\n| 3 | `example/` id collision with the live record, by default | medium |\n| 4 | `INIT.md` Q2/Q3 answers have no destination | medium |\n| 0 | Cold start self-heals, so the lesson doesn't stick (fix already shipped) | low-medium |\n| 7 | README quickstart omits `git init` | low |\n| 6 | Direction rule inert during init; worth documenting | low |\n| 8 | `graph.html` staleness warning fatigue | low |\n", "mtime": "2026-11-11T21:47:57+00:00"}, {"path": "knowledge-catalog/reference/agent-skills/domain.md", "meta": {}, "body": "# Domain docs\n\nSingle-context. Everything lives in `brain/`. The host repository may carry its own agent-facing\nfiles (`CLAUDE.md`, `CONTEXT.md`); those are the team's and are read, not written, unless asked.\n\n## Before exploring, read\n\n- `brain/knowledge-catalog/glossary.md` \u2014 the project glossary, playing the `CONTEXT.md` role.\n- `brain/knowledge-catalog/decisions/` \u2014 decisions as OKF `decision` files.\n\nIf a file does not exist, proceed silently.\n\n## Where new entries go\n\n- A resolved term \u2192 `brain/knowledge-catalog/glossary.md`, in the `CONTEXT.md` style: term, tight\n  definition, an `_Avoid_` list where a near-synonym would mislead.\n- A decision \u2192 `brain/knowledge-catalog/decisions/NNNN-<slug>.md` from\n  [templates/decision.md](templates/decision.md); next number after the highest present.\n- A spec \u2192 `brain/knowledge-catalog/specs/<slug>.md` from [templates/spec.md](templates/spec.md).\n- Research or a stack fact \u2192 `brain/knowledge-catalog/reference/<slug>.md`, `type: context`.\n- A plan \u2192 `brain/plans/<YYYY-MM-DD>-<slug>.md`, `type: plan`.\n\n## Use the glossary's vocabulary\n\nName domain concepts as the glossary defines them. If a concept is missing, either the language is\nbeing invented \u2014 reconsider \u2014 or there is a gap, so add it.\n\n## Flag conflicts\n\nIf output contradicts a decision in the catalog, say so explicitly rather than silently overriding\nit. A decision that should change is **superseded** on the record, not quietly ignored.\n", "mtime": "2026-11-07T16:32:09+00:00"}, {"path": "knowledge-catalog/reference/agent-skills/index.md", "meta": {}, "body": "# Agent skills\n\nThe adaptation layer. The engineering skills in `.claude/skills/` are written generically against\n\"the issue tracker\" and \"domain docs\"; these three documents say what those mean here, so the\nskills need no local paths baked into them.\n\n* [tracker.md](tracker.md) \u2014 `brain/tasks/` as the tracker: layout, task frontmatter,\n  operations, claims, the frontier\n* [triage-labels.md](triage-labels.md) \u2014 the five triage roles as `status` plus a `wontfix` flag\n* [domain.md](domain.md) \u2014 where a term, decision, spec, plan or research note goes\n* [templates/](templates/) \u2014 the OKF files to start from\n\nSwapping these three documents retargets the whole skill set at a different tracker without\nediting a single skill.\n", "mtime": "2026-11-07T16:33:29+00:00"}, {"path": "knowledge-catalog/reference/agent-skills/tracker.md", "meta": {}, "body": "# The tracker: brain/tasks (local OKF markdown)\n\nTasks live as markdown files under `brain/tasks/`, in Google's Open Knowledge Format: YAML\nfrontmatter plus a markdown body, linked with relative markdown links. The files are the tracker;\nthere is no service behind them.\n\nThe word is **task**, everywhere. \"Ticket\" and \"issue\" are the same thing said two other ways,\nand a project that describes one concept three ways is the thing `/domain-modeling` exists to\ncatch.\n\n## Layout\n\n```\nbrain/tasks/\n\u251c\u2500\u2500 README.md\n\u251c\u2500\u2500 TODO.md                      # the loose to-do list; not a tracker\n\u251c\u2500\u2500 misc/                        # one-off tasks belonging to no initiative\n\u2502   \u2514\u2500\u2500 T0001-<slug>.md\n\u2514\u2500\u2500 <initiative>/                # one folder per planned thing\n    \u251c\u2500\u2500 index.md                 # ordered list of the tasks, with status\n    \u251c\u2500\u2500 map.md                   # optional: wayfinder map\n    \u2514\u2500\u2500 T0002-<slug>.md          # one task per file\n```\n\nIds are **global and flat** (D0003): `T0002` is one task in this brain, wherever it lives.\nAllocate with `brain/bin/new task \"<title>\" --initiative <folder>`; never pick a number by hand.\n\nThe number does **not** encode dependency order \u2014 `blocked_by` carries that, and `brain/bin/status`\ncomputes the frontier from it. The old convention that \"a task's blockers always have lower\nnumbers\" was enforced by nothing and broken by any renumbering. Never put more than one task in\na file.\n\n## Task file\n\nTemplate: [templates/task.md](templates/task.md). Frontmatter:\n\n| Field | Required | Values |\n|---|---|---|\n| `id` | yes | `T` plus four digits, from `brain/bin/new` |\n| `type` | yes | `task` |\n| `title` | yes | short imperative title |\n| `description` | yes | one sentence |\n| `status` | yes | `Not Ready` \u00b7 `Ready for Development` \u00b7 `In Progress` \u00b7 `Testing` \u00b7 `Complete` \u00b7 `Delivered` \u00b7 `Superseded` |\n| `initiative` | yes | the folder name |\n| `blocked_by` | yes | list of relative links to blocking task files, or `[]` |\n| `category` | recommended | `bug` \u00b7 `enhancement` |\n| `wontfix` | optional | `true` when the request was rejected; status stays as it was |\n| `claimed_by` / `claimed_at` | set on claim | worker name as `ListAgents` shows it; ISO 8601 |\n| `spec` | when one exists | relative link to the spec \u2014 this is the task's lineage edge, so a reverse walk cannot reach Intent without it |\n| `wayfinder` | optional | `research` \u00b7 `prototype` \u00b7 `grilling` \u00b7 `task` \u2014 set on map child tickets |\n| `pr` | optional | list of PR URLs |\n| `timestamp` | yes | creation date |\n| `tags` | recommended | short strings |\n\nStatus meanings: **Not Ready** needs triage or more information; **Ready for Development** is\nfully specified and claimable; **In Progress** is claimed; **Testing** has code pushed and is\nunder review; **Complete** is merged; **Delivered** is live; **Superseded** is built and then\nremoved \u2014 the code is in the history and nobody is going to pick it up.\n\n## Who moves a status\n\nEvery transition has exactly one owner (D0007). A transition with no owner does not happen,\nwhich is how `Testing \u2192 Complete` used to require the operator to ask for it by hand.\n\n| Transition | Owner | Trigger |\n|---|---|---|\n| `Not Ready` \u2192 `Ready for Development` | `/triage` | an agent brief is written |\n| `Ready for Development` \u2192 `In Progress` | `/implement` | the claim |\n| `In Progress` \u2192 `Testing` | `/implement` | the branch is pushed |\n| `Testing` \u2192 `Complete` | `/spec-review` | the reverse walk passed |\n| `Complete` \u2192 `Delivered` | the commit hook | merged and deployed |\n| any \u2192 `Superseded` | `/grill-change` or `/audit` | decided |\n\n`brain/bin/reconcile` reports where a status and the repository disagree; `/audit` resolves what\nit cannot judge. Neither changes an inferred status without an answer.\n\nBody headings: `# What to build`, `# Acceptance criteria`, `# Out of scope`, `# Log`. Comments,\ntriage notes and agent briefs append under `# Log` as `## YYYY-MM-DD \u2014 <who>` entries, newest\nlast.\n\n## Operations\n\n- **Create an issue**: write `brain/tasks/<initiative>/NNN-<slug>.md` from the template, add it to\n  the initiative `index.md`.\n- **Read an issue**: read the file. References are paths; \"subcontractors 003\" means\n  `brain/tasks/subcontractors/003-*.md`.\n- **List issues**: `brain/bin/status [initiative]`, or scan frontmatter.\n- **Comment**: append under `# Log`.\n- **Change state**: edit `status`; see [triage-labels.md](triage-labels.md) for the role mapping.\n- **Close**: set `status: Complete`, or add `wontfix: true` with a `# Log` entry giving the reason.\n- **Claim**: read, confirm `Ready for Development` and no `claimed_by`, set `status: In Progress`,\n  `claimed_by`, `claimed_at`, write, then **re-read to confirm**. Claim first, work second. Then\n  open `brain/work/<initiative>/<worker>.md` and journal.\n- **Frontier**: tasks that are `Ready for Development`, unclaimed, and whose every `blocked_by`\n  target is `Complete` or `Delivered`; lowest number first. `brain/bin/status` computes it.\n\n## When a skill says \"publish to the issue tracker\"\n\nWrite the task files. Specs go to `brain/knowledge-catalog/specs/` and the initiative folder links\nto them.\n\n## When a skill says \"fetch the relevant ticket\"\n\nRead the task file at the given path or resolved number.\n\n## Wayfinding operations\n\nFor the `wayfinder` skill, which plans by resolving decisions rather than by slicing a build.\n\n- **Map**: `brain/tasks/<initiative>/map.md`, with the Destination / Notes / Decisions-so-far /\n  Not-yet-specified / Out-of-scope body. `map.md` is reserved \u2014 no frontmatter required.\n- **Child ticket**: a numbered task file with `wayfinder: research | prototype | grilling | task`\n  in its frontmatter and the question under `# Question`.\n- **Blocking**: `blocked_by`. Unblocked when every blocker is `Complete`.\n- **Frontier / claim**: as above.\n- **Resolve**: append the answer under `# Answer`, set `status: Complete`, then add a one-line\n  pointer to the map's Decisions-so-far.\n", "mtime": "2026-11-07T16:48:52+00:00"}, {"path": "knowledge-catalog/reference/agent-skills/triage-labels.md", "meta": {}, "body": "# Triage labels\n\nThe skills speak in five canonical triage roles. There are no labels here; roles map onto the task\nfile's `status` field and a `wontfix` flag.\n\n| Role | In this tracker |\n|---|---|\n| `needs-triage` | `status: Not Ready`, no triage notes in `# Log` yet |\n| `needs-info` | `status: Not Ready`, latest `# Log` entry is a Triage Notes block with open questions |\n| `ready-for-agent` | `status: Ready for Development`, latest `# Log` entry is an Agent Brief |\n| `ready-for-human` | `status: Ready for Development`, `# Log` notes why it cannot be delegated |\n| `wontfix` | `wontfix: true` plus a `# Log` entry giving the reason; status unchanged |\n\nCategory roles (`bug`, `enhancement`) go in the `category` field.\n\nThe remaining statuses \u2014 `In Progress`, `Testing`, `Complete`, `Delivered` \u2014 are lifecycle, not\ntriage. Triage never sets them.\n", "mtime": "2026-11-07T16:32:09+00:00"}, {"path": "knowledge-catalog/reference/index.md", "meta": {}, "body": "# Reference\n\n**Evidence**: how things actually are, as opposed to how they were decided to\nbe. Stack facts, measurements, gotchas, research notes, and what a review or\nan audit found.\n\nAn evidence node that corrects something upstream carries `amends:`; one that\nrecords a looking-back pass carries `reviewed:`; one that was given rather\nthan gathered carries `resource:`. A plain measurement carries none.\n\n| id | Status | Title |\n|---|---|---|\n| [E0001](E0001-brain-in-practice.md) | active | The brain in practice |\n| [E0002](E0002-portability-findings.md) | active | Portability findings: lifting this brain out of the project it grew in |\n| [E0003](E0003-adoption-greenfield.md) | active | Adoption feedback: greenfield embedded install, 2026-11-08 |\n", "mtime": "2026-11-08T17:25:11+00:00"}, {"path": "knowledge-catalog/specs/index.md", "meta": {}, "body": "# Specs\n\n**Approach.** Feature specs, in the shape `/to-spec` writes and `/to-tasks`\nconsumes. A spec carries `serves:` pointing at the goal it pursues; that edge\nis what lets a reverse walk terminate in Intent.\n\n*(none yet \u2014 `brain/bin/new spec \"<feature>\"`)*\n", "mtime": "2026-11-08T17:18:44+00:00"}, {"path": "plans/formalize/P0001-ready-the-brain-for-adoption.md", "meta": {"id": "P0001", "type": "plan", "title": "Ready the brain for other people to adopt", "description": "Close the gaps the first two real adoptions exposed, so a second operator can install this brain into a project already in flight and trust what it tells them.", "timestamp": "2026-11-08", "tags": ["brain", "formalize"], "status": "active", "initiative": "formalize", "serves": "../../knowledge-catalog/goals/G0001-a-brain-others-can-adopt.md"}, "body": "\n# Intent (forwardable)\n\nThis repository is a system for keeping the reasoning behind a project \u2014 the\ngoals, the decisions, the plans, what was learned afterwards \u2014 as plain files\nthat a person, a diff and an agent can all read. It works for the person who\nbuilt it. This work is about making it work for somebody else.\n\nTwo real projects have now adopted it. Between them they surfaced a dozen\ndefects, none of which the system's own checks could have found, because a\nsystem that checks itself passes by construction. What is left is the\ndifference between a tool that works in the hands that made it and one that\nsurvives being handed over.\n\nWhen this is done, someone who has never seen the repository can fork it,\ninstall it into a project they are already halfway through, and have the\nrecord stay true as they work \u2014 without being taught the system first.\n\n# Goal\n\nClose the gaps between \"works for its author\" and \"survives being handed to\nsomebody else\", as recorded in\n[E0001](../../knowledge-catalog/reference/E0001-brain-in-practice.md).\n\n# Approach\n\nFix what real adoption surfaces, in the order it surfaces it, and write each\nfinding down before fixing it so the fix can be checked against the claim. The\nadoptions are the test suite until `bin/selftest` exists.\n\nThree classes of work, which is why the tasks are not strictly sequential:\n\n- **Tooling the adopter meets on day one** \u2014 the install, the checks, the\n  defaults. A fresh install that reports seventeen warnings is a broken\n  product regardless of what it does afterwards.\n- **The model** \u2014 where things the real world has, and this brain does not,\n  belong: a reason a task is blocked, an open question, an outward-facing\n  handoff.\n- **The record's own honesty** \u2014 the checks that stop a claim rotting, and the\n  false positives that make people stop reading them.\n\n# Sequence\n\n1. **Adopt into real projects and fix what breaks.** Done twice; the findings\n   are [E0001](../../knowledge-catalog/reference/E0001-brain-in-practice.md).\n2. **Make a fresh install clean** \u2014 zero errors, zero warnings, ids starting at\n   `D0001`. Done.\n3. **Close the measurement gaps** \u2014 citations that no tool could see, counts\n   that scope themselves. Done ([T0006](../../tasks/formalize/T0006-teach-lint-to-check-backticked-prose-paths-not.md)).\n4. **Model what adoption showed missing** \u2014 the reason a task is blocked\n   ([T0007](../../tasks/formalize/T0007-model-the-reason-a-task-is-blocked-instead.md)),\n   whether an open question is a node\n   ([T0008](../../tasks/formalize/T0008-decide-whether-an-open-question-is-a-node.md)).\n5. **Stop relying on adoption as the test suite**\n   ([T0005](../../tasks/formalize/T0005-add-bin-selftest-adopt-into-a-throwaway-host.md)).\n\n# Risks\n\n- **The brain grows a feature per adoption.** Every project will want\n  something. The guard is that a new type must fail to be expressible as edges\n  on an existing one before it is added \u2014 the test that kept `intent` and\n  `handoff` out of the taxonomy.\n- **Checks that cry wolf get switched off, and take the real findings with\n  them.** Two heuristics have already produced more false positives than\n  findings on real prose. Measure a rule against a corpus nobody wrote for it\n  before shipping it.\n- **The author is the worst tester.** Mitigated only by adopting into projects\n  whose content was written for something else.\n\n# Out of scope\n\n- A hosted service, a database, or any runtime. The files are the product.\n- Deadlines, consent dates, release processes, and anything else that models a\n  particular team's way of working rather than the work.\n", "mtime": "2026-11-08T15:59:16+00:00"}, {"path": "plans/index.md", "meta": {}, "body": "# Plans\n\nHow things get built: implementation plans, sequencing, and the reasoning\nbehind an approach. A plan carries `serves:` pointing at the goal it pursues.\n\nPlans are **not** decisions. A decision says what we chose and why; a plan\nsays how we intend to carry it out, and is superseded by what actually\nshipped rather than deleted, so the gap between intent and outcome stays\nvisible.\n\n*(none yet \u2014 `brain/bin/new plan \"<what it builds>\"`)*\n", "mtime": "2026-11-08T17:18:44+00:00"}, {"path": "tasks/README.md", "meta": {}, "body": "# tasks\n\nThe tracker. One OKF `task` file per task, under one folder per initiative. Ids are global and\nflat (`T0042`) and are allocated by `brain/bin/new task`; dependency order lives in `blocked_by`,\nnot in the number. The conventions are in\n[../knowledge-catalog/reference/agent-skills/tracker.md](../knowledge-catalog/reference/agent-skills/tracker.md).\n\nRun `brain/bin/status [initiative]` for the task table and the claimable frontier.\n\nInitiatives:\n\n* [formalize](formalize/index.md) \u2014 readying the brain for other people to adopt\n\n`TODO.md` is the loose list of things to do. It is not a tracker and nothing reads it\nprogrammatically.\n", "mtime": "2026-11-07T16:50:43+00:00"}, {"path": "tasks/TODO.md", "meta": {}, "body": "# TODO\n\nLoose list. Promote anything real into a task file under an initiative.\n", "mtime": "2026-10-31T01:45:38+00:00"}, {"path": "tasks/formalize/T0001-teach-bin-relevant-to-defer-to-bin-constraints.md", "meta": {"id": "T0001", "type": "task", "title": "Teach bin/relevant to defer to bin/constraints once decisions declare what they govern", "description": "Teach bin/relevant to defer to bin/constraints once decisions declare what they govern", "status": "Complete", "category": "enhancement", "initiative": "formalize", "blocked_by": [], "timestamp": "2026-11-07", "tags": ["brain", "formalize"]}, "body": "\n# What to build\n\n`bin/relevant` prints **every** decision on every call, because its own\ndocstring admits term matching misses the one that matters. That backstop stops\nworking exactly when the record grows big enough to need it: four lines at\nseventeen decisions, noise at eighty.\n\n`bin/constraints` now answers the same question by lookup instead of guess \u2014\nsee [D0005](../../knowledge-catalog/decisions/D0005-intent-layer-wiring.md).\nRetire the backstop once enough decisions declare `constrains:`.\n\n# Acceptance criteria\n\n- [x] `bin/relevant` no longer prints the full decision index unconditionally\n- [x] It prints the count of decisions declaring no `constrains:`, since those can never match a diff\n- [x] `/grill-change` runs both tools and the guidance in its step 1 still holds\n\n# Out of scope\n\n- Anything not named in the acceptance criteria above\n\n# Log\n\n## 2026-11-10 \u2014 done\n\nNot retired, narrowed, and the distinction is the whole design. \"Retire the\nbackstop once enough decisions declare `constrains:`\" assumes a threshold, and\na threshold would be an inference about a corpus this tool cannot see \u2014 one\nadopter has 11 of 12 declaring, another 1 of 23. D0011 applies.\n\nSo it asks the question per decision instead. A decision is reachable three\nways: this search matched it, it declares `constrains:` and `bin/constraints`\nwill find it, or **neither** \u2014 and only the third group is printed, because\nonly it is a gap. The list shrinks as the record improves and empties on its\nown, with no threshold to tune and nothing to retire later.\n\nMeasured both ways. On this brain, 11 of 12 declaring: four lines where twelve\ntitles used to be. On the consulting adopter's, 1 of 23: twenty titles, capped at twelve, each\none genuinely unreachable and the remedy attached.\n\nTwo things found while building it. The zero-hits branch returned before the\nbackstop ran \u2014 the one call where \"what could this not surface\" is the entire\nanswer. And `constrains:` had to be read from the raw head rather than the flat\nparser, which reads a block sequence as an empty string: the same YAML bug that\nonce let `constrains:` govern nothing past a green lint, in a fifth parser.\n\nPrompted by the consulting adopter measuring classification overhead down to ~5% and finding the\ncost had moved to retrieval \u2014 \"classification is flat per item, retrieval grows\nwith the record\". This task's own description predicted it weeks earlier: *four\nlines at seventeen decisions, noise at eighty.*\n", "mtime": "2026-11-11T20:12:23+00:00"}, {"path": "tasks/formalize/T0002-add-owner-and-mine-to-bin-status-and.md", "meta": {"id": "T0002", "type": "task", "title": "Add --owner and --mine to bin/status, and owner inheritance from plan to spec", "description": "Add --owner and --mine to bin/status, and owner inheritance from plan to spec", "status": "Not Ready", "wontfix": "true", "category": "enhancement", "initiative": "formalize", "blocked_by": [], "timestamp": "2026-11-07", "tags": ["brain", "formalize"]}, "body": "\n# What to build\n\nOwnership attaches at Approach and above and is inherited downward; a task's\nowner is its plan's owner unless overridden. Claims already cover *who is on it\nnow*, so no `assigned_to` field is added \u2014 a field duplicating a claim will\ndrift.\n\nMust not make solo use heavier: with no `owner:` anywhere, every flag is a\nno-op and the output is unchanged.\n\n# Acceptance criteria\n\n- [ ] `bin/status --owner <name>` filters to nodes owned by that team or person\n- [ ] `bin/status --mine` resolves the current worker name the way a claim does\n- [ ] An owner is inherited from the task's spec, and from that spec's plan, unless set locally\n- [ ] With no `owner:` set anywhere, output is byte-identical to today's\n\n# Out of scope\n\n- Anything not named in the acceptance criteria above\n\n# Log\n\n## 2026-11-11 \u2014 wontfix, on measurement rather than taste\n\nNot built, and the reason is recorded here rather than argued three more times\nin conversation.\n\n**The premise did not survive contact with the corpora.** Ownership is only\nworth modelling where more than one person competes for work, and across five\nbrains:\n\n* the consulting adopter carried `owner:` on six tasks, every one of them the same person, and\n  **dropped the field** on the test an adopter proposed \u2014 *does it change how\n  a conflicting record is read?* One name on six tasks arbitrates nothing.\n* the product team's repository is the only multi-person corpus and never asked for\n  this in ten rounds of feedback, with 63 tasks and 30 plans.\n* the solo research brain, the uncoached adopter and this brain are single-operator.\n\nSo the feature would be built for a team that exists, has the most tasks of\nanyone, and has not wanted it. `claimed_by` already answers *who is on this\nnow*, which is the question that actually gets asked.\n\n**What would reopen it:** a brain where two people are visibly picking from one\nfrontier and `bin/status` is making that harder. That is a complaint somebody\nmakes, not a gap to anticipate \u2014 and this record's own evidence is that the\ntools added on anticipation (`stale`, `reconcile`, `ancestry` in some corpora)\nare the ones nobody reaches for.\n\n`wontfix: true` rather than `Superseded`, because nothing replaced it: the need\nwas never demonstrated. `bin/status` drops it from the frontier, so no agent\npicks up work three conversations have decided against.\n", "mtime": "2026-11-11T20:12:23+00:00"}, {"path": "tasks/formalize/T0003-group-the-graph-legend-by-category-and-show.md", "meta": {"id": "T0003", "type": "task", "title": "Group the graph legend by category and show ids in node labels", "description": "Group the graph legend by category and show ids in node labels", "status": "Complete", "category": "enhancement", "initiative": "formalize", "blocked_by": [], "timestamp": "2026-11-07", "tags": ["brain", "formalize"]}, "body": "\n# What to build\n\nThe legend lists types alphabetically, which reads as an alphabet rather than\nas the model. Grouping by the four categories of\n[D0002](../../knowledge-catalog/decisions/D0002-four-categories.md) makes the\ngraph teach the shape the way `docs/lineage.svg` does.\n\nNode labels show the title only, so a node seen in the graph cannot be quoted\nin a commit message or a journal without opening it.\n\n# Acceptance criteria\n\n- [x] Legend groups type swatches under Intent, Approach, Action, Evidence, in that order\n- [x] A node's label is prefixed with its id\n- [x] `@intent` and the other three category names work as filters\n- [x] Existing `#tag`, `@type` and `@status` filters are unchanged\n\n# Out of scope\n\n- Anything not named in the acceptance criteria above\n\n# Log\n\n## 2026-11-11 \u2014 done, and checked in a browser rather than by reading\n\nOne `CATEGORY` map now feeds both the legend's grouping and the `@intent`\nfamily of filters, so the picture and the search cannot drift apart about what\na category contains. The category name is itself a clickable filter.\n\n`titleOf` prefixes the id and takes it out of the label budget, so a long title\ntruncates to make room rather than pushing the id off. Untyped files \u2014 README,\nCLAUDE.md, an index \u2014 have no id and are unchanged.\n\n**Verified by rendering it, not by reading the generator.** `file://` is not\nreachable from the browser tool, so it was served over localhost and driven\ndirectly:\n\n| filter | hits |\n|---|---|\n| `@intent` | 16 \u2014 goal 2, decision 13, principle 1 |\n| `@approach` | 1 |\n| `@action` | 11 |\n| `@evidence` | 3 |\n| `@decision`, `@draft`, `#brain` | unchanged |\n\nA sample label came back `D0001 The record is only worth\u2026`, which is the whole\npoint of the second criterion.\n\nOne thing noticed and deliberately left: `spec` draws its keyboard accelerator\nas `[1]`, because the letters it could claim are already taken and the\nallocator falls back to digits. Pre-existing, correct, and not in scope.\n\n**The checks added here assert generated source, not behaviour**, since the\nbehaviour lives in a browser the suite cannot drive. Recorded as weak in the\nsame terms as the skill-path checks: they catch the code being reverted, not\nthe picture being wrong.\n", "mtime": "2026-11-11T17:55:47+00:00"}, {"path": "tasks/formalize/T0004-give-bin-stale-a-per-project-facts-file.md", "meta": {"id": "T0004", "type": "task", "title": "Give bin/stale a per-project facts file so a host project can add a count without editing Python", "description": "Give bin/stale a per-project facts file so a host project can add a count without editing Python", "status": "Complete", "category": "enhancement", "initiative": "formalize", "blocked_by": [], "timestamp": "2026-11-07", "tags": ["brain", "formalize"]}, "body": "\n# What to build\n\n`facts()` is the right design but adding a count means editing Python, so a\nhost project that wants \"tests\" or \"migrations\" checked either patches the\nscript or goes without. Named as gap 2 in\n[E0002](../../knowledge-catalog/reference/E0002-portability-findings.md).\n\n# Acceptance criteria\n\n- [x] A project declares a countable fact by naming a command and a noun in a config file, not in Python\n- [x] A missing or malformed config leaves the two built-in facts working\n- [x] `bin/stale` still exits 1 when a declared count contradicts the repository\n\n# Out of scope\n\n- Anything not named in the acceptance criteria above\n\n# Log\n\n## 2026-11-11 \u2014 done, against a real failure rather than the stated gap\n\n`brain/facts.md`, a markdown table of `| noun | command |`. Reserved by `lint`,\nin `NEVER_TOUCHED` for `bin/update`, absent by default \u2014 a file nobody wrote\nruns nothing.\n\nThe task was written from E0002's portability gap: *a host project that wants\n\"tests\" or \"migrations\" checked either patches the script or goes without.*\nWhat justified building it was a different and sharper failure. An adopter\nwrote an `invariant:` claiming every resume PDF is at most two pages; one was\nthree; `bin/lint` passed and this tool reported *\"Nothing contradicts the\nrepository\"*, because `pages` was not a noun it could be taught. Verified by\nreproducing exactly that: **\"says 2 pages; there are 3\"**, exit 1.\n\nThis is the narrow case where D0005's correction can be partly undone. An\n`invariant:` is surfaceable, not checkable \u2014 except a **countable** one\nmeasured against a number the project can produce on demand. That is the only\nclass of invariant a machine can verify, and claiming more would be the\noverclaim D0005 was corrected for.\n\nThree things worth knowing:\n\n* **These commands execute when `bin/stale` runs.** Same trust model as a\n  Makefile in a checked-out repo, and stated in the tool because it changes\n  `bin/stale` from a reader to an executor.\n* **A command that cannot run is reported, never counted as zero.** A fact\n  that cannot be produced is not a fact of zero, and `widgets: exit 127`\n  appears as a note rather than silently making every \"0 widgets\" claim true.\n* **A command whose pipeline silently fails can still yield a plausible\n  number** \u2014 `cat missing | wc -l` is `0`. Nothing guards that and nothing can\n  in general, since zero is often a legitimate count.\n\nOne defect caught in the writing: the docstring promised that a command\ncontaining a pipe works, while the parser split on every `|` and truncated it.\nThe claim was about to be false in the tool that exists to catch false claims.\nSplit once, and there is a check for it.\n", "mtime": "2026-11-11T17:41:29+00:00"}, {"path": "tasks/formalize/T0005-add-bin-selftest-adopt-into-a-throwaway-host.md", "meta": {"id": "T0005", "type": "task", "title": "Add bin/selftest: adopt into a throwaway host and assert the install is clean", "description": "Nothing checks that a fresh install works; twelve defects came from a real adoption and none from the template's own checks.", "status": "Complete", "category": "enhancement", "initiative": "formalize", "blocked_by": [], "timestamp": "2026-11-07", "tags": ["brain", "formalize"]}, "body": "\n# What to build\n\nThe template passes its own linter **by construction** \u2014 the same hand wrote\nboth \u2014 so self-checking proves almost nothing. The first real adoption found\ntwelve defects in a day, two of which a thirty-line script would have caught\nmechanically: a `git clone` install leaving a gitlink instead of 80 tracked\nfiles, and a fresh install producing 17 dangling links.\n\nNamed as a gap in [E0002](../../knowledge-catalog/reference/E0002-portability-findings.md)\n(\"Skills' own tests. Nothing checks that a skill still runs after an edit\")\nand now evidenced in [E0001](../../knowledge-catalog/reference/E0001-brain-in-practice.md).\n\n# Acceptance criteria\n\n- [ ] Creates a throwaway git repo, copies the brain without `.git`, runs `bin/adopt`\n- [ ] Asserts `bin/lint`, `bin/doctor` and `bin/stale` all report zero errors and zero warnings\n- [ ] Asserts `bin/new --next` returns `D0001`, `G0001` and `T0001` \u2014 the adopter's numbering is clean\n- [ ] Asserts the skills are discoverable from the host root, and that no file was written into the host beyond `.claude/skills` and the hook\n- [ ] Runs in CI and fails the build\n\n# Out of scope\n\n- Anything not named in the acceptance criteria above\n\n# Log\n\n## 2026-11-08 \u2014 done, and it found a regression on its first run\n\n`bin/selftest`: 29 checks, two layers.\n\n**Install** \u2014 a throwaway git host, the brain copied without `.git`, `adopt`,\nthen lint/doctor/stale/graph-build clean, numbering free at `G0001`/`D0001`/\n`T0001`, skills discoverable and resolving into the brain, and nothing written\ninto the host beyond `.claude/skills` and the hook.\n\n**Foreign content** \u2014 twelve files deliberately not written for this brain,\neach one something a real project actually did: a decision with no\nfrontmatter, an unquoted colon in a title, an imported draft with none of our\nheadings, a duplicate id, a status in prose, a citation in backticks both live\nand dead, a node citing one written later, and a running record that may.\n\n**It earned its place immediately.** The first run failed: `bin/adopt`\nrelocated `tasks/formalize` to `example/` and left `plans/formalize` behind\npointing at it \u2014 the same bug class as the seventeen dangling links, one layer\nalong, introduced the same day by the plan written to test `bin/handoff`.\n\nAlso in CI, and `bin/doctor` knows the tool exists.\n\nThe caveat is in the script's own docstring: a green run locks in what three\nadoptions taught us and is not evidence the brain is ready for a project it\nhas never met.\n", "mtime": "2026-11-08T16:27:41+00:00"}, {"path": "tasks/formalize/T0006-teach-lint-to-check-backticked-prose-paths-not.md", "meta": {"id": "T0006", "type": "task", "title": "Teach lint to check backticked prose paths, not only markdown links", "description": "A project accumulated 174 path references that no check could see, and a measurement built on the same blind spot reported the opposite of the truth.", "status": "Complete", "category": "enhancement", "initiative": "formalize", "blocked_by": [], "timestamp": "2026-11-07", "tags": ["brain", "formalize"]}, "body": "\n# What to build\n\n`LINK_RE` matches `](\u2026)` and nothing else. A real catalog carried **174\ncross-references across 59 files** as backticked prose \u2014 `` `knowledge/decisions/x.md` ``\n\u2014 every one invisible to the linter and every one silently rotten after a\nrename.\n\nWorse than the rot: a survey built on the same blind spot concluded the\ncatalog had *\"zero cross-links, a flat pile, not a graph\"*, which was the\nopposite of the truth. A check that cannot see a reference also cannot see\nthat references exist.\n\nBe careful of false positives: a backticked string is often not a path.\nRequire a `/` and a known extension before resolving, and warn rather than\nerror.\n\n# Acceptance criteria\n\n- [ ] A backticked path ending in `.md` that does not resolve produces a warning\n- [ ] A backticked string that is not path-shaped produces nothing\n- [ ] Code fences are skipped\n- [ ] Running it over a catalog with known-good prose references produces zero findings\n\n# Out of scope\n\n- Anything not named in the acceptance criteria above\n\n# Log\n\n## 2026-11-08 \u2014 done, narrower than written\n\nShipped as `check_node_refs` in `bin/lint` plus `bin/relink`.\n\nThe task as written said \"check backticked prose paths\". Measured against a\nreal corpus, that rule produced ~300 findings and most were noise: `config.md`\nand `CONTEXT.md` are file *names* in prose, not citations. Requiring the path\nto carry an **id** cut it to 128 findings of which 127 were genuine \u2014 122\nlost edges and 5 rotten citations, the latter a real bug where `bin/adopt`\nhad repointed markdown links but not backticks.\n\n`bin/lint` reports; `bin/relink` converts. Lint stays read-only, because a\ngate that mutates is surprising.\n", "mtime": "2026-11-08T14:57:35+00:00"}, {"path": "tasks/formalize/T0007-model-the-reason-a-task-is-blocked-instead.md", "meta": {"id": "T0007", "type": "task", "title": "Model the reason a task is blocked, instead of discarding it on import", "description": "The seven-value status enum keeps what state a task is in and throws away why, so an import had to invent a field mid-port to avoid losing it.", "status": "Complete", "category": "enhancement", "initiative": "formalize", "blocked_by": [], "timestamp": "2026-11-07", "tags": ["brain", "formalize"]}, "body": "\n# What to build\n\nA real tracker's statuses carried the reason inside the status: *\"Blocked \u2014\nhandles and Page names frozen by Ashlee 2026-11-02 until the new site is\ndone\"*. Mapping that to `Not Ready` keeps the state and discards everything\nthat makes it actionable. `imported_status:` was invented during the port to\navoid the loss, which is a workaround, not a model.\n\nTwo shapes worth weighing. A `status_note:` field is cheap and always\navailable. Representing the blocker as a node is truer but only works when the\nblocker is someone's work \u2014 in the same import, one blocker was a discrete\ntask and the other was a client-imposed freeze tied to an untracked\nmilestone, and inventing a task for the second would have been worse than the\ngap.\n\n# Acceptance criteria\n\n- [ ] A task can record why it is in its current state without that living only in prose\n- [ ] `bin/status` surfaces the reason beside the status\n- [ ] An external blocker that is nobody's task is representable without inventing one\n- [ ] `imported_status` is either promoted to the model or retired\n\n# Out of scope\n\n- Anything not named in the acceptance criteria above\n\n# Log\n\n## 2026-11-08 \u2014 decided, and no field was added\n\n[D0008](../../knowledge-catalog/decisions/D0008-a-blocker-is-a-node.md): a\nblocker is a link to a node, never free text. Another task, or a whole plan\nresolved as \"every task under that initiative is done\", or \u2014 for something\nexternal \u2014 the actionable task hiding inside it.\n\nThe `waiting_on:` field this task was written to specify was **rejected**. It\nhandles every case, which is the problem: *\"Ashlee to decide the card handle\"*\nis unactionable, reaches no frontier, and is assigned to nobody. On the one\ntracker with this shape, two of three external blockers decomposed into a\none-email task, and both appeared on the frontier the same afternoon. The\nfield records paralysis; the task gets it done.\n\n`bin/status` resolves a plan target; a plan with no tasks is **not** done.\n`imported_status:` stays a transitional note that promotion removes.\n", "mtime": "2026-11-08T16:23:11+00:00"}, {"path": "tasks/formalize/T0008-decide-whether-an-open-question-is-a-node.md", "meta": {"id": "T0008", "type": "task", "title": "Decide whether an open question is a node type", "description": "Sixty-nine tracked open questions collapsed into one 1,119-line evidence node because the taxonomy has nowhere else to put them.", "status": "Complete", "category": "enhancement", "initiative": "formalize", "blocked_by": [], "timestamp": "2026-11-07", "tags": ["brain", "formalize"]}, "body": "\n# What to build\n\nAn engagement tracked **69 open questions**, each with an owner, a date and\noften a \u26a0 severity. The brain has no node for *\"an unresolved question\"*:\nit is not a task (no acceptance criteria, often not even our work), not a\ndecision (undecided by definition), and only barely evidence.\n\nThey became a single evidence node of 1,119 lines \u2014 findable by\n`bin/relevant`, but unsortable, unassignable, and invisible to `bin/status`.\n\nThis is a real taxonomy question, not a defect, and the answer may well be\n**no**: an eighth type is a cost, and `wayfinder` already models a question\nwhose resolution is a decision. But the current answer \u2014 *\"put it in a\n1,100-line evidence file\"* \u2014 is not one anybody chose.\n\n# Acceptance criteria\n\n- [ ] A decision is recorded either way, with the alternatives weighed\n- [ ] If yes: the type, its body shape, and how `bin/status` treats it\n- [ ] If no: where 69 owned, dated open questions are supposed to live, stated explicitly\n\n# Out of scope\n\n- Anything not named in the acceptance criteria above\n\n# Log\n\n## 2026-11-08 \u2014 decided: no new type\n\n[D0009](../../knowledge-catalog/decisions/D0009-an-open-question-is-a-task.md):\na question that blocks work is a `task` with `category: question`; one that\nblocks nothing stays evidence.\n\nThe deciding evidence was in the corpus that raised the question. Across its\n69 open questions there were **84 `Owner:` annotations** \u2014 nearly every one\nalready named who had to act, which is the definition of work. `category` is\nan existing enum, so this adds a value rather than a type.\n\nMigration is gradual: a question is promoted when it starts blocking\nsomething. Converting all 69 would have produced dozens of rows for questions\nnobody will action.\n", "mtime": "2026-11-08T16:23:11+00:00"}, {"path": "tasks/formalize/T0009-cold-start-adoption-tests-greenfield-then.md", "meta": {"id": "T0009", "type": "task", "title": "Cold-start adoption tests: greenfield, then the product team", "description": "Have an agent that did not build this brain adopt it, twice: once into an empty project and once into a project with four years of its own conventions.", "status": "Complete", "category": "enhancement", "initiative": "formalize", "blocked_by": [], "timestamp": "2026-11-08", "tags": ["brain", "formalize", "adoption"]}, "body": "\n# What to build\n\nNot a build. Two experiments, run by a Claude session that did **not** write\nthis brain, because the author is the worst available tester \u2014 the template\npasses its own linter by construction, and the same blindness applies to the\nperson driving the port.\n\n[T0005](T0005-add-bin-selftest-adopt-into-a-throwaway-host.md) covers the\nmechanical install. What neither it nor anybody else has tested is the\n**onboarding path a human and a cold agent actually walk**: README \u2192\n`bin/adopt` \u2192 `CLAUDE.md` \u2192 `INIT.md`.\n\n**Scenario A \u2014 greenfield.** A brand-new, empty project. `INIT.md` has\nnothing to import and nothing to mine, so the first goal is its only real\noutput. Unknown whether it degrades gracefully or reads as broken.\n\n**Scenario B \u2014 a project with its own conventions.** Four initiatives, seven\ndecisions, fifty-seven tasks, two node types this brain deliberately does not\nhave (`intent`, `handoff`), two it deleted (`context`,\n`initiative-pointer`), and **no version control at all**, so the\ndate-recovery advice in `INIT.md` is unavailable.\n\nThe deliverable is the friction, not the ported brain. Whatever the cold\nsession finds confusing, missing or wrong goes to\n[E0001](../../knowledge-catalog/reference/E0001-brain-in-practice.md) and\nbecomes tasks from there.\n\n# Acceptance criteria\n\n- [x] Scenario A run by a session with no prior context; its transcript audited\n- [x] Scenario B run the same way\n- [x] Every point of friction recorded in E0001, separated into documentation\n      gaps and real defects\n- [~] Anything that turned out to be a defect has a task \u2014 **not met as\n      written**; see the closing log entry\n\n# Out of scope\n\n- Doing either port myself. That would answer a different question.\n\n# Log\n\n## 2026-11-08 \u2014 Scenario A under way\n\nPredictions recorded before the run, so they can be scored rather than\nreconstructed afterwards:\n\n1. `bin/adopt` refuses on a project not yet `git init`ed, which a brand-new\n   folder usually is not. The message points at `git init` or `--sibling`.\n2. `INIT.md` steps 2-4 \u2014 import ADRs, seed the glossary, mine the\n   transcript history \u2014 all come up empty on a new project. Untested whether\n   that reads as graceful or as broken.\n3. The first goal is the only substantive output. If the session does not push\n   for one, the brain starts with an unterminated lineage and no tool will say\n   so until something is built.\n4. `example/` may be mistaken for the adopter's own content rather than a\n   worked example.\n\n## 2026-11-09 \u2014 closed\n\nBoth scenarios ran, five rounds each. Scenario A was `the solo research brain`, an empty\nnon-git project; Scenario B was `the product team's repository`, which migrated 109\nnodes and then stayed in the loop through five update rounds. Findings live in\n[E0003](../../knowledge-catalog/reference/E0003-adoption-greenfield.md) for A\nand in rounds 1-10 of\n[E0001](../../knowledge-catalog/reference/E0001-brain-in-practice.md) for both.\n\n**The fourth acceptance criterion was not met as written, and the deviation was\ndeliberate.** \"Anything that turned out to be a defect has a task\" would have\nproduced about twenty tasks describing work already done \u2014 the fix usually\nlanded in the same session as the report. What they got instead was a named\ncheck in `bin/selftest`, one per finding, which is the discipline `howto.md`\nnow states as *a fix lands with its check*. 86 checks, from 43 when this task\nopened. A task per defect would have been a worse record: a backlog of closed\nitems instead of a suite that fails if the defect returns.\n\n**The predictions, scored.** They were written down so they could be scored\nrather than reconstructed, so:\n\n1. **Wrong in form, right in area.** `bin/adopt` did not refuse on a non-git\n   project; the friction was that the README's own quickstart omitted\n   `git init` (E0003 finding 7). The guess named the right hazard and the wrong\n   mechanism.\n2. **Right, and it mattered more than expected.** The greenfield branch read as\n   broken rather than graceful \u2014 `INIT.md` now branches on greenfield before\n   step 1, and the greenfield branch mines the live conversation instead\n   (finding 5).\n3. **Right.** The first goal was the substantive output, and nothing pushed for\n   one. `serves:` on Approach nodes and `ancestry --claims` reporting\n   `\u26a0 UNTERMINATED` came out of this.\n4. **Wrong as stated, and the real problem was worse.** `example/` was not\n   mistaken for the adopter's content; it silently reserved ids, so a default\n   install issued `D0010` as its first decision (finding 3). Being *mistaken*\n   for content would have been visible. Reserving ids was not.\n\nThree of four predictions pointed at the right area and two got the mechanism\nwrong, which is roughly the hit rate the task existed to establish: the author\ncan guess where a cold adopter will trip and not how.\n\n**What this task does not close.** Both adoptions ran with the author on the\nother end fixing defects within the hour. **Nobody has adopted this without\nthe author in the loop**, which is the test that would actually establish\nportability, and it is not something this task can run. The tooling is now\nclean enough that the attempt should survive \u2014 `bin/prove` exists so a stranger\ncan catch the author's claims without asking \u2014 but that is a prediction, not a\nmeasurement.\n\nThe adopter's own recommendation was to stop the loop: severity fell about an\norder of magnitude per round, and by round 10 they were producing false\nfindings at roughly the rate of real ones. Closed on that recommendation.\n", "mtime": "2026-11-11T20:13:00+00:00"}, {"path": "tasks/formalize/T0010-decide-whether-the-brain-ships-as-a-claude.md", "meta": {"id": "T0010", "type": "task", "title": "Decide whether the brain ships as a Claude Code plugin", "description": "The skills half is generic and global by nature, which is what a plugin installs; the catalog half is per-project, which a plugin cannot carry. Decide whether to split them.", "status": "Complete", "category": "question", "initiative": "formalize", "blocked_by": [], "timestamp": "2026-11-08", "tags": ["brain", "formalize", "distribution"]}, "body": "\n# What to build\n\nA decision, not a build. Raised by the greenfield cold start, recorded in\n[E0001](../../knowledge-catalog/reference/E0001-brain-in-practice.md).\n\nThe brain already splits cleanly: `bin/` and `skills/` are generic and are\nthe only half upstream ever changes; `knowledge-catalog/`, `tasks/`,\n`plans/` and `brief/` are the project's own. A Claude Code plugin installs\nthe first half natively, at user scope, versioned \u2014 and cannot carry the\nsecond at all.\n\nVerified against a plugin installed on this machine: a repository holding\n`.claude-plugin/plugin.json` and `.claude-plugin/marketplace.json` is its\nown marketplace, installs to `~/.claude/plugins/cache/<marketplace>/<name>/<version>`,\nand records the commit it came from. The comparable plugin ships a setup skill\nwhose job is writing the **per-repo adaptation layer** \u2014 exactly what\n`knowledge-catalog/reference/agent-skills/` is here.\n\n**What it would fix.** The restart would move to a harmless moment, before any\nbrain exists, instead of stranding the adopter between `bin/adopt` and\n`INIT.md`. Updates would stop being \"re-copy two directories\".\n\n**The conflict to resolve.** A plugin and `bin/adopt`'s `.claude/skills`\nsymlink would both supply the same skills. It is one or the other, not both.\nAnd globally-installed skills would be present in projects with no brain,\nwhere every one of them would fail looking for `brain/` \u2014 they would need to\nnotice and say so rather than error.\n\n**The part a plugin cannot take.** `bin/` is called by path from the skills\n(`brain/bin/lint`). Moving it into the plugin means the tools must locate the\nbrain themselves, as the commit hook already does from the git root. That is a\nseparate change and should not be bundled into this decision.\n\n# Acceptance criteria\n\n- [ ] A decision recorded either way, with the alternatives weighed\n- [ ] If yes: which half ships as the plugin, what `bin/adopt` stops doing, and\n      how a skill behaves in a project with no brain\n- [ ] If no: how an adopter is spared the mid-install restart instead\n\n# Out of scope\n\n- Moving `bin/` into the plugin. Separate decision.\n- Publishing to the official marketplace.\n\n# Log\n\n## 2026-11-08 \u2014 raised\n\nDeliberately not decided mid-experiment: changing the install mechanism while\na cold-start test of that mechanism is running would invalidate the test.\n\n## 2026-11-08 \u2014 decided: no plugin, and the blocker fixed another way\n\n[D0010](../../knowledge-catalog/decisions/D0010-init-is-a-document.md).\n\nDeciding it meant measuring the thing it was raised to fix, and the measurement\nchanged the answer. **`brain-init` is the only skill needed in the session that\ninstalls the brain.** Every other skill is used in later sessions, where\ndiscovery works and has never been reported as a problem.\n\nSo a plugin \u2014 manifests, a new adopt skill, fourteen skills needing a \"no brain\nhere\" guard, release discipline \u2014 was being considered to fix a blocker that\naffects one file. That file is now `brain/INIT.md`, a document, which is\nexactly what all three adopters ended up reading after the skill failed to\nload. Reading it contradicts nothing; reading `SKILL.md` contradicted a\nstanding instruction, and one of them had to break it to proceed.\n\nThe plugin stays open as a question about **distribution and updates**, which\nis what it is actually good at. Nobody has yet reported re-copying `bin/` and\n`skills/` as a burden, and that is the evidence it should be decided on.\n", "mtime": "2026-11-08T18:26:36+00:00"}, {"path": "tasks/formalize/T0011-decide-what-the-brain-owes-an-artifact-outside.md", "meta": {"id": "T0011", "type": "task", "title": "Decide what the brain owes an artifact outside the repository", "description": "A finding was captured correctly and still failed to land, because the thing it needed to change lives outside the repo where no brain tool reaches.", "status": "Complete", "category": "question", "initiative": "formalize", "serves": "../../knowledge-catalog/decisions/D0012-capture-is-separate-from-classification-and-capture-wins.md", "blocked_by": [], "timestamp": "2026-11-10", "tags": ["brain", "formalize", "boundaries"]}, "body": "\n# What to build\n\nA decision, not code \u2014 the question first.\n\nAn adopter went looking for a finding they believed had been lost to missing\ncapture. It had been captured: a task log entry, written minutes after the run\nit described. What failed was downstream. The finding needed to change a voice\nprofile at `~/.claude/voice/profile/professional.md`, outside the repository,\nand **no tool here crosses that boundary** \u2014 not `bin/note`, not `bin/new`, not\n`bin/lint`, not `bin/stale`. The record was complete and correct and the thing\nit existed to change went on being wrong for eight hours.\n\nThis is the same shape as the defect class the brain already has an instrument\nfor. `bin/unread` catches a field the record carries that no tool reads.\n`bin/stale` catches a countable claim that no longer matches the files. Neither\ncatches **a claim whose subject is not in the repository at all**, and that\nsubject is where a lot of agent configuration now lives: skills, profiles,\nsettings, prompts under a home directory.\n\nThe question to settle, in order:\n\n1. **Is a cross-boundary target in scope at all?** The honest alternative is\n   that the brain describes one repository and anything outside it is the\n   operator's problem \u2014 defensible, and it should be written down rather than\n   left as an accident of what the tools happen to walk.\n2. **If it is in scope, what is the mechanism?** A node naming an external\n   path in a field a tool reads is the obvious shape, and the obvious hazard\n   is that nothing can verify what it says about a file it cannot diff. A\n   check that cannot fail is worse than no check \u2014 this record has paid for\n   that lesson more than once.\n3. **What does it cost to be wrong?** An external target that has silently\n   drifted is exactly the stale-but-confident note D0001 exists to prevent,\n   and it is less visible than any in-repo version of the same thing.\n\n# Acceptance criteria\n\n- [x] A decision node states whether artifacts outside the repository are in\n      scope, with the reasoning and the rejected alternative \u2014 D0014\n- [x] If in scope, the mechanism names which tool reads the field, and what\n      that tool can and cannot verify about a path it does not own \u2014\n      `resource:`, read by `lint`, `ancestry` and `graph-build`, verifying\n      existence and nothing else\n- [x] If out of scope, `CLAUDE.md` says so where a reader will meet it, so the\n      gap is a stated boundary rather than a thing nobody thought about\n\n# Out of scope\n\n- Building the mechanism before the decision is made. The last three tools\n  added here were right because somebody measured the cost first.\n\n# Log\n\n## 2026-11-10 \u2014 opened\n\nFrom the solo research brain's note round. Their framing, which is the reason this is a\ntask rather than a line in E0001: *\"capture wasn't the failure\"* \u2014 and the\ncross-boundary gap *\"is a better target than the backlog ever would have\nbeen.\"*\n\n## 2026-11-11 \u2014 closed as D0014\n\nThe question turned out to be narrower than it was written, because part of the\nboundary was already crossed and working: `resource:` names an artifact outside\nthe repository, `bin/lint` errors when it does not exist and is silent when it\ndoes, and two adopters use it today. Verified rather than assumed, on a fixture\nwith a real file outside the brain and then a missing one.\n\nSo the question was never whether the record can point outside itself. It was\n**what the record is entitled to claim about what it points at**, and the\nanswer is: that the file is there, and nothing more.\n\nThe tripwire was rejected on maintenance rather than on principle. It is\ngenuinely verifiable and it can fail, which this record rates highly \u2014 but the\nhash is stamped by hand, so a deliberate edit to the external file means\nre-stamping or a warning that fires forever. That is the permanently-red\npattern already paid for twice here. The condition for revisiting it is\nwritten into D0014: a brain where external artifacts are the subject rather\nthan an edge case.\n\nThe honest residue, stated in the decision rather than implied: **this makes\nthe gap legible, it does not close it.** A correctly captured finding whose\ntarget lives outside the repo can still fail to land. What the eight hours\nactually cost was nobody having said the gap existed.\n", "mtime": "2026-11-11T20:12:23+00:00"}, {"path": "tasks/formalize/index.md", "meta": {}, "body": "# formalize\n\nTasks for the **formalize** initiative. `brain/bin/status formalize` shows what is claimable now.\n\n| id | Status | Title |\n|---|---|---|\n| [T0001](T0001-teach-bin-relevant-to-defer-to-bin-constraints.md) | Complete | Teach bin/relevant to defer to bin/constraints once decisions declare what they govern |\n| [T0002](T0002-add-owner-and-mine-to-bin-status-and.md) | Not Ready | Add --owner and --mine to bin/status, and owner inheritance from plan to spec |\n| [T0003](T0003-group-the-graph-legend-by-category-and-show.md) | Complete | Group the graph legend by category and show ids in node labels |\n| [T0004](T0004-give-bin-stale-a-per-project-facts-file.md) | Complete | Give bin/stale a per-project facts file so a host project can add a count without editing Python |\n| [T0005](T0005-add-bin-selftest-adopt-into-a-throwaway-host.md) | Complete | Add bin/selftest: adopt into a throwaway host and assert the install is clean |\n| [T0006](T0006-teach-lint-to-check-backticked-prose-paths-not.md) | Complete | Teach lint to check backticked prose paths, not only markdown links |\n| [T0007](T0007-model-the-reason-a-task-is-blocked-instead.md) | Complete | Model the reason a task is blocked, instead of discarding it on import |\n| [T0008](T0008-decide-whether-an-open-question-is-a-node.md) | Complete | Decide whether an open question is a node type |\n| [T0009](T0009-cold-start-adoption-tests-greenfield-then.md) | Complete | Cold-start adoption tests: greenfield, then the product team |\n| [T0010](T0010-decide-whether-the-brain-ships-as-a-claude.md) | Complete | Decide whether the brain ships as a Claude Code plugin |\n| [T0011](T0011-decide-what-the-brain-owes-an-artifact-outside.md) | Complete | Decide what the brain owes an artifact outside the repository |\n", "mtime": "2026-11-11T20:13:00+00:00"}, {"path": "tasks/misc/index.md", "meta": {}, "body": "# misc\n\nTasks for the **misc** initiative. `brain/bin/status misc` shows what is claimable now.\n\n*(none yet \u2014 `brain/bin/new task \"<title>\" --initiative misc`)*\n", "mtime": "2026-11-08T17:18:44+00:00"}, {"path": "work/README.md", "meta": {}, "body": "# work\n\nAppend-only journals, one file per worker per initiative: `<initiative>/<worker>.md`.\n\nA journal is the record of what a worker actually did while a claim was held \u2014 what was tried,\nwhat failed, what the next session needs to know. Never edit another worker's journal. Progress\nviews come from `brain/bin/status`, not from a shared file.\n\nA claim with no journal entry in the last hour is treated as stale and may be reclaimed.\n", "mtime": "2026-10-31T01:45:38+00:00"}], "links": [{"source": "CLAUDE.md", "target": "knowledge-catalog/decisions/D0001-claims-must-be-checkable.md"}, {"source": "CLAUDE.md", "target": "knowledge-catalog/howto.md"}, {"source": "CLAUDE.md", "target": "knowledge-catalog/reference/agent-skills/index.md"}, {"source": "INIT.md", "target": "knowledge-catalog/decisions/D0001-claims-must-be-checkable.md"}, {"source": "INIT.md", "target": "knowledge-catalog/decisions/D0004-placement-and-install.md"}, {"source": "INIT.md", "target": "knowledge-catalog/decisions/D0010-init-is-a-document.md"}, {"source": "INIT.md", "target": "knowledge-catalog/reference/E0001-brain-in-practice.md"}, {"source": "README.md", "target": "knowledge-catalog/decisions/D0004-placement-and-install.md"}, {"source": "config.md", "target": "knowl
