and doing both install and fill** \u2014 rejected: the mechanical half\n  must be rerunnable and trustworthy without a model in the loop, and the\n  judgement half must be rerunnable per repository.\n- **Deleting the example on adopt** \u2014 rejected: see above.\n- **`cp -R` distribution** \u2014 rejected: forks the user's copy permanently.\n\n# Consequences\n\n- `bin/stale` reads `config.md` instead of assuming `../..`, which fixes the\n  coincidence.\n- `bin/doctor` checks the install \u2014 symlink, placeholders, config, graph\n  freshness \u2014 and `bin/lint` calls it, since lint is the gate.\n- The host repository's own `CLAUDE.md` gets one pointer line, and `bin/adopt`\n  **offers** rather than adds it: those files belong to the team.\n- **CI is opt-in for the same reason.** `.github/workflows/` is the team's\n  directory, and a brain that installs a workflow into someone's repository\n  uninvited has made a change nobody asked for in the most visible place\n  available. `bin/adopt` describes what the workflow checks and writes it only\n  on `--with-ci` or an explicit yes. The recommendation is strong \u2014 `bin/lint`\n  and `bin/stale` are what keep the record's claims checkable between reviews,\n  and CI is the only place they run without being remembered \u2014 but a strong\n  recommendation is still a recommendation.\n- Windows still needs a copy-on-install fallback for the symlink. Not solved\n  here.\n\n# Amendment \u2014 2026-11-07\n\n*The decision stands. It did not say where the skills link goes in sibling\nmode, and `bin/adopt` got it wrong in a way that made the mode non-functional.*\n\n**Sibling means a workspace, not a bare pair of folders.** The brain and the\nproject repositories sit side by side inside a plain directory, and Claude Code\nis run **from that workspace**:\n\n```\nworkspace/\n\u251c\u2500\u2500 .claude/skills -> ../brain/skills\n\u251c\u2500\u2500 brain/                  # its own git repository\n\u2514\u2500\u2500 acme-api/               # the project. Never written to.\n```\n\n`bin/adopt` installed `.claude/skills` **inside the brain** in sibling mode.\nThat had the virtue of not touching the project, but it broke two things at\nonce:\n\n1. **No skill was ever discovered.** Claude Code looks in the working\n   directory's `.claude/skills` and in `~/.claude/skills`. It does not look in\n   `brain/.claude/skills`, so every skill was invisible from anywhere work\n   actually happens.\n2. **`brain/...` did not resolve.** Every skill and every document in this\n   repository refers to `brain/knowledge-catalog/\u2026`. That prefix is only\n   correct from a directory that *contains* the brain.\n\nBoth are fixed by the same move: `.claude/skills` goes in the **brain's\nparent** in both modes. What the mode changes is what that parent is \u2014 the\nhost repository when embedded, a workspace folder when sibling.\n\n**The project repositories are never touched in sibling mode.** Not\n`.claude/`, not `.github/`, not `.git/hooks`. They are recorded in\n`config.md`'s `repos:` and read. This is the whole reason the mode exists: the\nproject may be shared with a company or owned by someone else, and a brain\nthat leaves brain-specific files in it has made that someone else's problem.\n\nConsequently, in sibling mode the brain's own git repository carries the hook\nand the CI workflow \u2014 which is where they already are, so `--with-ci` has\nnothing to do but tell you to enable Actions.\n\nThe cost is explicit and worth stating: **you must start Claude Code in the\nworkspace, not in the project folder.** `bin/adopt` prints this, and it is the\nprice of keeping a shared repository clean.\n\n# Amendment \u2014 2026-11-11\n\n**One entry point, still two steps.** The operator now types one thing:\n\n> read https://raw.githubusercontent.com/hootener/brain/main/INIT.md and follow it\n\n`INIT.md` gained a Step 0 that detects whether `config.md` exists, asks the\noperator where the brain should live, fetches the files and runs `bin/adopt`\nfor them.\n\n**What this does not change is the half of this decision worth keeping.**\n`adopt` is still mechanical with no model in it, `INIT.md` still needs\njudgement, and they still rerun on different schedules \u2014 `adopt` once per\nbrain, `INIT.md` once per repository it describes. The sentence above that\nreads *\"They do not call each other\"* is now false in one direction and stays\ntrue in the other: `INIT.md` runs `adopt`, `adopt` never runs `INIT.md`.\nCollapsing them into a single tool was rejected for the reason the original\ndecision gives, which has not stopped being true.\n\nWhat was wrong was never the two steps. It was that **the operator had to know\nabout both**, from a README that spent two screens on `cp -R` versus `git\nclone` and on which one puts a `.git` in the wrong place. That is a mechanical\nproblem, and the thing reading the instruction is a machine. It can perform\nthe copy; it could never guess the placement, which is why Step 0 asks and\ndoes not infer.\n\n**Placement is still recorded, never inferred.** Step 0 asks before it copies\nanything, because `config.md` carries the mode and moving the files afterwards\ndoes not move the record of what they are.\n", "mtime": "2026-11-11T20:59:49+00:00"}, {"path": "knowledge-catalog/decisions/D0005-intent-layer-wiring.md", "meta": {"id": "D0005", "type": "decision", "title": "Approach nodes name the goal they serve, and decisions carry a machine-readable claim", "description": "serves on plan and spec is the typed edge that makes the Intent layer reachable; invariant and constrains let a decision be found by the change it governs rather than by term matching.", "timestamp": "2026-11-07", "tags": ["brain", "intent", "graph", "lint"], "status": "active", "serves": "../goals/G0001-a-brain-others-can-adopt.md", "invariant": "Every Approach node names at least one goal, so every lineage branch terminates in Intent.", "constrains": ["bin/ancestry", "bin/constraints", "bin/lint", "skills/to-spec", "skills/grill-change"]}, "body": "\n# Context\n\n**The Intent layer was unreachable from the Action layer.** Measured on a\nfive-task fixture in this repository: `bin/ancestry` reaches a decision only\nthrough a prose body link, and no skill writes one. Deleting two body links\nfrom a spec dropped the closure to six documents with **zero decisions and\nzero goals \u2014 and no warning**. `/spec-review` and `/code-review`, the two\nskills whose stated purpose is \"does this still serve the why\", were reading a\nchain that stopped one link short of the why.\n\nSeparately, `bin/relevant` prints **every decision on every call** because its\nown docstring admits term matching misses the one that matters. At seventeen\ndecisions that is four lines; at eighty it is noise, and noise is not read.\n\n# Decision\n\n**`serves:` on `plan` and `spec` only \u2014 never on `task`.** A task's intent\narrives through its spec. This puts the field where someone is already\nthinking about *why* (writing a spec) rather than where they are thinking\nabout *what* (writing a ticket), and it means `/to-tasks` needs no new field:\nthe chain is task \u2192 spec \u2192 goal.\n\nThe walk could reach a goal by following prose, and does today. Three reasons\nto make it a typed edge anyway: a field is enumerable and prose is not; a\ntyped edge is precise where a body link merely means \"mentioned\"; and where a\ntask is served by several goals and decisions, `serves:` is how the author\nsays which is **primary** \u2014 a distinction `bin/ancestry`'s `via` field is\nalready reaching for and cannot express.\n\n**Decisions carry a machine-*surfaceable* claim**: `invariant:`, one sentence a\nchange could violate, and `constrains:`, the paths or concepts it governs.\n`bin/constraints <changed paths>` then lists the decisions in force for *this*\nchange, and the print-them-all fallback retires on its own.\n\n**A contradiction needs a recorded exit.** `/grill-change` already sorts hits\ninto Contradictions, Reinforcements and Unexamined, but a contradiction could\nbe noted and then forgotten. There are now two exits and no third: amend the\ndecision, or proceed against it with the id recorded in the task's `# Log`.\n`bin/lint` errors on a task that touches a constrained path and cites no\ndecision. That is the teeth; everything before it is etiquette.\n\n**Lineage completeness is checkable.** Every branch of a reverse walk must\nterminate at a `goal` or a `principle`. A branch that dies at a spec is\n**unterminated**, and that is a finding about the record reported above any\ncode finding, because it means work shipped with no recorded intent.\n\n# Alternatives\n\n- **Rely on body links** \u2014 rejected: measured to fail silently, which is the\n  worst failure shape.\n- **`serves:` on tasks too** \u2014 rejected: duplicates what the spec already\n  says, at the layer with the most files and the least thought about why.\n- **Synonym lists or embeddings in `bin/relevant`** \u2014 rejected: moves the\n  term-matching gap rather than closing it. A decision that declares what it\n  governs does not need to be guessed at.\n- **Contradiction as advice only** \u2014 rejected: the record already contained\n  decisions that had been contradicted and never amended.\n\n# Consequences\n\n- `bin/ancestry` follows `serves:` as a lineage edge and reports unterminated\n  branches as a count.\n- `bin/lint` warns on an Approach node with no `serves:`.\n- `/to-spec` must resolve or create a goal before writing a spec, which is the\n  first point at which the absence of one becomes visible.\n- `/grill-change` gains a required exit for every contradiction it raises.\n- `bin/relevant` keeps the full decision index only until `bin/constraints`\n  covers the same ground.\n\n## 2026-11-10 \u2014 amended: surfaceable, not checkable\n\n\"Machine-readable\" was an overclaim and it cost a fourth adopter a false\ndecision on their first day. They wrote an `invariant:` asserting every resume\nPDF is at most two pages. One was three pages. **`bin/lint` passed and\n`bin/stale` reported \"Nothing contradicts the repository\"** \u2014 because nothing\nvalidates an `invariant:` against the artifact it governs, and nothing can in\ngeneral: it is a sentence about the world, not a fact about the tree.\n\nThey caught it by *reading* `bin/constraints` output, which is the only\ninstrument there is.\n\nSo the word is **surfaceable**. `invariant:` means a tool can put the claim in\nfront of you when you touch the paths it governs; it does not mean anybody has\nchecked it. Calling it machine-readable invites exactly the belief that it has\nbeen \u2014 the stale-but-confident note D0001 exists to prevent, written into the\nfield that was supposed to prevent it.\n\nThe one case that could be mechanised is a *countable* invariant measured\nagainst a per-project fact, which is what\n[T0004](../../tasks/formalize/T0004-give-bin-stale-a-per-project-facts-file.md)\nproposes. That task was speculative when written and now has a cost attached.\n", "mtime": "2026-11-11T02:42:21+00:00"}, {"path": "knowledge-catalog/decisions/D0006-review-split.md", "meta": {"id": "D0006", "type": "decision", "title": "Code review judges the artifact, spec review judges the intent", "description": "code-review keeps correctness, security, performance and standards and becomes brain-free; spec-review owns the whole reverse walk including the spec axis, and the duplicated Intent axis is deleted.", "timestamp": "2026-11-07", "tags": ["brain", "review", "skills"], "status": "active", "serves": "../goals/G0001-a-brain-others-can-adopt.md", "constrains": ["skills/code-review", "skills/spec-review", "bin/ancestry"]}, "body": "\n# Context\n\n`skills/code-review` was adapted from an upstream skill with **two** axes,\nStandards and Spec. An Intent axis was grafted on as a third and the graft\nnever finished: the description says three, the step-4 heading still says\n\"Spawn both sub-agents\", and the Intent axis calls `brain/bin/ancestors` \u2014\na command that does not exist \u2014 while claiming to follow `intent` and\n`handoff` edges, which are not types. It has never been able to run.\n\nSo the reverse walk had two implementations and the one inside `code-review`\nwas the broken one.\n\n# Decision\n\nTwo skills, disjoint inputs, run at different moments.\n\n**`/code-review` judges the artifact.** Correctness, security, performance,\nFowler smells, documented repo standards. It reads the diff and the standards\nfiles, and touches the brain for exactly one thing: the glossary, so names\nmatch the domain vocabulary. Otherwise brain-free \u2014 which makes it portable to\na project with no brain, and replaceable by a team that already has its own.\n\n**`/spec-review` judges the intent**, and owns the reverse walk entirely,\n**including the spec axis**. \"Did the diff implement the spec\" and \"does it\nstill serve the intent\" are the same question at two altitudes and they share\none walk; splitting them would have two skills reading the spec.\n\nThe Intent axis is deleted from `/code-review` rather than fixed.\n\nPreserved from the old design: parallel sub-agents so axes do not pollute each\nother's context, and **no reranking across axes** \u2014 the reasoning that a\nStandards pass can mask a Spec fail still holds among code-review's own axes.\n\nThe orphaned \"initiative-level intent review before a handoff\" moves to\n`/spec-review` as the forward walk at initiative scope.\n\n# Alternatives\n\n- **Fix the Intent axis in place** \u2014 rejected: it would be a second\n  implementation of `/spec-review`'s walk, kept in sync by hope, under a\n  400-word cap on what `/spec-review` calls the deliverable.\n- **Spec axis stays in `/code-review`** \u2014 rejected: both skills would then\n  read the spec, and the spec axis is the shallow end of the same walk.\n- **One review skill with four axes** \u2014 rejected: the two halves want\n  different triggers. Code review runs while coding; spec review runs once,\n  before `Complete`.\n\n# Consequences\n\n- `/code-review` loses its dependency on `bin/ancestry` and on the brain's\n  structure, and can be dropped into a repository without one.\n- `/spec-review` becomes the gate on `Testing \u2192 Complete` (see\n  [D0007](D0007-status-ownership.md)).\n- `bin/ancestors` is not created; the name in the old skill was always a typo\n  for `bin/ancestry`.\n", "mtime": "2026-11-07T16:29:22+00:00"}, {"path": "knowledge-catalog/decisions/D0007-status-ownership.md", "meta": {"id": "D0007", "type": "decision", "title": "Every status transition has one named owner, and the brain is kept current in three layers", "description": "A hook reconciles what is mechanically checkable, skills move status as a side effect of the work, and /audit handles only genuine ambiguity \u2014 stating what it checked before it asks.", "timestamp": "2026-11-07", "tags": ["brain", "status", "agents", "audit"], "status": "active", "serves": "../goals/G0001-a-brain-others-can-adopt.md", "invariant": "A status transition with no named owner does not happen, and no tool changes an inferred status without an answer.", "constrains": ["bin/reconcile", "bin/status", "bin/lint", "skills/implement", "skills/spec-review", "skills/audit"]}, "body": "\n# Context\n\nMost work now arrives agentically, and the brain hears about it only when the\noperator remembers to say so. Two kinds of drift are unowned:\n\n- **Status.** `Testing \u2192 Complete` had **no owner anywhere in the system**,\n  which is exactly why closing out an initiative was a thing the operator had\n  to ask for.\n- **Orphan work.** An agent told \"fix the retry bug\" fixes it, and no node\n  records that it happened. Status drift makes the brain *wrong*; orphan work\n  makes it *incomplete*, which is harder to notice because the graph still\n  looks healthy.\n\n# Decision\n\n**Three layers, in descending reliability.**\n\n**1. A hook, which cannot be forgotten.** Mechanical reconciliation only, no\nmodel: a commit naming `T0005` means that task is not `Not Ready`; a claim\nwith no journal entry in an hour is stale; a merged branch whose task is\n`Testing` is a candidate for `Complete`; a commit touching a `constrains:`\npath while citing no decision is flagged. It **never guesses semantics** \u2014\nanything ambiguous is queued for layer 3, and that restraint is the entire\nreason its output can be trusted unread. It does not mutate the index: it runs\n`post-commit` and on Claude Code's `Stop`, where editing is safe and an agent\nreceives the output as feedback. A git hook is the floor, so humans and\nnon-Claude agents are covered; the `Stop` hook is the accelerator.\n\n**2. Skills move status as a side effect of the work.** Each transition is\nowned:\n\n| Transition | Owner |\n|---|---|\n| `Not Ready \u2192 Ready for Development` | `/triage` |\n| `Ready for Development \u2192 In Progress` | `/implement` |\n| `In Progress \u2192 Testing` | `/implement` |\n| `Testing \u2192 Complete` | `/spec-review` |\n| `Complete \u2192 Delivered` | the hook |\n| any `\u2192 Superseded` | `/grill-change` or `/audit` |\n\nPutting `Testing \u2192 Complete` on `/spec-review` is the keystone: it gives the\nreview a trigger it lacked and means a task cannot reach `Complete` without\nthe reverse walk having run.\n\n**3. `/audit`, on demand, for ambiguity only.** It walks a plan's subgraph\nforward and sorts every node into reconciled (silent), determinable (batched\ninto one confirmation) and undeterminable. On the last, **the question must\ncarry what was checked**: *\"two of three criteria are verifiably met; the\nthird, failures surface in the operator log, I cannot verify \u2014 no test and no\nlog call\"* is answerable in seconds, where *\"I cannot tell if T0005 is\ncomplete\"* merely hands the work back. Same discipline as `/grill-change`\nciting a path.\n\n**An audit never silently changes a status it inferred.** Nothing moves\nwithout an answer; unanswered questions are written to an Evidence node and\nstay visibly open.\n\n`/audit` also walks from the commits, to catch orphan work.\n\n**`bin/reconcile` supplies the facts and `/audit` the judgement**, the same\nsplit as `bin/relevant` and `/grill-change`.\n\n**Cadence is by boundary, not by timer.** The hook and the skills cost the\noperator nothing and run always. `/audit` runs when a plan's last task reaches\n`Testing`, before a handoff, or on request; `bin/doctor` may warn that one is\noverdue without running it.\n\n**Retros are offered, never required.** A solo operator holds the context and\na retro is pure overhead; a team usually wants one. So the `Testing \u2192\nComplete` gate requires that **a review happened** \u2014 a `# Log` entry \u2014 with\nthe Evidence node as the optional richer form carrying `amends:`.\n\n# Alternatives\n\n- **An audit that runs on a timer** \u2014 rejected: constant questions train the\n  operator to rubber-stamp, and a rubber-stamped brain is worse than a stale\n  one because it looks maintained.\n- **A hook that edits files during a commit** \u2014 rejected: mutating the index\n  mid-commit is hostile.\n- **A hook that infers semantics** \u2014 rejected: its value is that its output\n  needs no review, and one wrong guess ends that.\n- **Mandatory retro per task** \u2014 rejected: thirty Evidence nodes per\n  initiative, most saying \"no drift\".\n- **Asking the operator to close things out** \u2014 the status quo; it is the\n  problem.\n\n# Consequences\n\n- `/audit` must be able to report \"the brain is fine\", and that must be the\n  common outcome. An audit that always finds something means layers 1 and 2\n  are broken, which is itself the signal.\n- An audit's output is an Evidence node (`reviewed:`, `amends:`), so \"when was\n  this last audited\" is answerable and feeds the overdue warning.\n- `/implement` gains an enforced journal and the `Testing` handoff; it loses\n  responsibility for `Complete`.\n- `bin/status` grows `--owner` and `--mine`, which is also the team story.\n", "mtime": "2026-11-07T16:29:53+00:00"}, {"path": "knowledge-catalog/decisions/D0008-a-blocker-is-a-node.md", "meta": {"id": "D0008", "type": "decision", "title": "A blocker is a node, not a sentence", "description": "What blocks a task is another task or a whole plan, named as a link; an external blocker is decomposed into the actionable task hiding inside it rather than recorded as prose.", "timestamp": "2026-11-08", "tags": ["brain", "tasks", "blocking"], "status": "active", "serves": "../goals/G0001-a-brain-others-can-adopt.md", "invariant": "A task's blocker is a link to a node, never free text.", "constrains": ["bin/status", "bin/lint", "skills/triage", "skills/implement", "tasks/"]}, "body": "\n# Context\n\nTwo real trackers wrote the reason into the status itself:\n\n> `status: Blocked \u2014 handles and Page names frozen by Ashlee 2026-11-02 until\n> the new site is done; card handle decision hers`\n\nMapping that to `Not Ready` keeps the state and discards everything that makes\nit actionable, so an `imported_status:` field was invented mid-port to avoid\nlosing it. That is a workaround, not a model.\n\n# Decision\n\n**A blocker is a link to a node.** Three cases and no fourth:\n\n1. **Another task** \u2014 `blocked_by: [./T0007-\u2026.md]`, as today.\n2. **A whole initiative** \u2014 `blocked_by: [../../plans/P0003-\u2026.md]`. A plan\n   target is resolved as *every task under that plan's initiative is done*. A\n   plan with no tasks is **not** done: nothing started is not the same as\n   nothing left.\n3. **Something external** \u2014 find the actionable task inside it and block on\n   that. There is almost always one, and it is usually an email.\n\n**A reason that is neither is not a blocker.** A date you are waiting for is a\nconstraint; a fact you noticed is a note. Neither belongs in `blocked_by` and\nneither should be dressed as one.\n\n# Alternatives\n\n- **A `waiting_on:` free-text field** \u2014 rejected, and this was the close call.\n  It handles every case, which is exactly the problem: *\"Ashlee to decide the\n  card handle\"* is unactionable, never reaches the frontier, and is assigned to\n  nobody. **The field lets you record paralysis; the task makes it work.**\n  Measured on the one tracker that had this shape, two of three external\n  blockers decomposed into a one-email task, and naming them changed the\n  outcome \u2014 both appeared on the frontier the same afternoon.\n- **`blocked_by` accepting arbitrary strings** \u2014 rejected: it breaks the\n  frontier computation, which resolves every target and treats an unresolved\n  one as open.\n- **A new `blocker` node type** \u2014 rejected: a thing somebody must do is a task.\n  It needs no second name.\n\n# Consequences\n\n- `bin/status` resolves a plan target by looking at its initiative's tasks.\n- `/triage` and `/implement` push for the actionable task when a status carries\n  a reason in prose.\n- `imported_status:` remains a transitional field `INIT.md` writes and\n  promotion removes. It is a note, never a model.\n- A task blocked on something genuinely outside anyone's control keeps an empty\n  `blocked_by` and says so in its `# Log`. That is honest and rare.\n", "mtime": "2026-11-08T18:25:27+00:00"}, {"path": "knowledge-catalog/decisions/D0009-an-open-question-is-a-task.md", "meta": {"id": "D0009", "type": "decision", "title": "An open question that blocks work is a task; one that blocks nothing is a note", "description": "No node type for an unresolved question: it carries an owner and an action, which makes it a task with category question, and the rest stay evidence.", "timestamp": "2026-11-08", "tags": ["brain", "taxonomy", "tasks"], "status": "active", "serves": "../goals/G0001-a-brain-others-can-adopt.md", "invariant": "An unresolved question is represented as a task or as evidence, never as a type of its own.", "constrains": ["bin/lint", "knowledge-catalog/", "tasks/", "skills/triage"]}, "body": "\n# Context\n\nOne engagement tracked **69 open questions** in a single 1,119-line document.\nThey were findable by search and nothing else: unsortable, unassignable, and\ninvisible to `bin/status`. The brain had nowhere else to put them, so the\nanswer it gave was *\"a very long file\"* \u2014 an answer nobody chose.\n\n# Decision\n\n**No new type.** An open question is one of two things already modelled:\n\n- **It blocks work** \u2192 a `task` with `category: question`. `category` is an\n  existing enum (`bug`, `enhancement`); this adds a value, not a type.\n- **It blocks nothing** \u2192 it stays `evidence`, found by `bin/relevant`.\n\nThe deciding evidence is that the questions already were tasks. Across those\n69 items there were **84 `Owner:` annotations** \u2014 nearly every one already\nnamed who had to act, which is the definition of work.\n\nMigration is **gradual and on demand**: a question is promoted when it starts\nblocking something, and the bulk stays in the evidence node. A one-time\nconversion would produce dozens of rows for questions nobody will ever action.\n\n# Alternatives\n\n- **An `open-question` type** \u2014 rejected under the rule that a type must fail\n  to be expressible on an existing one. This is expressible: a question with an\n  owner and an action is a task; a question with neither is a note.\n- **Convert all 69 at once** \u2014 rejected: a day of work, most of it on items\n  that will never be actioned, and a task table nobody can read.\n- **Leave them as one evidence node** \u2014 rejected as the status quo. It is why\n  a blocker sitting under two deadlines went unnoticed on both the client's\n  tracker and the agent's.\n\n# Consequences\n\n- `category: question` joins `bug` and `enhancement`.\n- Such a task is `Not Ready` until it is actionable, so it never crowds the\n  frontier. `bin/status <initiative>` keeps the table readable.\n- A question promoted to a task is the thing a later task names in\n  `blocked_by`, which is how [D0008](D0008-a-blocker-is-a-node.md) resolves an\n  external blocker.\n", "mtime": "2026-11-08T16:21:19+00:00"}, {"path": "knowledge-catalog/decisions/D0010-init-is-a-document.md", "meta": {"id": "D0010", "type": "decision", "title": "The one thing you run before the skills load is a document, not a skill", "description": "brain-init becomes brain/INIT.md: it is the only skill needed in the session that installs the brain, and in three adoptions it never once loaded in time.", "timestamp": "2026-11-08", "tags": ["brain", "install", "skills", "distribution"], "status": "active", "serves": "../goals/G0001-a-brain-others-can-adopt.md", "invariant": "Nothing the installing session must run is delivered as a skill.", "constrains": ["bin/adopt", "INIT.md", "skills/", "README.md"]}, "body": "\n# Context\n\nClaude Code discovers skills when a session **starts**. `bin/adopt` creates\n`.claude/skills` mid-session and then tells you to run `INIT.md`.\n\nThree cold adoptions, three failures, at a rate of three in three:\n\n| Round | What happened |\n|---|---|\n| 1 | `Unknown skill: brain-init`. Self-healed several tool calls later, which the adopter noted was *worse* \u2014 an agent that retries after doing something else succeeds and never learns the rule. |\n| 2 | Unknown for the **whole session**, while the skill list refreshed mid-run and advertised it. The adopter ran it by `cat`-ing `SKILL.md`, in direct contradiction of *\"never use the Read tool on skill files\"*. |\n| 3 | Same again. *\"`INIT.md` itself is still untested after three rounds (unreachable from the installing session).\"* |\n\nThe instruction `adopt` prints is **restart Claude Code**, and the second\nadopter named why that is no instruction at all: *\"Since the operator is the\nClaude Code session, 'restart Claude Code' has no exit.\"* An agent cannot\nrestart itself. We told it to do something it cannot do, three times.\n\nThis ticket was raised proposing a Claude Code plugin, because a plugin\ninstalls skills at user scope and would move the restart to a harmless moment\nbefore any brain exists.\n\n# Decision\n\n**`INIT.md` stops being a skill and becomes `brain/INIT.md`.** `bin/adopt`\nends by naming that file, and the installing session reads it and follows it \u2014\nwhich is exactly what all three adopters did, successfully, after the skill\nfailed to load.\n\n**No plugin, for now.** The blocker it was raised to fix affects exactly one\nskill, and that skill is the only one in the set that must run *in the session\nthat installs the brain*. Every other skill is used in later sessions, where\ndiscovery works and has never been reported as a problem.\n\nReading `INIT.md` contradicts nothing: it is a document. Reading\n`skillsINIT.md/SKILL.md` contradicted a standing instruction, and an\nadopter had to break that instruction to proceed.\n\n# Alternatives\n\n- **Ship the skills as a Claude Code plugin** \u2014 rejected *for this problem*,\n  not on its merits. Verified feasible: a repository carrying\n  `.claude-plugin/plugin.json` and `marketplace.json` is its own marketplace.\n  Its real advantage is that installation becomes a **human** action \u2014 two\n  slash commands \u2014 so the human restarts naturally where an agent cannot. But\n  it is a large change (manifests, a new adopt skill, fourteen skills needing\n  a \"no brain here\" guard, release discipline) aimed at a blocker that one\n  file rename removes. Distribution and updates are a separate question, and\n  nobody has yet hit those as a problem.\n- **Keep telling people to restart** \u2014 rejected: it is the status quo and it\n  failed three times out of three. An instruction the reader cannot carry out\n  is not an instruction.\n- **Make every skill a document** \u2014 rejected: the other thirteen load fine,\n  and being invokable is most of their value.\n- **Have `adopt` refuse to run inside Claude Code** \u2014 rejected: that is where\n  people adopt from, and the one place we know they are.\n\n# Consequences\n\n- The skill count drops to thirteen.\n- `INIT.md` is no longer invokable. It was only ever run once per\n  repository, so the loss is near-total in name and near-zero in practice.\n- `bin/adopt`'s restart warning goes, because nothing it recommends now needs\n  one.\n- The plugin question stays open and is now **only** about distribution and\n  updates. If it is ever taken, it should be decided on those merits with\n  evidence that re-copying `bin/` and `skills/` has actually become a burden.\n- `bin/doctor`'s note about a freshly-made skills link stays. The other\n  thirteen skills still will not load in the installing session; they are\n  simply not needed there.\n", "mtime": "2026-11-08T18:25:27+00:00"}, {"path": "knowledge-catalog/decisions/D0011-a-change-that-reads-the-adopter-s-corpus.md", "meta": {"id": "D0011", "type": "decision", "title": "A change that reads the adopter's corpus needs a corpus that is not yours", "description": "Every semantic defect in four adoptions came from an inference about the shape of someone else's brain. The template satisfies all of them by construction.", "timestamp": "2026-11-09", "tags": ["portability", "testing", "adoption"], "status": "active", "invariant": "A change that decides what something in the adopter's brain means is tested against a brain that is not this one.", "constrains": ["bin/*", "knowledge-catalog/reference/agent-skills/**"]}, "body": "\n# Context\n\nFour cold adoptions produced twelve defects. Every semantic one \u2014 as opposed to\na reporting one \u2014 came from a single cause: **an inference about the shape of\nthe adopter's corpus.**\n\n| the inference | the reality in one real brain |\n|---|---|\n| the initiative plan is called `plan.md` | `P0005-plan.md` |\n| \u2026has the lowest id | `P0001` is a phase plan |\n| \u2026is the only one carrying `serves:` | all 19 have it, because `bin/lint` asks |\n| \u2026is the most cited | a sub-feature is, by two, because tasks cite what they implement |\n| `example/` is present | never installed |\n| `config.md` says `mode: template` | `sibling` |\n| a `D0004` citation means the template's | means theirs |\n\nSeven inferences, seven wrong. **None is visible from here, because the\ntemplate satisfies all seven by construction** \u2014 and no amount of care writing\nthem helps, because the thing being assumed is the thing you cannot see. Three\nof these shipped with a green gate and a commit message calling them verified.\n\nThe author is the worst available tester of portability, and not through\ninattention: a test written against this brain cannot fail for the reason that\nmatters.\n\n# Decision\n\n**A change that reads something in the adopter's brain and decides what it\nmeans is not finished until it has run against a corpus that is not this one.**\nA change that reads nothing does not need that.\n\nThe question is answerable while writing the commit: *does this change read\nsomething about the adopter's brain and decide what it means?*\n\nTwo ways to satisfy it, in order of preference:\n\n1. **A synthetic corpus in `bin/selftest`.** `synthetic_brain()` builds a brain\n   holding the template's tooling and none of its content; fixtures write the\n   few nodes they mean to measure. A check reads this script's own syntax tree\n   and fails if any fixture copies from `ROOT`, because the host-dependence\n   mistake recurred four times \u2014 twice while fixing a previous instance.\n2. **A cold adoption by someone who did not write the change.** Required when\n   the inference is structural enough that a synthetic corpus would be built to\n   satisfy it, which is the same failure one level up.\n\n**Prefer replacing an inference with an explicit marker.** The reason is\nsharper than \"markers are better\": the two fail in different ways. **An\ninference fails as a confident wrong answer; a marker fails as absence, and\nabsence is reportable.** The plan picker was wrong three times by inference,\nsilently each time, and now says it is guessing when the marker is missing.\n\nIt does not *discharge* this decision, and saying so earlier overclaimed. the product team\nmeasured it in their own brain: one of four initiatives is marked, two\nmulti-plan initiatives still fall through to inference, and for one the\ninference happens to be right by luck. **A marker only helps where someone has\nset it**, so the inference stays on the path until they do \u2014 which means the\nfallback's honesty about guessing is doing the real work, not the marker.\n\n# Alternatives\n\n**Test every change against a foreign corpus.** Rejected as the cost without\nthe benefit: the re-exec fix, the skip reasons and the dates block read nothing\nabout anybody's corpus, and a rule that fires on every change is one that gets\nskipped on the change that needed it.\n\n**Trust the gates.** Rejected on evidence. `bin/lint` and `bin/doctor` were\nclean and sound through all twelve defects, including a release where\n`--dry-run` wrote 43 files. They check the shape of the record, not whether the\ntools do what their authors say.\n\n**Automate the judgement.** Rejected, with a line drawn. `bin/prove` catches\nseven of the twelve \u2014 every defect that was stdout disagreeing with the\nfilesystem. It cannot catch the other five, and the boundary is sharp: it does\nnot know which plan a handoff should name, whether a page reads well for an\nexecutive, or that a test is measuring its host. Those need a reader who is not\nthe author. That is not a gap to close; it is what review is.\n\n# Consequences\n\nChanges get labelled as they are written, and the ones that read a corpus wait\nfor one. `synthetic_brain()` carries the cost of the common case, so the label\nusually means \"add a fixture\", not \"find a volunteer\".\n\nThe uncomfortable consequence is that **this decision cannot be enforced by\nthis repository.** Nothing here can tell whether a change inferred something,\nand the `bin/selftest` guard only catches the narrow case of a fixture reading\n`ROOT`. It is a question asked in review, honoured or not by the person\nanswering it.\n\nAsked whether that makes it a review checklist line pretending to be a\nconstant, the adopter found a better answer than the philosophical one: the\ndecision could not reach the code it governs. `knowledge-catalog/decisions/` is\nin the never-touched half of the split, so `bin/constraints bin/handoff` in an\nadopted brain reported *\"no decision declares that it governs these paths\"* \u2014\n**the one part of the record that could not ship with the code was the part\nabout the code.** The invariants of decisions constraining generic paths now\nship as `docs/upstream-invariants.md`, regenerated by `bin/index` and read by\n`bin/constraints` after the local catalog. An unenforceable decision that\ncannot even be *consulted* is a checklist line; one a tool surfaces against the\ndiff is at least a constant somebody has to answer for.\n\nSee [the running record of what the brain has caught](../reference/E0001-brain-in-practice.md)\nfor the four rounds this is drawn from, and\n[the principle that claims must be checkable](D0001-claims-must-be-checkable.md),\nof which this is the portability case.\n", "mtime": "2026-11-11T20:20:37+00:00"}, {"path": "knowledge-catalog/decisions/D0012-capture-is-separate-from-classification-and-capture-wins.md", "meta": {"id": "D0012", "type": "decision", "title": "Capture is separate from classification, and capture wins by default", "description": "Three adoptions put the brain's overhead at 15-25% per change, and the third located it: writing is cheap, choosing the category is the cost.", "timestamp": "2026-11-10", "tags": ["ceremony", "capture", "adoption"], "status": "active", "invariant": "Recording something the record does not know requires no decision about what kind of thing it is.", "constrains": ["bin/note", "bin/which", "bin/new", "knowledge-catalog/reference/agent-skills/**"]}, "body": "\n# Context\n\nThree adopters reported the same overhead and the third measured it:\n**15\u201325% per change**, and they located it exactly.\n\n> Writing is cheap, choosing the category is the cost and has no tool.\n\nThat is the whole finding. Every other decision in this brain has a tool \u2014\n`bin/new` allocates the id, `bin/lint` checks the shape, `bin/constraints`\nfinds what governs a path \u2014 and the decision taken most often, several times a\nday, had none. Seven types, most of them wrong for any given thing, chosen\nwhile the thing is still happening.\n\nThe same project reported what actually earned its keep, and it was not the\ntyped graph:\n\n> The project log carried the day \u2014 an append-only prose journal, barely a\n> typed node.\n\nIt caught a wrong cancellation policy before it reached every new family,\nstopped a link that would have silently broken acknowledgement tracking, and\nturned a second mislabelled notification into \"this is a pattern\". Meanwhile\n`constraints`, `ancestry`, `stale`, `reconcile` and the task graph went unused,\nbecause the real unit of work was *\"what did the client just say in email\"*.\n\nSo the costly step is the one with no payoff at the moment it is paid, and the\nvaluable step is the one the model treats as an afterthought.\n\n# Decision\n\n**Capture takes no type.** `bin/note \"<what happened>\"` appends a dated,\nuntyped entry to a running record, creating that record on first use. No\nfolder, no id, no required headings, no `serves:`. One command, and the gate\nstays clean \u2014 measured: a fresh `bin/note` entry lints at zero errors, where a\nfresh `bin/new evidence` node lints at two until a person hand-edits the\nscaffold away.\n\n**Classification is a later, optional step with its own tool.** `bin/which`\nasks the discriminating questions in the order that resolves fastest \u2014 has it\nalready happened; did you choose between alternatives that a change could\nviolate \u2014 and names the type and the exact `bin/new` command. Two questions\nsettle most cases. `bin/note --review` lists what has not been promoted.\n\n**Leaving an entry unclassified is a correct outcome, not debt.** A journal\nline that never becomes a node still did its job the day it was written. The\nreview list is a menu, not a queue.\n\n**Neither tool reads your text to guess.** D0011 holds: a tool inferring what\nthe adopter's content means is the failure class behind every semantic defect\nfound so far, and here the stakes invert \u2014 **a wrong type is worse than no\ntype, because a typed node looks decided.** You answer the questions; the tool\nonly knows the order to ask them in.\n\nThe running record is an ordinary `evidence` node carrying `append_only: true`\nand a declared `notes: true` marker. **No new node type** \u2014 the brain gains a\ncheaper door, not a different shape.\n\n# Alternatives\n\n**Classify at capture, with a keyword or model-based guess.** Rejected under\nD0011, and more sharply: the cost being removed is the cost of being wrong\nabout the type, so a guess relocates the cost rather than removing it, into a\nnode that now looks settled.\n\n**Fewer types.** Considered and rejected \u2014 the categories earn their keep in\nthe tools that traverse them, and adopters disputed where things sit, never\nthat the distinctions are real. The problem was never the taxonomy; it was\nbeing made to use it at the worst moment.\n\n**Leave it to habit, as before.** Rejected on evidence. Three adopters, three\nreports of the same overhead, and the one who measured it watched the typed\ngraph go unused while the untyped journal did the work.\n\n**A separate inbox file outside the catalog.** Rejected: it would be a second\nplace to look, invisible to `bin/relevant` and `bin/lint`, and the thing most\nworth finding later would be the thing least indexed.\n\n# Consequences\n\nThe default path into the brain is now one command with no decision in it, and\nthe brain's own instructions say so \u2014 `CLAUDE.md`'s reflex is `bin/note` first,\n`bin/new <type>` only when the answer is already known.\n\n**The honest cost is that the record will hold more unclassified prose**, and a\nbrain that never promotes anything degrades toward being a diary with a linter.\nThat is the correct trade against what it replaces \u2014 three projects' evidence\nis that the alternative was not a well-classified record but a thinner one,\nbecause capture did not happen at all.\n\nNothing measures whether promotion actually happens. `bin/note --review` shows\nthe backlog; no gate objects to it growing, deliberately, since objecting would\nreintroduce the obligation this removes.\n\n**This decision is confirmed by a corpus that cannot test it, and that is\nrecorded here so nobody mistakes the confirmation for evidence.** The project\nwhose measurement produced it watched an unclassified prose question become a\ndecision node within minutes, because the thinking was already on disk \u2014 real\nvindication of the capture half. But its only promotion mechanism is *a client\nanswering a question*, several times a week. A consulting brain has an external\nforcing function; it is **structurally immune to the failure mode this decision\nnames**, which is a backlog nobody ever returns to.\n\nTheir own warning, and it is the right one: generalising from that corpus would\nbe reading the one project that cannot exhibit the risk. The capture half is\nestablished. **The claim that leaving entries unclassified is safe is not**, and\nthe instrument for it is a project with no external party asking questions \u2014\nsolo work, or an internal codebase where nothing arrives from outside to force\na promotion. D0011's own logic applies: a conclusion drawn from one corpus\nshape is a conclusion about that shape.\n\n**That project then ran it, and the answer narrows this decision rather than\nconfirming it.** There was no backlog \u2014 and the tool did not invent one, which\nis worth saying because the honest result was available and reported. So the\nfeared failure mode did not appear in the corpus chosen for its ability to show\nit. That is not evidence of safety; it is one session's absence of harm.\n\nWhat it found instead is better than either answer. The operator believed a\nfinding had been lost because nobody captured it. It had been captured \u2014 a task\nlog, written minutes after the run it described. **Capture was not the\nfailure.** The finding needed to reach an artifact outside the repository\nentirely \u2014 a voice profile under `~/.claude/` \u2014 and **no tool here reaches\nacross that boundary**: not `bin/note`, not `bin/new`, not any gate. The record\nwas complete and the thing it was supposed to change never changed.\n\nSo the risk this decision worried about \u2014 prose piling up unclassified \u2014 is not\nthe risk that materialised. The real one is a **correctly captured, correctly\nclassified finding whose target lives where the brain cannot see it.** The\nbacklog was never the right thing to watch.\n\nSee [the running record of what the brain has caught](../reference/E0001-brain-in-practice.md).\n", "mtime": "2026-11-11T00:49:52+00:00"}, {"path": "knowledge-catalog/decisions/D0013-approach-is-optional-and-three-types-carry-the.md", "meta": {"id": "D0013", "type": "decision", "title": "Approach is optional, and three types carry the record", "description": "Measured across five corpora: four have zero plans, three have zero specs, and decision/task/evidence hold 93% of all nodes.", "timestamp": "2026-11-11", "tags": ["model", "categories", "adoption"], "status": "active", "invariant": "No tool requires a brain to have an Approach node, and no document implies one is expected.", "constrains": ["bin/lint", "bin/ancestry", "bin/handoff", "knowledge-catalog/reference/agent-skills/**"]}, "body": "\n# Context\n\nFive brains, counted rather than recalled:\n\n| corpus | decision | task | evidence | goal | plan | spec | principle |\n|---|---|---|---|---|---|---|---|\n| template | 12 | 12 | 3 | 1 | 1 | 0 | 1 |\n| consulting | 25 | 9 | 30 | 1 | **0** | **0** | 0 |\n| solo research | 15 | 12 | 8 | 4 | **0** | 1 | 0 |\n| solo, docs | 7 | 2 | 4 | 1 | **0** | **0** | 0 |\n| product team | 8 | 63 | 9 | 4 | 30 | 3 | 1 |\n\n**Four of five have no plans at all. Three of five have no specs.** `decision`,\n`task` and `evidence` are 219 of 235 nodes \u2014 93% \u2014 and all three appear in\nevery corpus. The one brain that uses Approach uses it heavily, and it is the\nonly multi-person product team in the set.\n\nSo Approach is not weak; it is **conditional on the work having a planning\nphase**. The consulting adopter put it plainly: *intent arrives from outside, as prose, at 20:51\non a Monday.* Consulting, solo research and document work go from a decision\nstraight to a task, and that is the normal case rather than a lapse.\n\nThe tools have been corrected one at a time as each adopter hit this \u2014\n`ancestry` terminating on a decision, `serves:` accepting one \u2014 but **nothing\nsays it out loud**, so three adopters each discovered independently that the\nlayer they were skipping was optional, and one stopped running `ancestry`\nentirely because every task read `\u26a0 UNTERMINATED`.\n\n# Decision\n\n**Approach is optional.** No tool requires a plan or a spec, and no document\nimplies a brain is incomplete without one. `CLAUDE.md` marks the row optional;\na brain with zero plans is a correct brain.\n\n**`decision`, `task` and `evidence` are the spine.** They are what a reader and\na tool can rely on being present. Guidance, question order and defaults are\nwritten for them first \u2014 which `bin/which` already does, asking the binding\ntest and the happened test before anything else.\n\n**All seven types stay.** In particular `spec` is kept, which reverses my own\nearlier recommendation and is the part worth recording.\n\n# Alternatives\n\n**Delete `spec`.** I proposed this from the count \u2014 4 nodes across 235 \u2014 and it\ndoes not survive contact with the cost. Deletion means a migration imposed on\nthe two brains that have one, the removal or repointing of `/to-spec`, and an\nedit to D0006, which distinguishes code review from spec review. The saving is\none line in a seven-question ladder where `spec` is already question six, so it\ncosts a reader almost nothing to skip.\n\n**Rarity is not the same as uselessness**, and the table makes it easy to\nconfuse them. `goal` is 11 nodes and `principle` is 2, and both are load-\nbearing: one goal anchors sixty tasks, and you are supposed to have few. The\nhonest reading of a small count is \"ask what it costs to keep\", not \"delete\".\n\n**Collapse Approach into Intent.** Rejected: The product team's 30 plans are doing real work\nand would have nowhere to go, and the distinction between *why* and *in what\norder* is exactly what a plan records.\n\n**Leave it implicit, as now.** Rejected on evidence. Three adopters each worked\nit out alone, one abandoned a tool over it, and the cost of saying it is a word\nin a table.\n\n# Consequences\n\nA brain with no Approach layer stops looking like an incomplete one. The\nlineage still terminates, because a task may serve a decision directly, and\n`ancestry` already distinguishes the two \u2014 a goal is an outcome the work was\nasked to reach, a decision a constraint it must respect.\n\n**What this does not fix:** `/grill-change \u2192 /to-spec \u2192 /to-tasks \u2192 /implement`\nis still written as one path, and for four of five corpora the middle step has\nnever been taken. The skills have not been rewritten here, and that is the next\nhonest piece of work rather than something this decision claims to have done.\n\n**And the count will drift.** These five brains are young \u2014 the oldest is\nmonths, not years \u2014 and a distribution taken at month three may not be the\ndistribution at year two. The claim defended here is narrow: *no tool may\nrequire Approach.* It is not a claim that nobody will ever plan.\n\nSee [the running record of what the brain has caught](../reference/E0001-brain-in-practice.md)\nfor the rounds this is drawn from.\n", "mtime": "2026-11-11T20:12:23+00:00"}, {"path": "knowledge-catalog/decisions/D0014-the-brain-describes-one-repository-and-can-point.md", "meta": {"id": "D0014", "type": "decision", "title": "The brain describes one repository and can point outside it, never vouch for it", "description": "A finding was captured correctly and still failed to land, because the artifact it needed to change lives outside the repo. The gap is now a stated boundary rather than an accident.", "timestamp": "2026-11-11", "tags": ["boundaries", "scope", "adoption"], "status": "active", "invariant": "No node may assert that an artifact outside the repository is current, and no tool may imply one has been checked beyond its existence.", "constrains": ["bin/lint", "bin/stale", "bin/unread", "knowledge-catalog/reference/agent-skills/**"]}, "body": "\n# Context\n\nAn adopter went looking for a finding they believed had been lost to missing\ncapture. It had not been lost: it was in a task log, written minutes after the\nrun it described. **What failed was downstream.** The finding needed to change\na voice profile at `~/.claude/voice/profile/professional.md`, outside the\nrepository, and nothing here crosses that boundary. The record was complete and\ncorrect while the thing it existed to change went on being wrong for eight\nhours.\n\nTheir own reading, which is why this is a decision rather than a line in the\nlog: *capture wasn't the failure*, and the cross-boundary gap *is a better\ntarget than the backlog ever would have been.*\n\nPart of the boundary is already crossed, and works. A node names an external\nartifact with `resource:`, `bin/lint` errors when the target does not exist and\nis silent when it does, and `bin/ancestry` and `bin/graph-build` traverse it.\nTwo adopters use it today. So the question was never \"can the record point\noutside itself\" \u2014 it can \u2014 but **what the record is entitled to claim about\nwhat it points at.**\n\n# Decision\n\n**The brain describes one repository.** It may point at an artifact outside\nthat repository and confirm the file is there. It may not assert that the file\nstill says what a node claims about it, and no tool will imply otherwise.\n\nStated where a reader meets it, in `CLAUDE.md`, because the thing that cost\neight hours was not the missing check \u2014 it was that **nobody had said the gap\nexisted**, so a complete record reasonably read as a landed change.\n\nA node describing an external artifact carries the limit in its own prose: what\nit claims, as of when, and that nothing verifies it is still true. That is the\nsame discipline D0005 was corrected into \u2014 `invariant:` is *surfaceable*, not\ncheckable \u2014 applied one boundary further out.\n\n# Alternatives\n\n**A drift tripwire.** A field carrying path and content hash, with a check that\nwarns when the file exists and differs, silent when absent so a teammate on\nanother machine is not spammed. Roughly a hundred lines, and genuinely\nverifiable \u2014 it can fail, which this record rates highly.\n\nRejected on maintenance, not on principle. The hash is stamped by hand, so\nafter any deliberate edit to the external file somebody must re-stamp or the\nwarning fires forever. **That is the permanently-red pattern this project has\nalready paid for twice** \u2014 the `example/` failures an adopter watched for two\nrounds and stopped reading, and `bin/unread` on a field a brain had kept\ndeliberately. Paths under `~/` are also machine-specific, so the artifact is\nvisible to one person and the node is committed for everybody. And it is\nceremony, which D0012 measured as the dominant cost of using this at all.\n\nOne failure, once, does not buy a standing obligation. If external artifacts\never become a *first-class subject* \u2014 a brain whose main concern is agent\nconfiguration, where skills, profiles and settings are all outside the repo by\nconstruction \u2014 that changes the arithmetic and this should be revisited.\n\n**Say nothing and leave it as it was.** Rejected: that is the state that cost\nthe eight hours. A gap nobody has named is indistinguishable from a gap nobody\nhas thought about.\n\n**Forbid external references entirely.** Rejected: two adopters point outside\ntoday, usefully, and existence checking is real verification. Removing it would\ndelete working behaviour to make a point.\n\n# Consequences\n\nThe limit is now readable rather than discoverable. A node may say *\"the voice\nprofile at `~/.claude/...` said X on 2026-11-10\"* and that is an honest,\ndated claim about a thing the brain cannot see; what it may not say is *\"the\nvoice profile says X\"* in the present tense, because nothing here can know.\n\n**What this does not fix, and it is the original complaint:** a correctly\ncaptured finding whose target is outside the repo can still fail to land. This\ndecision makes the gap legible; it does not close it. The instrument that would\nclose it is the tripwire above, and the condition for building it is a brain\nwhere external artifacts are the subject rather than an edge case.\n\nSee [the running record of what the brain has caught](../reference/E0001-brain-in-practice.md)\nand [T0011](../../tasks/formalize/T0011-decide-what-the-brain-owes-an-artifact-outside.md),\nwhich asked the question.\n", "mtime": "2026-11-11T14:27:53+00:00"}, {"path": "knowledge-catalog/decisions/index.md", "meta": {}, "body": "# Decisions\n\nChoices made, with the alternatives considered and the evidence behind them.\nNumbered in the `D` sequence, which **principles share** \u2014 a principle is a\ndecision with no alternatives and no expiry. Superseded, never deleted.\n\n| id | | Title |\n|---|---|---|\n| [D0001](D0001-claims-must-be-checkable.md) | principle | The record is only worth keeping if its claims are checkable |\n| [D0002](D0002-four-categories.md) | decision | Every node belongs to one of four categories, and nothing cites a node newer than itself |\n| [D0003](D0003-identifiers.md) | decision | Identifiers are a type letter and a flat global four-digit sequence |\n| [D0004](D0004-placement-and-install.md) | decision | The brain is embedded in the repository by default, and installing it is two steps |\n| [D0005](D0005-intent-layer-wiring.md) | decision | Approach nodes name the goal they serve, and decisions carry a machine-readable claim |\n| [D0006](D0006-review-split.md) | decision | Code review judges the artifact, spec review judges the intent |\n| [D0007](D0007-status-ownership.md) | decision | Every status transition has one named owner, and the brain is kept current in three layers |\n| [D0008](D0008-a-blocker-is-a-node.md) | decision | A blocker is a node, not a sentence |\n| [D0009](D0009-an-open-question-is-a-task.md) | decision | An open question that blocks work is a task; one that blocks nothing is a note |\n| [D0010](D0010-init-is-a-document.md) | decision | The one thing you run before the skills load is a document, not a skill |\n| [D0011](D0011-a-change-that-reads-the-adopter-s-corpus.md) | decision | A change that reads the adopter's corpus needs a corpus that is not yours |\n| [D0012](D0012-capture-is-separate-from-classification-and-capture-wins.md) | decision | Capture is separate from classification, and capture wins by default |\n| [D0013](D0013-approach-is-optional-and-three-types-carry-the.md) | decision | Approach is optional, and three types carry the record |\n| [D0014](D0014-the-brain-describes-one-repository-and-can-point.md) | decision | The brain describes one repository and can point outside it, never vouch for it |\n", "mtime": "2026-11-11T14:27:26+00:00"}, {"path": "knowledge-catalog/glossary.md", "meta": {"type": "glossary", "title": "Glossary", "description": "Shared vocabulary for this project.", "timestamp": "<YYYY-MM-DD>", "tags": ["glossary"], "status": "active"}, "body": "\n# Glossary\n\nThe vocabulary this project is described in. If a concept is missing, either the language is\nbeing invented \u2014 reconsider \u2014 or there is a real gap, so add it. Each term: a tight definition,\nand an `_Avoid_` list where a near-synonym would mislead.\n\n## Task\n\nOne unit of work, one file under `brain/tasks/<initiative>/`, with an id like `T0042`. The only\nnode type in the **Action** category, and the only one that is executable.\n\n_Avoid_: **ticket**, **issue**, **story**, **card**. All four name the same thing, and the type\nis `task`, the folder is `tasks/`, the template is `task.md`. One concept, one word.\n\n## Frontier\n\nTracker term. The tasks that are `Ready for Development`, unclaimed, and whose every blocker is\ndone. `brain/bin/status` computes it.\n\n## Lineage\n\nThe chain from a task back to the intent that asked for it: task \u2192 spec \u2192 goal, with decisions\nconstraining the route. `brain/bin/ancestry` walks it. A lineage that does not reach a goal or a\nprinciple is **unterminated**, which means work shipped with no recorded intent.\n\n_Avoid_: **provenance** (which is about where a fact came from \u2014 that is `resource:` on an\nevidence node), **history** (which is git's).\n\n## Drift vs omission\n\n**Drift** is building something subtly different from what was asked. **Omission** is never\nbuilding part of it. The reverse walk finds drift; only the forward walk\n(`brain/bin/ancestry <id> --forward`) finds omission, and a green test suite hides it best.\n", "mtime": "2026-11-07T16:48:52+00:00"}, {"path": "knowledge-catalog/goals/G0001-a-brain-others-can-adopt.md", "meta": {"id": "G0001", "type": "goal", "title": "A brain someone else can adopt without being told how", "description": "An operator who has never seen this repository can fork it, install it into a project they are already halfway through, and have the record stay true without maintaining it by hand.", "timestamp": "2026-11-07", "tags": ["brain", "onboarding", "portability"], "status": "active"}, "body": "\n# Goal\n\nSomeone who is not the author can take this repository, point it at a project\nthat is **already in flight**, and end up with a record that stays true as the\nwork proceeds \u2014 without being taught the system first, and without a ritual\nthey have to remember to perform.\n\nThree audiences, in order of how hard they are to serve:\n\n1. **The author, on a new project.** Already satisfied by the template.\n2. **A colleague who was handed the link.** Needs the model explained once, in\n   the README, and an install that is one command.\n3. **An agent working unattended inside someone else's project.** Needs the\n   model in `CLAUDE.md`, the reflexes stated as obligations, and transitions\n   that happen as a side effect of the work rather than because somebody\n   remembered.\n\n# Why\n\nThe template works for the person who built it, which is the weakest possible\nevidence that it works. Everything that is currently carried in the author's\nhead \u2014 which skill to reach for, where a node goes, when to update a status \u2014\nis a thing a second operator does not have and an agent cannot infer.\n\nThe failure this guards against is specific and it is not \"nobody adopts it\".\nIt is **adoption followed by quiet rot**: the brain gets installed, a dozen\nnodes get written, the statuses stop matching reality, and six weeks later it\nis a graveyard that still looks maintained. A record nobody trusts is worse\nthan no record, because it is read.\n\n# Signals\n\n- A fork, a clone, `bin/adopt` and `INIT.md` produce a usable brain in a\n  project with existing code, existing docs and no prior brain.\n- `bin/doctor` passes on that install without the operator editing anything by\n  hand.\n- An agent given only `CLAUDE.md` places a new node in the right category and\n  reaches for the right skill, without the operator naming either. **Split,\n  because one half is measurable and the other is not:**\n  - *Mechanical:* every field a tool reads is named in `CLAUDE.md`. An agent\n    cannot use what it has not been told exists, and three corpora show the\n    consequence \u2014 invented fields (`supersedes`, `intent:`, `owner`) and a\n    decision layer that no tool could surface because `constrains:` was never\n    mentioned. Checked by `bin/selftest`.\n  - *Judgement:* whether the placement is actually right. No check can know\n    this, and the only instrument is reading what an agent did in a session\n    nobody coached. Measured three times so far, all three mis-sorting\n    something \u2014 the commonest being a choice that arrived as prose from\n    outside, filed as evidence rather than as a decision.\n- Task statuses match reality without the operator having asked for them to be\n  updated.\n- `bin/lint` and `bin/stale` are green on a brain that has been in use for a\n  month.\n", "mtime": "2026-11-11T01:17:11+00:00"}, {"path": "knowledge-catalog/goals/G0002-the-brain-returns-more-than-it-costs-to.md", "meta": {"id": "G0002", "type": "goal", "title": "The brain returns more than it costs to keep", "description": "Adoption was the only goal on record, so nothing measured whether the thing adopted was worth having. Written late, with numbers that already exist.", "timestamp": "2026-11-11", "tags": ["value", "ceremony", "adoption"], "status": "active"}, "body": "\n# Goal\n\nKeeping the record costs less than the mistakes it prevents, for somebody who\nis not its author and has no stake in it succeeding.\n\n# Why\n\n**This goal is written late, and the lateness is the point.** For twenty-one\nrounds the only goal on record was\n[G0001](G0001-a-brain-others-can-adopt.md) \u2014 *a brain someone else can adopt\nwithout being told how* \u2014 which measures whether the thing installs, not\nwhether it was worth installing. Asked directly whether the brain is worth\nusing, the honest answer was that the question was partly unanswerable,\nbecause **you cannot fail at a goal you never stated.**\n\nThat is the failure D0001 exists to prevent, sitting in the goal layer of the\nproject built to prevent it, for five months.\n\nAdoption is now broadly met and value is not measured. One adopter said\nplainly: *\"Worth it, but almost none of the value came from the parts the\nmodel is built around.\"* A statement like that is the most useful thing in the\nrecord and it had nothing to be checked against.\n\n# Signals\n\nNumbers that already exist, so this is not aspirational from day one:\n\n- **Ceremony stays under 10% per change.** Measured at 15\u201325% by a consulting\n  adopter before `bin/note` and `bin/which`, and ~5% after \u2014 though they\n  attributed the drop to the record having pre-framed the question rather than\n  to either tool, and the cost **relocated to retrieval** rather than\n  disappearing. Retrieval grows with the record where classification is flat\n  per item, so this signal gets harder with age, which is correct.\n- **A tool the operator reaches for unprompted.** `bin/relevant` has been named\n  *\"the best tool per keystroke\"* by one adopter and used unprompted on real\n  work by another. `constraints`, `ancestry`, `stale`, `reconcile` and the task\n  graph went unused in at least one corpus each. **A tool nobody reaches for is\n  a cost, not a feature**, and the honest response to a persistent one is\n  deletion.\n- **A mistake the record demonstrably prevented, named by somebody else.**\n  Three exist: a 24-versus-48-hour cancellation policy caught before it reached\n  every family, a direct PDF link that would have silently broken\n  acknowledgement tracking, and a second mislabelled notification turned into\n  *\"this is a pattern\"*. All three came from an append-only prose journal, not\n  from the typed graph.\n- **The record is consulted when it is inconvenient.** Supersede discipline\n  mattered most to one adopter on a day they were wrong three times and the\n  wrong versions stayed visible. A record only read when it agrees with you is\n  not being used.\n- **Somebody keeps it for a quarter without being asked to.** The oldest brain\n  here is months old. Nothing has yet survived long enough for staleness to be\n  the dominant risk, which is the condition under which all of the above gets\n  genuinely hard.\n\n# What would disprove this\n\nAn adopter who keeps the record faithfully for a quarter and cannot name a\nmistake it prevented. That is a cheaper outcome to discover than it looks, and\nit has not been tested \u2014 every corpus here is younger than the question.\n", "mtime": "2026-11-11T16:30:08+00:00"}, {"path": "knowledge-catalog/goals/index.md", "meta": {}, "body": "# Goals\n\nWhat done looks like, and the signals that say so. A goal is an outcome, never\nan implementation; the plans and specs that pursue it name it in their\n`serves:` field, and every lineage walk terminates here.\n\n| id | Status | Title |\n|---|---|---|\n| [G0001](G0001-a-brain-others-can-adopt.md) | active | A brain someone else can adopt without being told how |\n| [G0002](G0002-the-brain-returns-more-than-it-costs-to.md) | active | The brain returns more than it costs to keep |\n", "mtime": "2026-11-11T16:29:44+00:00"}, {"path": "knowledge-catalog/howto.md", "meta": {}, "body": "# How to use the knowledge catalog\n\nThe durable record of goals, decisions, plans and findings for this project.\nEvery entry is markdown plus YAML frontmatter in Google's Open Knowledge Format\n(OKF), organized as a cross-linked graph.\n\n## How it's used\n\nAn agent **searches this catalog before making a significant decision**\n(`brain/bin/relevant`, `brain/bin/constraints`) and surfaces the relevant\nentries, with followable links, as justification. During normal work it\n**passively captures** durable decisions here and reports what it wrote at the\nend of the session.\n\n## If you're hand-editing these files, you're probably doing it wrong\n\nThe intended path is through the skills \u2014 `/grill-change` before a change,\n`/to-tasks` to cut the work, `/spec-review` after, `/audit` to reconcile.\n`/to-spec` sits between the first two when the work has a planning phase, and\nfour of five brains built so far have never used it.\nThey handle the format, the taxonomy, the ids and the cross-linking;\n`bin/new` keeps the indexes, the change log and the graph in step, and\n`bin/index` rebuilds any folder index from the nodes present.\n\nYou *can* hand-edit; it is only markdown. If you do, run `brain/bin/lint`. It\nblocks malformed entries, and everything below is something it checks.\n\n## The four categories\n\nEvery node belongs to exactly one, and they run left to right\n([D0002](decisions/D0002-four-categories.md)):\n\n| Category | Types | Answers |\n|---|---|---|\n| **Intent** | `goal`, `decision`, `principle` | what we are trying to do, and what we have settled |\n| **Approach** *(optional)* | `plan`, `spec` | how we mean to do it |\n| **Action** | `task` | what gets done |\n| **Evidence** | `evidence` | what we observed, and what it corrects |\n\n**Approach is optional.** A brain with no plans is a correct brain: where the\nintent arrives from outside as prose, a task names the decision it serves and\nthe lineage still terminates. Four of five brains have no plans at all, and\n`decision`, `task` and `evidence` are 219 of 235 nodes written across them\n([the decision that Approach is optional](decisions/D0013-approach-is-optional-and-three-types-carry-the.md)).\n\n`glossary` sits outside the four: it is definitional, not a claim about the\nwork.\n\n**Nothing cites a node newer than itself.** Intent \u2192 Approach \u2192 Action is the\nusual order because intent usually comes first, but a goal written today may\ncite evidence an earlier effort produced. What is forbidden is editing that\nearlier node to point at the new one, because a reader would then see a\njustification that did not exist when it was written. Two edges are sanctioned\nexceptions \u2014 `superseded_by` and `amends` \u2014 because a reader who reaches a\nstale node must be carried to what replaced it.\n\n## Ids\n\nA type letter plus four digits, flat and global\n([D0003](decisions/D0003-identifiers.md)):\n\n`G` goal \u00b7 `D` decision *and* principle \u00b7 `P` plan \u00b7 `S` spec \u00b7 `T` task \u00b7 `E` evidence\n\nThe id lives in the frontmatter **and** as the filename prefix, and the linter\nchecks they agree. `brain/bin/new <type>` allocates it; never pick one by hand,\nand never renumber except with `brain/bin/renumber` to resolve a collision.\n\n## Types and their body headings\n\n| Type | Headings |\n|---|---|\n| `goal` | `# Goal` \u00b7 `# Why` \u00b7 `# Signals` |\n| `decision` | `# Context` \u00b7 `# Decision` \u00b7 `# Alternatives` \u00b7 `# Consequences` |\n| `principle` | `# Principle` \u00b7 `# Rationale` \u00b7 `# Implications` |\n| `plan` | `# Goal` \u00b7 `# Approach` \u00b7 `# Sequence` \u00b7 `# Risks` |\n| `spec` | see [templates/spec.md](reference/agent-skills/templates/spec.md) |\n| `task` | `# What to build` \u00b7 `# Acceptance criteria` \u00b7 `# Out of scope` \u00b7 `# Log` |\n| `evidence` | free-form prose, optionally `# Citations` |\n\n`index.md`, `log.md`, `howto.md`, `README.md`, `TODO.md`, `map.md` and the\nthree agent-skills configuration files are reserved \u2014 no `type`, no `id`.\n\nTemplates for each live in\n[reference/agent-skills/templates/](reference/agent-skills/templates/).\n\n## Status\n\nTwo vocabularies, disjoint by type. A `task` uses the tracker's lifecycle\n(`Not Ready` \u2192 `Ready for Development` \u2192 `In Progress` \u2192 `Testing` \u2192\n`Complete` \u2192 `Delivered`, plus `Superseded`). Everything else uses the document\nlifecycle: `draft`, `active`, `amended`, `superseded`, `deprecated`. `amended`\napplies only to a decision or a principle, and exists so a decision corrected\nin detail does not read as untouched.\n\n## Conventions\n\n- **Supersede, don't delete.** When a decision changes, set\n  `status: superseded`, link the replacement in the body, and record it in\n  [log.md](log.md). Hard-delete only genuinely erroneous entries.\n- **An Approach node names the goal it serves.** `serves:` on a plan or a spec\n  is what lets a reverse walk terminate in Intent. Without it, `bin/ancestry`\n  stops at the spec and the review has no why to check against.\n- **A decision declares what it governs.** `invariant:` is one sentence a\n  change could violate; `constrains:` lists the paths it covers. That is how\n  `bin/constraints` finds it without guessing at vocabulary.\n- **A running record carries `append_only: true`.** A project log, an\n  open-questions list, a state snapshot: its content legitimately runs ahead\n  of its timestamp, so the direction rule leaves it alone. A `task` gets this\n  for free \u2014 it has a `# Log` by construction.\n- **An import dates a node by its origin, never by the import.** Stamping\n  today's date on a document written in July makes every decision that cites\n  it look like a violation. Take the date from the filename, or from git's\n  first-commit date \u2014 which is why an import uses `git mv`.\n- **A running record is dated when it was opened, not when it was last\n  appended.** Each entry carries its own date; the frontmatter carries the\n  file's. Re-dating on every append would invalidate every citation of it,\n  because the direction rule would correctly see an older node citing a newer\n  one.\n- **Cite a node with a link, never in backticks.** A backticked citation is a\n  lost edge: invisible to the graph, unfollowable by a reader, and unchecked\n  by anything, so it rots the first time something is renamed. `bin/relink`\n  converts them. A bare file *name* in prose \u2014 `config.md` \u2014 is not a citation\n  and should stay as it is.\n- **Anything measured records the measurement**, with its denominator and its\n  date, so a future reader can re-check it rather than believe it.\n- **A stale note that reads as current is worse than no note.** Correct in\n  place and say what changed. `brain/bin/stale` catches the countable cases;\n  `brain/bin/reconcile` catches status against the repository.\n- **Source material is quoted, analysis is linked.** The brief lives verbatim\n  under `brain/brief/` as `evidence` with a `resource:`; anything derived from\n  it says so and shows the arithmetic.\n- **Quote any frontmatter value containing `#` or `: `.** Unquoted, a ` #`\n  opens a YAML comment and silently truncates the value, and a `: ` is a hard\n  parse error. The linter catches both.\n- **Use relative links** (`./sibling.md`, `../decisions/x.md`). A link starting\n  with `/` resolves from the repo root on GitHub and 404s; the linter errors on\n  those.\n- **A blocker is a node, not a sentence** (a blocker is a node). Another task, a whole plan\n  (which clears when its initiative is finished), or \u2014 for anything external \u2014\n  the actionable task hiding inside it, which is usually an email. A reason\n  that is neither is a constraint or a note, not a blocker.\n- **An open question that blocks work is a task** with `category: question`\n  (an open question is a task). One that blocks nothing stays evidence. There is no type for a\n  question.\n- **A fix lands with its check.** Anything a real adoption reports and that\n  changes code gets a named case in `bin/selftest`'s regression layer. Four\n  rounds of feedback produced roughly twenty changes and five checks, and the\n  same three classes \u2014 a parser, a laundering path, an install recipe \u2014 each\n  came back twice. A finding without a check is a finding you will be told\n  about again.\n- **A handoff is a projection, not a node.** `bin/handoff` renders one from\n  the graph plus a hand-written half under `plans/<initiative>/handoff/`. What\n  gets recorded is the *event* \u2014 handed to whom, when, promising what \u2014 as an\n  `append_only` evidence node, one per audience. Append when the document got\n  better; supersede when the promise changed. **Nothing ever requires a\n  handoff to exist.**\n- **Link liberally.** A link to a document not yet written is a valid marker of\n  future work.\n", "mtime": "2026-11-11T18:15:52+00:00"}, {"path": "knowledge-catalog/index.md", "meta": {"okf_version": "0.1"}, "body": "\n# Knowledge Catalog\n\nDurable knowledge about this project \u2014 the *why* that points at the code, not a\nrestatement of it. See [howto.md](howto.md) before editing by hand.\n\n## The four categories\n\n| Category | Lives in |\n|---|---|\n| **Intent** | [goals/](goals/index.md), [decisions/](decisions/index.md) \u2014 including principles |\n| **Approach** | [specs/](specs/index.md), and [../plans/](../plans/index.md) outside this catalog |\n| **Action** | [../tasks/](../tasks/README.md) |\n| **Evidence** | [reference/](reference/index.md), and [../brief/](../brief/README.md) for what was given |\n\n## Reference\n\n* [Glossary](glossary.md) \u2014 the shared vocabulary for this domain\n* [Change log](log.md) \u2014 what was written when\n", "mtime": "2026-11-07T16:33:29+00:00"}, {"path": "knowledge-catalog/log.md", "meta": {}, "body": "# Change log\n\nNewest first. `**Creation**` / `**Update**` / `**Supersession**`.\n\n## 2026-11-11\n\n**Creation** \u2014 [G0002](goals/G0002-the-brain-returns-more-than-it-costs-to.md) The brain returns more than it costs to keep\n\n**Creation** \u2014 [D0014](decisions/D0014-the-brain-describes-one-repository-and-can-point.md) The brain describes one repository and can point outside it, never vouch for it\n\n**Creation** \u2014 [D0013](decisions/D0013-approach-is-optional-and-three-types-carry-the.md) Approach is optional, and three types carry the record\n\n## 2026-11-10\n\n**Creation** \u2014 [T0011](../tasks/formalize/T0011-decide-what-the-brain-owes-an-artifact-outside.md) Decide what the brain owes an artifact outside the repository\n\n**Creation** \u2014 [D0012](decisions/D0012-capture-is-separate-from-classification-and-capture-wins.md) Capture is separate from classification, and capture wins by default\n\n## 2026-11-09\n\n**Creation** \u2014 [D0011](decisions/D0011-a-change-that-reads-the-adopter-s-corpus.md) A change that reads the adopter's corpus needs a corpus that is not yours\n\n## 2026-11-08\n\n**Creation** \u2014 [D0008](decisions/D0008-a-blocker-is-a-node.md) A blocker is a node, not a sentence\n\n**Creation** \u2014 [D0009](decisions/D0009-an-open-question-is-a-task.md) An open question that blocks work is a task; one that blocks nothing is a note\n\n**Creation** \u2014 [E0003](reference/E0003-adoption-greenfield.md) Adoption feedback: greenfield embedded install\n\n## 2026-11-07\n\n**Creation** \u2014 the brain's own Intent layer, written while formalising the\ntemplate for distribution: [G0001](goals/G0001-a-brain-others-can-adopt.md)\nand [D0001](decisions/D0001-claims-must-be-checkable.md) through\n[D0007](decisions/D0007-status-ownership.md). These are also the worked\nexample a new adopter reads, which is why they live here rather than in a\nscratch document.\n\n**Creation** \u2014 `bin/diagram` and `docs/lineage.svg`, the four-category picture\nthe README leads with. Generated rather than drawn so its palette cannot drift\nfrom `bin/graph-build`.\n\n## 2026-10-31\n\n**Creation** \u2014 catalog scaffolded from the brain template: buckets,\nconventions, the agent-skills adaptation layer, `bin/` tools and the skills.\n", "mtime": "2026-11-11T16:29:44+00:00"}, {"path": "knowledge-catalog/reference/E0001-brain-in-practice.md", "meta": {"id": "E0001", "type": "evidence", "title": "The brain in practice", "description": "A running record of what the brain catches, costs and changes in use, appended as it happens so claims about the system can be checked rather than asserted.", "timestamp": "2026-10-30", "tags": ["brain", "meta"], "status"
